      <span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 4 15 15m-2-15L4 19M4 4l4 1-3 3zm16 0-4 1 3 3zM3 17l4 4m10-4 4 4"/></svg>Thần Lộ</span>
      <span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16h12l-2-3V9a4 4 0 0 0-8 0v4zM10 19h4"/></svg>Lời nhắc</span>
      <span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18m-16-7 14 14M5 19 19 5"/></svg>Thành tích</span>
    </nav>
  </div>
  <dialog id="sheet" aria-labelledby="sheet-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    'use strict';
    // Isolated UX prototype: no app APIs, credentials, rewards or real records.
    const DAY = '2026-10-16', NEXT_DAY = '2026-10-17', NEXT_WEEK = '2026-10-19';
    const KEY = 'minh-anh-habit-design-demo-v1';
    const $ = (query, root = document) => root.querySelector(query);
    const sheet = $('#sheet'), main = $('#main');
    const escape = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const num = value => Number(value).toLocaleString('vi-VN', {maximumFractionDigits:2});
    const dateLabel = iso => new Date(iso + 'T12:00:00Z').toLocaleDateString('vi-VN',{timeZone:'UTC',day:'2-digit',month:'2-digit'});
    const weekday = iso => (new Date(iso+'T12:00:00Z').getUTCDay()+6)%7;
    const addDays = (iso,count) => {const d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+count);return d.toISOString().slice(0,10);};
    const iconPaths = {plus:'M12 5v14M5 12h14',check:'m5 12 4 4 10-10',close:'m6 6 12 12M18 6 6 18',chevron:'m9 5 7 7-7 7',more:'M5 12h.01M12 12h.01M19 12h.01',edit:'m16 3 5 5-12 12-5 1 1-5zM14 5l5 5',clock:'M12 7v5l3 2',archive:'M4 8h16v12H4zM3 4h18v4H3zM9 12h6',count:'M5 9h14M4 15h14M10 4 7 20M17 4l-3 16',moon:'M20 15A8 8 0 0 1 9 4a8 8 0 1 0 11 11',history:'M4 9V4m0 5h5M4 9a8 8 0 1 1-1 7M12 8v5l3 2',restore:'M5 7H2V4m0 3a9 9 0 1 1 0 9',reset:'M4 7V3m0 4h4M4 7a8 8 0 1 1-1 8'};
    const icon = (name) => `<svg viewBox="0 0 24 24" aria-hidden="true">${name==='clock'?'<circle cx="12" cy="12" r="8"/>':''}<path d="${iconPaths[name] ?? iconPaths.more}"/></svg>`;
    const initial = () => [
      {id:'meditate',name:'Thiền',metric:'check',target:1,unit:'lần',cadence:'daily',days:[0,2,4],quota:3,value:0,note:'',reminder:'',commitment:'2026-09-01'},
      {id:'read',name:'Đọc sách',metric:'duration',target:20,unit:'phút',cadence:'daily',days:[0,2,4],quota:3,value:15,note:'',reminder:'21:00',slot:{time:'19:00',minutes:20},commitment:'2026-09-01'},
      {id:'workout',name:'Tập luyện',metric:'check',target:1,unit:'lần',cadence:'weekly',days:[0,2,4],quota:3,completed:2,value:0,note:'',reminder:'',commitment:'2026-09-07'},
      {id:'water',name:'Uống nước',metric:'quantity',target:8,unit:'ly',cadence:'daily',days:[0,2,4],quota:3,value:8,note:'',reminder:'',commitment:'2026-09-01'},
      {id:'walk',name:'Đi bộ',metric:'duration',target:20,unit:'phút',cadence:'weekdays',days:[1,3,5],quota:3,value:0,note:'',reminder:'',commitment:'2026-09-01'}
    ];
    let habits=initial(), panel='track', span=7, archivedView=false, toastTimer, focusBeforeSheet, lastUndo;
    try {const stored=JSON.parse(localStorage.getItem(KEY));if(stored?.version===1&&Array.isArray(stored.habits)&&stored.habits.length<=30&&stored.habits.every(h=>h&&typeof h.id==='string'&&typeof h.name==='string'&&['check','quantity','duration'].includes(h.metric)&&Number.isFinite(h.target)&&h.target>0&&Number.isFinite(h.value)&&h.value>=0&&['daily','weekly','weekdays'].includes(h.cadence)&&Array.isArray(h.days)))habits=stored.habits;} catch {}
    const persist = () => {try{localStorage.setItem(KEY,JSON.stringify({version:1,habits}));}catch{}};
    const cadenceLabel = h => h.cadence==='daily'?'Hằng ngày':h.cadence==='weekly'?h.quota+' ngày mỗi tuần':h.days.map(d=>d===6?'CN':'T'+(d+2)).join(' · ');
    const met = h => h.value>=h.target;
    const scheduled = h => h.commitment<=DAY&&(h.cadence!=='weekdays'||h.days.includes(weekday(DAY)));
    const weeklyCount = h => Math.min(h.quota,(h.completed||0)+(met(h)&&scheduled(h)?1:0));
    const effective = (draft,original) => draft.cadence==='weekly'||original?.cadence==='weekly'?NEXT_WEEK:NEXT_DAY;
    function toast(message,undo){clearTimeout(toastTimer);const node=$('#toast');node.replaceChildren(document.createTextNode(message));lastUndo=undo;if(undo){const b=document.createElement('button');b.textContent='Hoàn tác';b.addEventListener('click',()=>{const action=lastUndo;lastUndo=null;action?.();node.classList.remove('visible');});node.append(b);}node.classList.add('visible');toastTimer=setTimeout(()=>{node.classList.remove('visible');lastUndo=null;},undo?6500:3000);}
    function closeSheet(){if(sheet.open)sheet.close();}
    sheet.addEventListener('close',()=>{document.body.classList.remove('sheet-open');if(focusBeforeSheet?.isConnected)focusBeforeSheet.focus({preventScroll:true});});
    sheet.addEventListener('click',event=>{if(event.target===sheet){const r=sheet.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeSheet();}});
    function openSheet(title,body,footer=''){
      if(!sheet.open)focusBeforeSheet=document.activeElement;
      sheet.innerHTML=`<div class="handle" aria-hidden="true"></div><header class="sheet-header"><h2 id="sheet-title">${escape(title)}</h2><button class="icon-button" type="button" data-close aria-label="Đóng">${icon('close')}</button></header><div class="sheet-body">${body}</div>${footer?`<footer class="sheet-footer">${footer}</footer>`:''}`;
      $('[data-close]',sheet).addEventListener('click',closeSheet);document.body.classList.add('sheet-open');if(!sheet.open)sheet.showModal();$('.sheet-body',sheet).scrollTop=0;
    }
    function row(h){
      const outside=!scheduled(h),future=h.commitment>DAY,done=met(h);
      const urgent=h.cadence==='weekly'&&scheduled(h)&&!done&&h.quota-weeklyCount(h)>7-weekday(DAY)-1;
      const sub=future?'Bắt đầu '+dateLabel(h.commitment):outside?'Ngoài lịch hôm nay':urgent?'Cần đạt hôm nay':h.cadence==='weekly'&&weeklyCount(h)>=h.quota?'Đã đủ mục tiêu tuần':h.slot?'Lịch '+h.slot.time:h.cadence==='weekly'?'Tuần này '+weeklyCount(h)+'/'+h.quota+' ngày':cadenceLabel(h);
      const left=`<button class="check-button" data-action="tick" data-id="${escape(h.id)}" aria-label="${done?'Bỏ hoàn thành, đặt về 0':'Hoàn thành đủ mục tiêu'} ${escape(h.name)} hôm nay" aria-pressed="${done}"><span class="check-box">${done?icon('check'):''}</span></button>`;
      const amount=h.metric!=='check'?`<button class="quantity-button ${done?'is-met':''}" data-action="log" data-id="${escape(h.id)}" aria-label="${num(h.value)} trên ${num(h.target)} ${escape(h.unit)}, chỉnh tổng ${escape(h.name)} hôm nay"><strong>${num(h.value)}</strong><span> / ${num(h.target)} ${escape(h.unit)}</span></button>`:'';
      return `<article class="habit-row ${done?'is-met':''}" data-habit="${escape(h.id)}">${left}<div class="habit-copy"><button class="habit-name" data-action="detail" data-id="${escape(h.id)}">${escape(h.name)}</button><p class="habit-meta ${urgent?'urgent':''}" title="${escape(sub)}">${escape(sub)}</p></div>${amount}<button class="row-more" data-action="menu" data-id="${escape(h.id)}" aria-label="Tùy chọn ${escape(h.name)}">···</button></article>`;
    }
    function rangeControl(value,maximum,label,attributes={}){
      const max=Math.min(1000000,Math.max(0.01,maximum)),fill=Math.min(100,value/max*100);
      const step=Number.isInteger(value)&&Number.isInteger(max)?1:0.01;
      return `<input type="range" class="duration-range" min="0" max="${max}" step="${step}" value="${value}" style="--fill:${fill}%" aria-label="${escape(label)}" aria-valuetext="${num(value)} phút" ${Object.entries(attributes).map(([key,v])=>`${key}="${escape(v)}"`).join(' ')}>`;
    }
    function updateRange(range,value,expand=false){
      if(expand&&value>Number(range.max))range.max=String(value);
      range.step=Number.isInteger(value)&&Number.isInteger(Number(range.max))?1:0.01;
      range.value=String(Math.min(Number(range.max),Math.max(Number(range.min),value)));
      const min=Number(range.min),max=Number(range.max),current=Number(range.value);
      range.style.setProperty('--fill',Math.min(100,(current-min)/(max-min||1)*100)+'%');
      range.setAttribute('aria-valuetext',num(current)+' phút');
    }
    function historyDays(h,count=7){
      return Array.from({length:count},(_,i)=>{const iso=addDays(DAY,i-count),wd=weekday(iso);if(iso<h.commitment)return {iso,status:'neutral',value:0};if(h.cadence==='weekdays'&&!h.days.includes(wd))return {iso,status:'neutral',value:0};if(h.cadence==='weekly'){const success=[0,2,4,1,3,5,6].slice(0,h.quota).includes(wd);return {iso,status:success?'met':'neutral',value:success?h.target:0};}const epoch=Math.floor(Date.parse(iso+'T12:00:00Z')/86400000),success=(epoch+h.id.length)%6!==1;return {iso,status:success?'met':'miss',value:success?h.target:0};});
    }
    const outcomeLabel = status => status==='met'?'Đạt mục tiêu':status==='miss'?'Chưa đạt cam kết':'Không có cam kết thiếu';
    function dayMark(day){const label=dateLabel(day.iso)+' · '+outcomeLabel(day.status);return `<span class="day-mark ${day.status}" title="${escape(label)}" aria-label="${escape(label)}">${day.status==='met'?icon('check'):day.status==='miss'?'×':'–'}</span>`;}
    function progressKey(){return '<div class="progress-key"><span><i class="day-mark met" aria-hidden="true">✓</i>Đạt</span><span><i class="day-mark miss" aria-hidden="true">×</i>Thiếu</span><span><i class="day-mark neutral" aria-hidden="true">–</i>Ngoài cam kết / linh hoạt</span></div>';}
    function calendar(h,count=7){return `<div class="history-strip" aria-label="${count} ngày đã kết thúc, chỉ xem">${historyDays(h,count).map(d=>`<div><small>${dateLabel(d.iso)}</small>${dayMark(d)}</div>`).join('')}</div>`;}
    function progressTable(list){
      const dates=Array.from({length:7},(_,i)=>addDays(DAY,i-7));
      return `<table class="progress-table"><caption class="screen-reader-only">Tiến bộ 7 ngày đã kết thúc, mỗi thói quen một hàng</caption><colgroup><col>${'<col>'.repeat(7)}</colgroup><thead><tr><th scope="col">Thói quen</th>${dates.map(iso=>`<th scope="col" aria-label="${dateLabel(iso)}">${weekday(iso)===6?'CN':'T'+(weekday(iso)+2)}<span>${Number(iso.slice(-2))}</span></th>`).join('')}</tr></thead><tbody>${list.map(h=>`<tr><td><button class="habit-name" data-action="detail" data-id="${escape(h.id)}">${escape(h.name)}</button></td>${historyDays(h,7).map(d=>`<td>${dayMark(d)}</td>`).join('')}</tr>`).join('')}</tbody></table>${progressKey()}`;
    }
    function commitmentBars(list){
      return `<div class="commitment-list">${list.map(h=>{const ds=historyDays(h,30),done=ds.filter(d=>d.status==='met').length,total=ds.filter(d=>d.status!=='neutral').length,rate=total?Math.round(done/total*100):null;return `<article class="commitment-item"><div class="commitment-heading"><button class="habit-name" data-action="detail" data-id="${escape(h.id)}">${escape(h.name)}</button><div class="commitment-result"><strong>${total?done+' / '+total:'—'}</strong><small>${total?'ngày đạt / có cam kết':'chưa có kết quả'}</small></div></div>${total?`<div class="commitment-bar" role="progressbar" aria-label="Tỷ lệ giữ cam kết ${escape(h.name)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${rate}" aria-valuetext="${done} trên ${total} ngày có cam kết"><span style="width:${rate}%"></span></div>`:''}<p class="commitment-caption">${total?rate+'% · '+escape(cadenceLabel(h)):'Cam kết từ '+dateLabel(h.commitment)}</p></article>`;}).join('')}</div>`;
    }
    function render(){
      const list=habits.filter(h=>Boolean(h.archived)===archivedView);
      const title=archivedView?'Đã lưu trữ':'Thói quen';
      main.innerHTML=`<div class="page-title"><h1>${title}</h1><button class="icon-button" id="manage" aria-label="Quản lý thói quen">${icon('more')}</button></div><div class="tabs" aria-label="Cách xem thói quen"><button data-panel="track" aria-pressed="${panel==='track'}">Theo dõi</button><button data-panel="progress" aria-pressed="${panel==='progress'}">Tiến bộ</button></div>${archivedView?'<button class="text-button" id="back-active">‹ Đang theo dõi</button>':panel==='track'?`<button class="quick-add" id="add">${icon('plus')}<span>Thêm thói quen…</span></button>`:''}<section id="list"></section>`;
      if(panel==='track'){
        $('#list').innerHTML=`<div class="day-title"><strong>${archivedView?'Thói quen đã ngừng theo dõi':'Thứ Sáu, 16 tháng 10'}</strong>${!archivedView?`<span>${list.filter(met).length} đã đạt hôm nay</span>`:''}</div>${list.length?list.map(h=>h.archived?`<article class="habit-row"><div class="habit-copy"><h3>${escape(h.name)}</h3><p class="habit-meta">${escape(cadenceLabel(h))}</p></div><button class="secondary" data-action="restore" data-id="${escape(h.id)}">Khôi phục</button></article>`:row(h)).join(''):`<div class="empty"><h2>${archivedView?'Chưa có thói quen lưu trữ':'Bắt đầu từ một việc nhỏ'}</h2><p>${archivedView?'Thói quen ngừng theo dõi sẽ nằm ở đây.':'Chọn điều cậu muốn duy trì. Nhẹ một chút cũng được.'}</p>${!archivedView?'<div class="templates"><button data-template="read">Đọc sách</button><button data-template="exercise">Tập luyện</button><button data-template="water">Uống nước</button></div>':''}</div>`}${!archivedView&&list.length?'<p class="bottom-note">Tick để đủ mục tiêu. Chạm số tiến độ để ghi từng phần hoặc chỉnh tổng hôm nay.</p>':''}`;
      }else{
        $('#list').innerHTML=`<div class="range-control" aria-label="Khoảng thời gian">${[7,30].map(n=>`<button data-range="${n}" aria-pressed="${span===n}">${n} ngày</button>`).join('')}</div><p class="progress-intro">${dateLabel(addDays(DAY,-span))} – ${dateLabel(addDays(DAY,-1))} · Các ngày đã kết thúc${span===30?'<br>Tỷ lệ chỉ tính những ngày có cam kết.':''}</p>${list.length?(span===7?progressTable(list):commitmentBars(list)):'<p class="progress-empty">Thêm một thói quen để bắt đầu theo dõi tiến bộ.</p>'}<p class="bottom-note">Chạm tên để xem chi tiết. Ngày ngoài lịch hoặc còn linh hoạt không bị tính là thiếu.</p>`;
      }
      $('#add')?.addEventListener('click',()=>openComposer());$('#manage').addEventListener('click',openManage);$('#back-active')?.addEventListener('click',()=>{archivedView=false;render();});
    }
    main.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.panel){panel=b.dataset.panel;render();return;}if(b.dataset.range){span=Number(b.dataset.range);render();return;}if(b.dataset.template){openComposer(undefined,b.dataset.template);return;}const h=habits.find(h=>h.id===b.dataset.id);if(!h)return;({tick:()=>toggle(h),log:()=>openLog(h),detail:()=>openDetails(h),menu:()=>openMenu(h),restore:()=>restore(h)})[b.dataset.action]?.();});
    function setValue(h,value,message,focusSelector){
      const before=h.value;h.value=Math.round(Math.min(1000000,Math.max(0,value))*100)/100;persist();render();
      if(focusSelector)$(focusSelector)?.focus({preventScroll:true});
      toast(message,()=>{h.value=before;persist();render();});
    }
    function toggle(h){setValue(h,met(h)?0:h.target,met(h)?'Đã bỏ hoàn thành hôm nay.':'Đã đạt mục tiêu '+h.name+'.','[data-action="tick"][data-id="'+CSS.escape(h.id)+'"]');}
    function openComposer(original,template){
      const base=original?.pending?.definition??original??{name:'',metric:'check',target:1,unit:'lần',cadence:'daily',days:[0,2,4],quota:3,note:'',reminder:''};
      const draft=structuredClone(base);
      if(template==='read')Object.assign(draft,{name:'Đọc sách',metric:'duration',target:20,unit:'phút'});
      if(template==='exercise')Object.assign(draft,{name:'Tập luyện',cadence:'weekly',quota:3});
      if(template==='water')Object.assign(draft,{name:'Uống nước',metric:'quantity',target:8,unit:'ly'});
      const radio=(name,value,label,checked)=>`<label class="choice"><input type="radio" name="${name}" value="${value}" ${checked?'checked':''}><span>${label}</span></label>`;
      const body=`<form id="habit-form" novalidate><div class="field name-field"><label for="habit-name">Tên thói quen</label><input id="habit-name" name="name" placeholder="Cậu muốn duy trì việc gì?" value="${escape(draft.name)}" maxlength="100" autocomplete="off" required><p id="name-error" class="error" hidden></p></div><fieldset class="segmented"><legend>Ghi nhận bằng</legend>${[['check','Đánh dấu'],['duration','Thời lượng'],['quantity','Số lượng']].map(([v,t])=>radio('metric',v,t,draft.metric===v)).join('')}</fieldset><div class="target-line" id="target-line"><div class="field"><label for="habit-target">Mục tiêu</label><input id="habit-target" type="number" value="${draft.metric==='check'?20:draft.target}" min="0.01" max="1000000" step="0.01" inputmode="decimal"><p id="target-error" class="error" hidden></p></div><span class="suffix" id="minute-unit">phút</span><div class="field unit-field" id="unit-field"><label for="habit-unit">Đơn vị</label><input id="habit-unit" value="${escape(draft.metric==='quantity'?draft.unit:'')}" placeholder="trang, ly, km…" maxlength="20"><p id="unit-error" class="error" hidden></p></div></div><button type="button" class="repeat-row" id="repeat-toggle" aria-expanded="${Boolean(original)}" aria-controls="repeat-options"><span>Lặp lại</span><span><span id="repeat-label"></span>${icon('chevron')}</span></button><div class="repeat-options" id="repeat-options" ${original?'':'hidden'}><fieldset class="segmented"><legend class="label">Chọn lịch lặp</legend>${[['daily','Hằng ngày'],['weekdays','Chọn các thứ'],['weekly','X ngày / tuần']].map(([v,t])=>radio('cadence',v,t,draft.cadence===v)).join('')}</fieldset><fieldset class="weekdays" id="weekdays"><legend>Những ngày thực hiện</legend>${[0,1,2,3,4,5,6].map(d=>`<label><input type="checkbox" name="weekday" value="${d}" ${draft.days.includes(d)?'checked':''}><span>${d===6?'CN':'T'+(d+2)}</span></label>`).join('')}</fieldset><p id="days-error" class="error" hidden></p><div class="field" id="quota-field"><label for="habit-quota">Số ngày đạt mỗi tuần</label><input id="habit-quota" type="number" value="${draft.quota}" min="1" max="7" step="1" inputmode="numeric"><p id="quota-error" class="error" hidden></p></div></div><p class="summary-sentence" id="habit-summary"></p><div class="optional-links"><button type="button" id="toggle-reminder" aria-expanded="${Boolean(draft.reminder)}" aria-controls="reminder-field">+ Nhắc giờ</button><button type="button" id="toggle-note" aria-expanded="${Boolean(draft.note)}" aria-controls="note-field">+ Ghi chú</button></div><div class="extras"><div class="field" id="reminder-field" ${draft.reminder?'':'hidden'}><label for="habit-reminder">Nhắc lúc</label><input id="habit-reminder" type="time" value="${escape(draft.reminder||'21:00')}"><p class="summary-sentence">Lời nhắc đã đặt vẫn gửi khi ngủ hoặc tập trung.</p></div><div class="field" id="note-field" ${draft.note?'':'hidden'}><label for="habit-note">Ghi chú</label><textarea id="habit-note" maxlength="300" placeholder="Điều giúp cậu duy trì thói quen này…">${escape(draft.note)}</textarea></div></div></form>`;
      openSheet(original?'Chỉnh thói quen':'Thêm thói quen',body,`<p class="activation" id="activation"></p><button class="primary" type="submit" form="habit-form">${original?'Lưu thay đổi':'Thêm thói quen'}</button>`);
      const form=$('#habit-form'), value=name=>$(`input[name="${name}"]:checked`,form).value;
      $('#target-line').insertAdjacentHTML('afterend',`<div class="target-range-block" id="target-range-block">${rangeControl(Number($('#habit-target').value),Math.max(120,Number($('#habit-target').value)),'Mục tiêu thời lượng',{id:'habit-target-range'})}<div class="range-labels"><span id="target-range-min">1 phút</span><span id="target-range-max"></span></div></div>`);
      const goalRange=$('#habit-target-range');
      function syncGoal(){const metric=value('metric'),target=Number($('#habit-target').value);$('#target-range-block').hidden=metric!=='duration';if(metric==='duration'&&target>0&&target<=1000000){goalRange.min=Number.isInteger(target)?'1':'0.01';updateRange(goalRange,target,true);$('#target-range-min').textContent=num(goalRange.min)+' phút';$('#target-range-max').textContent=num(goalRange.max)+' phút';}}
      goalRange.addEventListener('input',()=>{$('#habit-target').value=goalRange.value;});
      syncGoal();
      function read(){return {name:$('#habit-name').value.trim(),metric:value('metric'),target:value('metric')==='check'?1:Number($('#habit-target').value),unit:value('metric')==='check'?'lần':value('metric')==='duration'?'phút':$('#habit-unit').value.trim(),cadence:value('cadence'),days:[...form.querySelectorAll('[name=weekday]:checked')].map(i=>Number(i.value)),quota:Number($('#habit-quota').value),note:$('#note-field').hidden?'':$('#habit-note').value.trim(),reminder:$('#reminder-field').hidden?'':$('#habit-reminder').value};}
      function update(){const d=read();$('#target-line').hidden=d.metric==='check';$('#minute-unit').hidden=d.metric!=='duration';$('#unit-field').hidden=d.metric!=='quantity';$('#weekdays').hidden=d.cadence!=='weekdays';$('#quota-field').hidden=d.cadence!=='weekly';$('#repeat-label').textContent=cadenceLabel(d);const goal=d.metric==='check'?'Hoàn thành':`Đạt ${num(d.target||0)} ${d.unit||'đơn vị'}`;$('#habit-summary').textContent=d.cadence==='weekly'?`${goal} vào ${d.quota||0} ngày bất kỳ trong tuần. Mỗi ngày tính một lần.`:d.cadence==='weekdays'?`${goal} vào ${cadenceLabel(d)||'những ngày cậu chọn'}.`:`${goal} mỗi ngày.`;$('#activation').innerHTML=original?`Giữ mục tiêu hôm nay · Thay đổi từ <strong>${dateLabel(effective(d,original))}</strong>`:`Theo dõi ngay · Cam kết từ <strong>${dateLabel(effective(d))}</strong>`;}
      form.addEventListener('input',()=>{syncGoal();update();});form.addEventListener('change',()=>{syncGoal();update();});
      $('#repeat-toggle').addEventListener('click',()=>{const node=$('#repeat-options');node.hidden=!node.hidden;$('#repeat-toggle').setAttribute('aria-expanded',String(!node.hidden));});
      for(const key of ['reminder','note'])$('#toggle-'+key).addEventListener('click',()=>{const node=$('#'+key+'-field');node.hidden=!node.hidden;$('#toggle-'+key).setAttribute('aria-expanded',String(!node.hidden));update();if(!node.hidden)$('input,textarea',node).focus();});
      function error(key,text,input){const p=$('#'+key+'-error');p.hidden=!text;p.textContent=text;input?.setAttribute('aria-invalid',String(Boolean(text)));if(text)input?.setAttribute('aria-describedby',p.id);else input?.removeAttribute('aria-describedby');return Boolean(text);}
      form.addEventListener('submit',event=>{event.preventDefault();const d=read();let bad=false;bad=error('name',d.name?'':'Đặt tên cho thói quen nhé.',$('#habit-name'))||bad;bad=error('target',d.metric!=='check'&&(!Number.isFinite(d.target)||d.target<=0||d.target>1000000||Math.abs(d.target*100-Math.round(d.target*100))>1e-6)?'Nhập mục tiêu lớn hơn 0, tối đa 2 chữ số thập phân.':'',$('#habit-target'))||bad;bad=error('unit',d.metric==='quantity'&&!d.unit?'Thêm đơn vị, ví dụ trang hoặc ly.':'',$('#habit-unit'))||bad;bad=error('days',d.cadence==='weekdays'&&!d.days.length?'Chọn ít nhất một ngày.':'')||bad;bad=error('quota',d.cadence==='weekly'&&(!Number.isInteger(d.quota)||d.quota<1||d.quota>7)?'Chọn từ 1 đến 7 ngày mỗi tuần.':'',$('#habit-quota'))||bad;if(bad){if(!$('#days-error').hidden||!$('#quota-error').hidden){$('#repeat-options').hidden=false;$('#repeat-toggle').setAttribute('aria-expanded','true');}const invalid=$('[aria-invalid=true]',form);invalid?.focus();return;}if(original){original.pending={definition:d,from:effective(d,original)};original.reminder=d.reminder;}else{if(habits.filter(h=>!h.archived).length>=30){toast('Bản mẫu cho tối đa 30 thói quen đang theo dõi.');return;}habits.push({...d,id:'habit-'+(globalThis.crypto?.randomUUID?.()||Date.now().toString(36)),value:0,completed:0,commitment:effective(d)});}persist();closeSheet();panel='track';archivedView=false;render();toast(original?'Đã hẹn thay đổi từ '+dateLabel(effective(d,original))+'.':'Đã thêm '+d.name+'.');});
      update();$('#habit-name').focus({preventScroll:true});
    }
    function openLog(h){
      const duration=h.metric==='duration',maximum=Math.max(h.target,h.value);
      const numberInput=`<input id="log-value" type="number" min="0" max="1000000" step="0.01" inputmode="decimal" value="${h.value}" aria-describedby="log-help">`;
      const control=duration?`${rangeControl(h.value,maximum,'Thời lượng hôm nay', {id:'log-range'})}<div class="range-labels"><span>0 phút</span><span id="log-range-max">${num(maximum)} phút</span></div>`:'';
      openSheet(h.name,`<p class="log-progress"><span id="log-preview">${num(h.value)}</span> <small>/ ${num(h.target)} ${escape(h.unit)}</small></p><p class="log-context" id="log-context">Hôm nay · 16/10${met(h)?' · Đã đạt mục tiêu':''}</p><form id="log-form" novalidate>${duration?`<div class="log-range-block">${control}</div>`:''}<div class="field log-range-number"><label for="log-value">${duration?'Nhập chính xác':'Tổng hôm nay'} (${escape(h.unit)})</label>${duration?numberInput:`<div class="input-with-step"><button type="button" data-log-step="-1" aria-label="Bớt 1 ${escape(h.unit)}">−</button>${numberInput}<button type="button" data-log-step="1" aria-label="Thêm 1 ${escape(h.unit)}">+1</button></div>`}<p id="log-error" class="error" hidden></p></div><div class="log-total-link"><p>Mục tiêu ${num(h.target)} ${escape(h.unit)}</p><button type="button" class="text-button" id="log-full">Đủ mục tiêu</button></div><p class="summary-sentence" id="log-help">Lưu sẽ thay tổng hôm nay.</p><details class="log-note-extra" ${h.logNote?'open':''}><summary>Ghi chú hôm nay · tùy chọn</summary><div class="field"><label for="log-note" class="screen-reader-only">Ghi chú hôm nay</label><textarea id="log-note" maxlength="300" placeholder="Một dòng ngắn nếu cậu muốn…">${escape(h.logNote||'')}</textarea></div></details></form>`,`<button type="submit" form="log-form" class="primary">Lưu hôm nay</button>`);
      const input=$('#log-value'),range=$('#log-range');
      function sync(){
        const value=Number(input.value),valid=input.value!==''&&Number.isFinite(value)&&value>=0&&value<=1000000&&Math.abs(value*100-Math.round(value*100))<1e-6;
        $('#log-preview').textContent=valid?num(value):'—';
        $('#log-context').textContent='Hôm nay · 16/10'+(valid&&value>=h.target?' · Đã đạt mục tiêu':'');
        if(valid&&range){updateRange(range,value,true);$('#log-range-max').textContent=num(range.max)+' phút';}
        sheet.querySelectorAll('[data-log-step]').forEach(b=>{b.disabled=!valid||(Number(b.dataset.logStep)<0?value<=0:value>=1000000);});
        if(valid){$('#log-error').hidden=true;input.removeAttribute('aria-invalid');input.setAttribute('aria-describedby','log-help');}
      }
      input.addEventListener('input',sync);
      range?.addEventListener('input',()=>{input.value=range.value;sync();});
      sheet.querySelectorAll('[data-log-step]').forEach(b=>b.addEventListener('click',()=>{input.value=String(Math.round(Math.min(1000000,Math.max(0,Number(input.value)+Number(b.dataset.logStep)))*100)/100);sync();}));
      $('#log-full').addEventListener('click',()=>{input.value=String(h.target);sync();});
      $('#log-form').addEventListener('submit',e=>{e.preventDefault();const value=Number(input.value);if(input.value===''||!Number.isFinite(value)||value<0||value>1000000||Math.abs(value*100-Math.round(value*100))>1e-6){$('#log-error').hidden=false;$('#log-error').textContent='Nhập tổng từ 0 đến 1.000.000, tối đa 2 chữ số thập phân.';input.setAttribute('aria-invalid','true');input.setAttribute('aria-describedby','log-help log-error');input.focus();return;}const before={value:h.value,logNote:h.logNote};h.value=value;h.logNote=$('#log-note').value.trim();persist();closeSheet();render();toast(met(h)?'Đã đạt mục tiêu '+h.name+'.':'Đã ghi '+num(value)+' '+h.unit+'.',()=>{Object.assign(h,before);persist();render();});});
      sync();
      input.focus({preventScroll:true});input.select();
    }
    function openDetails(h){
      const today=h.metric==='check'?(met(h)?'Đã làm':'Chưa ghi nhận'):`${num(h.value)} / ${num(h.target)} ${h.unit}`;
      const future=h.commitment>DAY;
      openSheet(h.name,`<p class="log-progress" style="font-size:26px">${escape(today)}</p><p class="log-context">Hôm nay · 16/10${future?' · Theo dõi trước cam kết':''}</p>${h.cadence==='weekly'?`<p class="inline-status">Tuần này ${weeklyCount(h)}/${h.quota} ngày đạt${met(h)?' · có hôm nay tạm tính':''}</p>`:''}<div class="detail-actions">${!h.archived?`<button class="secondary" id="detail-log">${h.metric==='check'?(met(h)?'Bỏ đánh dấu hôm nay':'Đánh dấu hôm nay'):'Sửa tổng hôm nay'}</button>`:''}</div><dl class="detail-grid"><div><dt>Lịch lặp</dt><dd>${escape(cadenceLabel(h))}</dd></div><div><dt>Mục tiêu</dt><dd>${h.metric==='check'?'Hoàn thành':num(h.target)+' '+escape(h.unit)+' mỗi ngày thực hiện'}</dd></div><div><dt>Nhắc giờ</dt><dd>${escape(h.reminder||'Chưa đặt')}</dd></div>${h.slot?`<div><dt>Đã xếp hôm nay</dt><dd>${escape(h.slot.time)} · ${h.slot.minutes} phút</dd></div>`:''}${future?`<div><dt>Bắt đầu cam kết</dt><dd>${dateLabel(h.commitment)}</dd></div>`:''}${h.pending?`<div><dt>Đổi mục tiêu/lịch</dt><dd>Từ ${dateLabel(h.pending.from)}</dd></div>`:''}${h.archiveFrom?`<div><dt>Lưu trữ</dt><dd>Từ ${dateLabel(h.archiveFrom)}</dd></div>`:''}</dl><h3 style="margin-top:25px">7 ngày vừa qua</h3>${calendar(h)}${progressKey()}<p class="detail-note">${future?'Ghi nhận ngay để theo dõi. Đóng góp bắt đầu từ '+dateLabel(h.commitment)+'.':!scheduled(h)?'Hôm nay ngoài lịch. Ghi thêm để theo dõi, không tạo đóng góp cho ngày ngoài lịch.':h.cadence==='weekly'&&weeklyCount(h)>=(h.quota)&&h.completed>=h.quota?'Tuần này đã đủ quota. Ghi thêm vẫn được theo dõi, không tạo thêm đóng góp.':'Đạt mục tiêu trên ngày có cam kết mới góp vào luyện hoặc chiến đấu khi chốt ngày.'}</p>${h.logNote?`<p class="detail-note">Ghi chú hôm nay: ${escape(h.logNote)}</p>`:''}${h.note?`<p class="detail-note">${escape(h.note)}</p>`:''}`);
      $('#detail-log')?.addEventListener('click',()=>{if(h.metric==='check'){toggle(h);openDetails(h);}else openLog(h);});
    }
    function openMenu(h){openSheet(h.name,`<div class="menu-list"><button id="menu-edit">${icon('edit')}Chỉnh thói quen</button><button id="menu-slot">${icon('clock')}${h.slot?'Chỉnh':'Xếp'} thời gian hôm nay</button><button id="menu-detail">${icon('history')}Xem tiến bộ</button><div class="menu-separator"></div><button id="menu-archive" class="danger">${icon('archive')}${h.archiveFrom?'Hủy hẹn lưu trữ':'Lưu trữ'}</button></div>`);$('#menu-edit').addEventListener('click',()=>openComposer(h));$('#menu-detail').addEventListener('click',()=>openDetails(h));$('#menu-slot').addEventListener('click',()=>openSlot(h));$('#menu-archive').addEventListener('click',()=>{if(h.archiveFrom){delete h.archiveFrom;persist();closeSheet();render();toast('Đã hủy hẹn lưu trữ.');return;}const from=effective(h,h);openSheet('Lưu trữ '+h.name+'?',`<p style="font-size:14px">Ngừng theo dõi từ <strong>${dateLabel(from)}</strong>. Lịch sử được giữ; cam kết đang có vẫn tính đến mốc này.</p>`,`<button class="primary" id="confirm-archive">Lưu trữ từ ${dateLabel(from)}</button>`);$('#confirm-archive').addEventListener('click',()=>{h.archiveFrom=from;persist();closeSheet();render();toast('Đã hẹn lưu trữ từ '+dateLabel(from)+'.');});});}
    function openSlot(h){openSheet('Thời gian cho '+h.name,`<form id="slot-form"><div class="field"><label for="slot-time">Bắt đầu · 16/10</label><input id="slot-time" type="time" step="300" value="${escape(h.slot?.time||'19:30')}" required></div><div class="field"><label for="slot-minutes">Dành bao nhiêu phút?</label><input id="slot-minutes" type="number" min="5" max="240" step="5" value="${h.slot?.minutes||20}" required></div><p id="slot-error" class="error" hidden></p><p class="summary-sentence">Xếp giờ không tự ghi nhận đã làm hoặc bật lời nhắc. Bản thử kiểm tra trùng giờ giữa các habit mẫu.</p>${h.slot?'<button type="button" class="text-button" id="remove-slot">Bỏ khỏi lịch hôm nay</button>':''}</form>`,`<button type="submit" form="slot-form" class="primary">Lưu thời gian</button>`);$('#slot-form').addEventListener('submit',e=>{e.preventDefault();const time=$('#slot-time').value,minutes=Number($('#slot-minutes').value),asMinutes=t=>Number(t.slice(0,2))*60+Number(t.slice(3)),start=asMinutes(time);const overlap=habits.some(other=>other.id!==h.id&&other.slot&&start<asMinutes(other.slot.time)+other.slot.minutes&&asMinutes(other.slot.time)<start+minutes);const err=met(h)?'Habit này đã đạt mục tiêu hôm nay.':start+minutes>1440?'Khoảng thời gian vượt ngày mẫu.':overlap?'Khoảng này trùng một habit đã xếp. Chọn giờ khác nhé.':'';if(err){$('#slot-error').hidden=false;$('#slot-error').textContent=err;return;}h.slot={time,minutes};persist();closeSheet();render();toast('Đã xếp '+h.name+' lúc '+time+'.');});$('#remove-slot')?.addEventListener('click',()=>{delete h.slot;persist();closeSheet();render();toast('Đã bỏ khỏi lịch hôm nay.');});}
    function restore(h){h.archived=false;h.commitment=effective(h,h);h.value=0;persist();render();toast('Hoạt động lại từ '+dateLabel(h.commitment)+'.');}
    function openManage(){openSheet('Thói quen',`<div class="menu-list"><button id="manage-archive">${icon('archive')}Xem đã lưu trữ</button><div class="menu-separator"></div><button id="manage-empty">${icon('plus')}Thử bắt đầu từ danh sách trống</button><button id="manage-reset">${icon('reset')}Khôi phục dữ liệu mẫu</button></div><p class="detail-note">Bản thử lưu riêng trên trình duyệt này, không gửi dữ liệu đến app. Ngày mẫu:16/10/2026.</p>`);$('#manage-archive').addEventListener('click',()=>{archivedView=true;panel='track';closeSheet();render();});$('#manage-empty').addEventListener('click',()=>{habits=[];persist();archivedView=false;panel='track';closeSheet();render();toast('Danh sách trống để thử thêm thói quen.');});$('#manage-reset').addEventListener('click',reset);}
    function reset(){habits=initial();persist();panel='track';archivedView=false;closeSheet();render();toast('Đã khôi phục dữ liệu mẫu.');}
    $('#reset').addEventListener('click',reset);$('#home').addEventListener('click',()=>{panel='track';archivedView=false;render();window.scrollTo({top:0,behavior:'auto'});});
    $('#theme').addEventListener('click',()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';});
    render();
  </script>
</body>
</html>
