function finishBattle(status,endDay){const b=state.battle;if(!b||b.archived)return;b.status=status;b.endDay=endDay;b.resultSeen=false;b.archived=true;
 if(status==='lost'){b.qiSpent=deathCost();state.qi-=b.qiSpent;}else b.qiSpent=0;
 const boss=bossBy(b.bossId);if(status==='won'&&!state.victories.includes(boss.id)){state.victories.push(boss.id);state.records.unshift({bossId:boss.id,day:endDay,turns:b.turn,rescued:b.rescued,skills:[...new Set(b.used)]});for(const id of boss.unlocks)if(!state.owned.includes(id))state.owned.push(id);}
 b.log.push('Ngày '+endDay+'/10 · '+({won:'Đã thắng',lost:'Tử trận',expired:'Hết lượt giao chiến',withdrawn:'Đã rút lui'}[status])+(b.qiSpent?' · mất '+b.qiSpent+' Tu Vi.':'.'));
 const v=state.versions.find(v=>v.id===(b.resumePracticeId??state.current));b.resumeDay=endDay+1;
 if(b.resumeDay<=state.day){state.current=v&&v.tier<4?v.id:null;}else state.pending=v&&v.tier<4?{mode:'practice',versionId:v.id,from:b.resumeDay}:{mode:'idle',from:b.resumeDay};
 state.history??=[];state.history.unshift(JSON.parse(JSON.stringify(b)));}
function renderResult(){const b=state.battle,boss=bossBy(b.bossId),won=b.status==='won',hero=node('section',undefined,'hero');hero.append(node('p',won?'ĐÃ VƯỢT QUA':b.status==='withdrawn'?'ĐÃ RÚT LUI':b.status==='expired'?'HẾT LƯỢT GIAO CHIẾN':'TỬ TRẬN','eyebrow'),node('h2',boss.name),node('p','Ngày '+(b.endDay??state.day)+'/10 · '+b.turn+' ngày giao chiến','hint'));
 const actions=node('div',undefined,'actions');actions.append(button(won?'Xem chiến tích':'Xem nhật ký',()=>won?showRecord(state.records.find(r=>r.bossId===b.bossId)):openBattleLog(),'primary'));hero.append(actions);main.append(hero);
 if(won&&boss.unlocks.length){const unlocked=node('section',undefined,'panel result-details');unlocked.append(node('h3','Công pháp vừa mở'));for(const id of boss.unlocks){const control=button('',()=>openTechnique(byId(id)),'' );control.append(node('span',byId(id).name),icon('arrow'));unlocked.append(control);}unlocked.append(node('p','Chọn một môn và bắt đầu luyện từ Nhập môn.','hint'));main.append(unlocked);}
 const plan=node('div',undefined,'block'),v=state.versions.find(v=>v.id===(b.resumePracticeId??state.current));plan.append(node('h3','Sau trận này'),node('p',v&&v.tier<4?'Luyện '+byId(v.techniqueId).name+' tiếp tục từ ngày '+(b.resumeDay??state.day+1)+'/10.':'Chọn công pháp hoặc chuẩn bị thử thách tiếp theo.','hint'));
 if(b.qiSpent)plan.append(node('p','Đã trừ '+b.qiSpent+' Tu Vi trong dữ liệu mẫu.','hint'));const choices=node('div',undefined,'actions block');choices.append(button(v?'Về luyện công pháp':'Chọn công pháp',()=>{b.resultSeen=true;persist();if(v)render();else go('library');},'secondary'),button('Xem Vượt tầng',()=>go('floors'),'secondary'));plan.append(choices);main.append(plan);}
function showHistory(){openSheet('Lịch sử giao chiến',body=>{const history=state.history??[],ids=new Set(history.filter(b=>b.status==='won').map(b=>b.bossId));for(const b of history){const row=button('',()=>openSheet(bossBy(b.bossId).name,detail=>{detail.append(node('p','Ngày '+b.endDay+'/10 · '+({won:'Đã thắng',lost:'Tử trận',expired:'Hết lượt',withdrawn:'Đã rút lui'}[b.status]),'detail-intro'));for(const line of b.log)detail.append(node('p',line,'hint block'));}),'branch-row'),copy=node('div');copy.append(node('h3',bossBy(b.bossId).name),node('p',({won:'Đã thắng',lost:'Tử trận',expired:'Hết lượt',withdrawn:'Đã rút lui'}[b.status])+' · '+b.endDay+'/10'));row.append(copy,icon('arrow'));body.append(row);}for(const r of state.records.filter(r=>!ids.has(r.bossId))){const row=button('',()=>showRecord(r),'branch-row'),copy=node('div');copy.append(node('h3',bossBy(r.bossId).name),node('p','Đã thắng · '+r.day+'/10'));row.append(copy,icon('arrow'));body.append(row);}if(!history.length&&!state.records.length)body.append(node('p','Chưa có trận đã kết thúc.','hint'));});}
function exportDemo(){const url=URL.createObjectURL(new Blob([JSON.stringify({prototype:'Tu luyện · dữ liệu mẫu',state},null,2)],{type:'application/json'})),link=node('a');link.href=url;link.download='tu-luyen-du-lieu-mau.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Đã xuất dữ liệu mẫu của bản thử.');}
function showRecord(record){if(!record){toast('Chưa có bản ghi trận thắng trong tình huống mẫu.');return;}const boss=bossBy(record.bossId);openSheet('Chiến tích · '+boss.name,body=>{const seal=node('div',undefined,'detail-glyph');seal.append(icon('trophy'));body.append(seal,node('p','ĐÃ VƯỢT QUA','eyebrow'),node('h2',boss.name,'detail-name'),node('p','Thắng ngày '+record.day+'/10 sau '+record.turns+' ngày giao chiến. '+(record.rescued?'Đã dùng quyền cứu.':'Không dùng cứu mạng.'),'detail-intro'),node('h3','Công pháp đã dùng','block'),node('p',record.skills.join(' · '),'hint'));if(boss.unlocks.length){body.append(node('h3','Quyền luyện đã mở','block'));for(const id of boss.unlocks)body.append(button(byId(id).name,()=>openTechnique(byId(id))));}const story=node('details',undefined,'disclosure');story.append(node('summary','Câu chuyện sau trận'),node('p',boss.victory,'detail-intro'));body.append(story);},[button('Về Vượt tầng',()=>{closeSheet();go('floors');},'secondary')]);}
function showRules(){openSheet('Luyện từ những việc nhỏ',body=>{body.append(node('h3','Tiến độ và tinh thuần là hai phần riêng'),node('p','Thói quen đủ mục tiêu trong ngày đang luyện góp tiến độ. Chưa đủ mục tiêu không góp một phần. Cam kết thiếu ảnh hưởng tinh thuần; tuần còn linh hoạt không bị tính thiếu sớm.','detail-intro block'),node('h3','Bốn tầng, các bản luyện riêng','block'),node('p','Nhập môn → Tiểu thành → Đại thành → Viên mãn. Tinh thuần của tầng đã chốt không sửa trên bản cũ. Luyện lại tạo một bản từ tầng 1.','detail-intro block'),node('h3','Đổi chế độ từ ngày kế tiếp','block'),node('p','Ngày đang luyện không tự chuyển thành ngày đánh boss sau khi ghi habit. Chuẩn bị trận hoặc đổi môn hôm nay áp dụng ngày sinh hoạt kế tiếp.','detail-intro block'));});}
function advanceDay(){const p=state.pending;state.day++;if(p){if(p.mode==='practice'){state.current=p.versionId;if(state.battle)state.battle.resultSeen=true;}if(p.mode==='idle')state.current=null;if(p.mode==='battle'){const b=bossBy(p.bossId);state.battle={bossId:b.id,status:'active',turn:1,playerHp:100,playerMax:100,bossHp:120,bossMax:120,choice:null,loadout:p.loadout,used:[],log:['Ngày '+state.day+'/10 · Bắt đầu trận mẫu.'],rescued:false,deadline:state.day+2,resumePracticeId:p.resumePracticeId??state.current,waitDays:0};}state.pending=null;}
 else if(state.battle?.status==='active'){const b=state.battle;if(!b.choice){b.waitDays=(b.waitDays??0)+1;b.log.push('Ngày '+(state.day-1)+'/10 · Chưa chọn chiêu, trận chờ.');if(b.waitDays>=3)finishBattle('withdrawn',state.day-1);}else{
 b.waitDays=0;b.rankRescuePrepared=b.choice==='nghich-menh';b.bossHp=Math.max(0,b.bossHp-(state.sources.filter(s=>s.done).length*5+12));b.used.push(byId(b.choice)?.name??'Võ Kỹ');b.log.push('Ngày '+(state.day-1)+'/10 · '+(byId(b.choice)?.name??'Võ Kỹ')+' · còn '+b.bossHp+' sinh lực đối thủ.');
 if(b.bossHp===0)finishBattle('won',state.day-1);else{b.playerHp=Math.max(0,b.playerHp-18);b.turn++;if(b.playerHp===0){if(b.rescued)finishBattle('lost',state.day-1);else{b.status='rescue';b.deadline=state.day+2;}}else if(b.turn>bossBy(b.bossId).maxTurns)finishBattle('expired',state.day-1);}b.choice=null;}}
 else if(!isFighting()&&currentVersion()){const v=currentVersion();if(v.tier<4){v.progress+=state.sources.filter(s=>s.done).length*.4;const max=[3,6,10,15][v.tier];if(v.progress>=max){v.tier++;v.progress=0;v.purity=85;}}}
 if(state.battle?.status==='rescue'&&state.day>state.battle.deadline)finishBattle('lost',state.day-1);persist();closeSheet();render();toast('Đã chuyển ngày mẫu. Đây không phải kết toán thật.');}
function showDemoControls(){openSheet('Thử các tình huống',body=>{body.append(node('p','Chọn một tình huống để xem toàn bộ luồng. Mỗi lựa chọn đặt lại dữ liệu mẫu; không gọi API hoặc tài khoản thật.','detail-intro'));const field=node('label','Tình huống','sheet-field'),select=node('select');select.id='scenario-select';for(const [id,label] of [['training','Đang luyện · đã vượt 2 tầng'],['new','Người mới · chưa chọn môn'],['prepared','Đã chuẩn bị trận ngày mai'],['battle','Đang đánh boss · chọn chiêu'],['discovery','Đã tìm thấy cấm thuật/bí tịch ẩn'],['rescue','Sinh lực cạn · dùng Hộ Mệnh'],['rescue-rank','Sinh lực cạn · có Nghịch Mệnh'],['victory','Đã thắng cơ duyên · bí tịch mở']]){const option=node('option',label);option.value=id;select.append(option);}select.value=state.scenario;field.append(select);body.append(field,button('Mở tình huống',()=>{setupScenario(select.value);closeSheet();},'primary'));const demo=node('div',undefined,'demo-controls');demo.append(node('h3','Điều khiển mô phỏng'),node('p','Chuyển ngày để thử việc hẹn luyện, bắt đầu trận và chốt chiêu. Số damage/tinh thuần trong demo là mẫu, không phải engine cân bằng.','hint'));const actions=node('div',undefined,'actions');actions.append(button('Sang ngày mẫu kế',advanceDay,'secondary'),button('Đổi sáng / tối',()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';},'secondary'));demo.append(actions);demo.append(button('Xuất dữ liệu mẫu',exportDemo));body.append(demo);});}
function showDesign(){openSheet('Luồng Tu luyện được đề xuất',body=>{const copy=node('div',undefined,'readme');copy.append(node('p','Đây là bản HTML để duyệt tính năng và luồng. Các dấu ấn đơn giản là hình thay chỗ; chưa làm lại nhân vật, boss hay ảnh game.'));for(const [title,text] of [['1. Hiện tại','Mở tab biết ngay môn/bản/tầng đang luyện hoặc trận đang đánh. Thông tin mở khóa và nhật ký nằm sau thao tác xem, không rải khắp trang.'],['2. Công pháp','Đã mở là các môn có thể luyện. Khám phá cho biết điều kiện học tiếp. Công pháp trấn phái có điều kiện rõ; bí tịch ẩn/cấm thuật chưa gặp chỉ lộ manh mối, gặp thử thách rồi mới lộ tên và cái giá.'],['3. Vượt tầng','22 trận chính hiện có được đánh số tầng. 18 trận cơ duyên nằm riêng, không chặn đường chính. Tầng đã thắng không mất và không reset theo mùa.'],['4. Thành tựu','Boss đã thắng là thành quả chính: ngày thắng, số ngày giao chiến, chiêu đã dùng, bí tịch mở. Danh hiệu nằm dưới; Thần binh bị bỏ khỏi phương án.'],['Luật khi chuyển sang app thật','Giữ ngày sinh hoạt, quyền sửa, phiên bản, bản luyện bất biến và cái giá của chiêu. Bỏ Thần binh ở backend cần xử lý trận cũ đang mang vũ khí; không xóa dữ liệu đang dùng chỉ để khớp giao diện.'],['Mức độ tham khảo','Học Habitica cách gắn việc làm vào tiến độ boss; học Wuthering Waves cách trình bày vượt tầng và bản sắc bộ kỹ năng. Giữ nhịp theo ngày của app, dùng bố cục và dấu ấn riêng.']])copy.append(node('h3',title),node('p',text));copy.append(node('h3','Nguồn tham khảo'));for(const [label,url] of [['Habitica · dữ liệu tiến độ quest','https://tools.habitica.com/habitica_user_data_display.html?sectionOpen=questsCompletedSection'],['Wuthering Waves · ghi nhận tiến độ tháp (Kuro Games)','https://wutheringwaves.kurogames.com/en/main/news/detail/3194'],['Kuro Games · bản sắc kỹ năng (PlayStation Blog)','https://blog.playstation.com/2025/03/21/wuthering-waves-version-2-2-launches-march-26-tangled-truth-in-inverted-tower/']]){const p=node('p'),a=node('a',label);a.href=url;a.target='_blank';a.rel='noreferrer';p.append(a);copy.append(p);}body.append(copy);});}
function initNav(){for(const [id,label,glyph] of [['today','Hôm nay','clock'],['habits','Thói quen','check'],['reminders','Lời nhắc','bell'],['game','Tu luyện','sword'],['achievements','Thành tích','star']]){const b=button('',()=>id==='game'?go('practice'):toast('Bản thử chỉ mô phỏng tab Tu luyện.'),'');b.append(icon(glyph),node('span',label));if(id==='game')b.setAttribute('aria-current','page');$('#app-nav').append(b);}}
$('#demo-open').addEventListener('click',showDemoControls);$('#help-open').append(icon('help'));$('#help-open').addEventListener('click',showDesign);initNav();
try{const saved=JSON.parse(localStorage.getItem('cultivation-demo-v2'));if(saved&&Array.isArray(saved.versions)&&Array.isArray(saved.victories)&&saved.day)state=saved;}catch{}if(!state){state=baseState();state.rank=2;state.history=[];}document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';render();
</script>
