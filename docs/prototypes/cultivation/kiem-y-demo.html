ốc. Huyết Hà Đạo Nhân nói mình đã cứu họ, rồi chỉ sang cột tên bị gạch: mỗi lần cứu luôn có người khác trả.",victory:"Mộc An giữ lại sổ thương tích để tìm từng người, thay vì đốt tất cả. Một trang giấy chỉ tới người giữ cửa đã chết rồi sống lại nhiều lần. Tịch Vân không còn gọi đó là phép lành.",defeat:"Dòng huyết khép lối xuống bến. Mộc An đưa người bị thương về trạm; cậu đã biết nhịp Khâu tên là khoảng không hồi phục có thể khai thác.",mechanics:"Hồi phục sau hit Rút huyết; dồn lực vào nhịp nghỉ hoặc dùng sát thương trễ.",advice:["Hạ đối thủ trước phản công sẽ chặn lần hồi đó.","Hồi sinh lực và phản thương là hai cách giữ sức khác nhau."],unlocks:[],artId:"huyet-ha"},{id:"truong-sinh",name:"Tạ Trường Sinh",chapter:4,requires:["huyet-ha"],recommendedRank:2,maxTurns:9,fighter:K(430,27,5),revival:{remaining:1,hpPercent:350},pattern:[y("Giữ cửa","Một đòn vừa, không tăng giáp.",[900]),y("Bước cũ","Hai hit nhỏ theo nhịp của người từng bị thương.",[600,600]),y("Đoạn tuổi","Một hit lớn đã báo; hồi 10 HP nếu còn sống.",[1600],!0,10),y("Buông tay","Một hit rất nhẹ, thời điểm giữ sức hoặc kết liễu.",[200])],introduction:"Tạ Trường Sinh chống cửa ngục bằng chiếc thẻ gỗ gãy. “Ta có chín cái tên, nhưng chỉ còn một lần sống lại. Người trong kia chưa có lối rút, nên ta chưa được chết.”",victory:"Lần hồi sinh cuối đã dùng, Tạ Trường Sinh ngồi xuống bên cửa. Ông trao quyền học Nghịch Mệnh: “Trả một cảnh giới để sống tiếp không có nghĩa mọi việc trước đó được làm lại.” Cửa dẫn vào đại hội mở.",defeat:"Tạ Trường Sinh không đuổi theo. Lối rút của người trong ngục vẫn chưa mở; lần gặp tới cần tính cả phần HP hồi sinh đã được báo.",mechanics:"Hồi sinh đúng một lần với 35% HP; phá hết hai phần sinh lực mới thắng thật.",advice:["Đòn người chơi vẫn đi trước, nhưng chết giả không bỏ qua phản công.","Nghịch Mệnh được mở quyền học sau trận; không bắt phải hy sinh rank để đi tiếp."],unlocks:["nghich-menh"],artId:"truong-sinh"},{id:"khoi-loi-dai-hoi",name:"Thiên Kiêu Khôi Lỗi",chapter:5,requires:["truong-sinh"],recommendedRank:3,maxTurns:9,fighter:K(590,34,7),revival:{remaining:0,hpPercent:350},pattern:[y("Mượn kiếm","Ba nhát kiếm nhỏ; một lần né chỉ tránh một hit.",[500,500,500]),y("Mượn thân","Đòn nhẹ, sau đó giáp tăng 3.",[500],!0,0,3),y("Mượn huyết","Một đòn vừa, hồi 20 HP nếu còn sống.",[1e3],!0,20),y("Đứt dây","Khôi lỗi khựng lại, một hit nhẹ.",[250])],introduction:"Khôi lỗi đứng giữa hội trường, trên thân mang ấn của cả năm phái. Mỗi môn nó dùng đều từng thuộc một người có tên trong sổ. Tịch Vân nhìn thấy nét mực mình đã sao năm xưa.",victory:"Dây mực đứt, năm mảnh ấn rơi về người giữ truyền thừa. Đại hội chưa từng chọn người thành tiên; nó chọn người đủ mạnh để nuôi thiên ngục. Tịch Vân giữ một mảnh ấn có tên mình.",defeat:"Khôi lỗi rút về giữa sân. Người giữ truyền thừa mở lối ra, nhắc cậu đọc nhịp Đứt dây thay vì cố chịu tất cả những môn nó mượn.",mechanics:"Đổi nhóm chiêu theo bốn nhịp: đa hit, giáp, hồi và sơ hở.",advice:["Xuyên giáp và dồn sát thương giải những vấn đề khác nhau.","Truyền thừa là nhánh đầu tư thêm, tuyến chính không bắt sở hữu trấn phái."],unlocks:[],artId:"khoi-loi"},{id:"vo-anh",name:"Vô Ảnh Sát Chủ",chapter:6,requires:["khoi-loi-dai-hoi"],recommendedRank:3,maxTurns:10,fighter:K(610,39,3),revival:{remaining:0,hpPercent:350},pattern:[y("Chạm bóng","Hai hit nhỏ báo vị trí sát chủ.",[500,500]),y("Tuyệt ảnh","Một hit rất lớn đã báo; chuẩn bị khiên, né hoặc kết liễu.",[2200],!0),y("Lộ thân","Sát chủ thu tay, một hit nhẹ.",[200]),y("Ghim lối","Một hit vừa; không có hồi phục hoặc tăng giáp.",[1e3])],introduction:"Tấm Sát Lục Thiên Bảng ghi tên cậu trước khi tới trạm. Vô Ảnh Sát Chủ không săn đoàn tù; hắn săn người giữ bản sổ mà họ không thể sửa.",victory:"Mộc An đưa bản sổ qua trạm cũ trong lúc sát chủ mất bóng. Tịch Vân biết đường xuống thần mộ, nơi nét mực từng bị xóa khỏi đá mà không lấy thêm một tên người.",defeat:"Mộc An giữ được bản sổ nhưng lối tới thần mộ vẫn bị chặn. Nhịp Tuyệt ảnh đã được thấy rõ; cậu có thể trở lại với một phương án thủ đúng lúc.",mechanics:"Một đại kích xen nhịp cực nhẹ; công thủ đúng lượt tốt hơn lặp cùng một chiêu.",advice:["Hư Ảnh cần chuẩn bị trước; chọn sau khi đã mất HP không đảo lượt cũ.","Quan Thiên giúp nhìn xa, nhưng không xóa đại kích khỏi trận."],unlocks:[],artId:"vo-anh"},{id:"thu-mo",name:"Thủ Mộ Nhân",chapter:7,requires:["vo-anh"],recommendedRank:4,maxTurns:10,fighter:K(690,42,14),revival:{remaining:0,hpPercent:350},pattern:[y("Bia nặng","Một hit vừa; lớp giáp giữ những đòn nhỏ.",[900]),y("Khép mộ","Hai hit nhỏ, sau đó giáp tăng 3.",[600,600],!0,0,3),y("Mở bia","Một hit nhẹ; có thể tận dụng để tấn công hoặc dựng thế.",[250]),y("Mộ vang","Ba hit đã báo, giáp ảo xử lý giảm thương cho từng hit.",[700,700,700],!0)],introduction:"Thần mộ không có xác người, chỉ có những cái tên bị khắc đè lên nhau. Thủ Mộ Nhân giữ cửa để di sản Ngoại Đạo không rơi lại vào sổ của năm phái.",victory:"Bia mở, một đoạn kiếm thức không mang ấn phái hiện ra. Thủ Mộ Nhân trao thẻ chỉ tới sáu nơi giữ di sản và một thần binh đã mất chủ. Xóa mực không cần viết thêm một tên khác.",defeat:"Thủ Mộ Nhân khép bia, để lại lối ra như lúc cậu tới. Cậu đã thấy nhịp Mộ vang; chuẩn bị lại mà không cần bỏ bản luyện đang có.",mechanics:"Giáp lớn và đa hit có nhịp nghỉ; xuyên giáp, tích lực hoặc đổi thế đều hữu ích.",advice:["Mỗi hit nhỏ chịu giáp riêng; một đòn xuyên có thể tốt hơn ba đòn nhỏ.","Ngoại Đạo luyện khó hơn nhưng không là khóa bắt buộc của tuyến chính."],unlocks:[],artId:"thu-mo",artPosition:[.5,0],rewards:{weapons:["thach-tam"],achievements:[]}},{id:"la-sat",name:"La Sát Nữ Đế",chapter:8,requires:["thu-mo"],recommendedRank:4,maxTurns:10,fighter:K(740,45,6),revival:{remaining:0,hpPercent:350},pattern:[y("Huyết tuyến","Hai hit vừa; nếu còn sống, Nữ Đế hồi 20 HP.",[700,700],!0,20),y("Ngừng huyết","Một hit nhẹ, không hồi phục.",[250]),y("Nữ đế lệnh","Một đại kích đã báo; cần giữ sinh lực hoặc thế thủ.",[1900],!0),y("Giữ bờ","Một đòn vừa, không có hiệu ứng thêm.",[900])],introduction:"La Sát Nữ Đế đứng trước những người đã trốn lệnh. “Cậu muốn phá sổ. Ta muốn họ sống tới lúc sổ bị phá.” Bà buộc cậu chứng minh mình biết giữ sinh lực, không chỉ đổi nó lấy một đòn đẹp.",victory:"Nữ Đế mở bờ Huyết Hải cho đoàn người đi qua. Bà giữ phần giá của mình và từ chối để người yếu trả thay. Nhánh cấm thuật đã có nơi học, nhưng con đường lên ngũ tông vẫn rộng cho người không chọn chúng.",defeat:"La Sát đưa người chạy khỏi bờ, không gọi cái chết là một bài học bắt buộc. Cậu có thể trở lại với cách giữ HP trước nhịp Nữ đế lệnh.",mechanics:"Hồi sau đa hit và đại kích theo chu kỳ; sinh lực là tài nguyên cần giữ.",advice:["Táng Nhật để lại 1 HP nếu đối thủ còn sống; đừng coi là đòn kết thúc miễn phí.","Hút sinh lực chỉ hồi từ HP thật đã lấy được."],unlocks:[],artId:"la-sat"},{id:"thien-luat",name:"Thiên Luật Chấp Kiếm Sứ",chapter:9,requires:["la-sat"],recommendedRank:5,maxTurns:11,fighter:K(900,49,12),revival:{remaining:0,hpPercent:350},pattern:[y("Dựng luật","Một đòn nhẹ, sau đó giáp tăng 4.",[400],!0,0,4),y("Chấp kiếm","Một hit mạnh đã báo.",[1800],!0),y("Truy vấn","Ba hit nhỏ, mỗi hit xử lý phòng ngự riêng.",[500,500,500]),y("Luật khuyết","Một hit nhẹ; đây là khoảng dựng thế hoặc dồn công.",[200])],introduction:"Chấp Kiếm Sứ đòi Tịch Vân giao sổ để đổi lấy tên A Lạc. Tịch Vân viết tên mình cạnh những người đã bị bắt: “Ta không còn được đứng ngoài phần mình đã sao.”",victory:"Năm cửa cũ mở khi bản sổ không còn một người đứng ngoài. Chấp Kiếm Sứ để lộ đường tới Cửu Trụ: thần lực không đến từ người được chọn, mà từ quyền lựa chọn bị lấy mất.",defeat:"Tịch Vân mang sổ qua cửa bên trong lúc cậu rút. Cuộc đổi chác vẫn bị từ chối; muốn phá luật cần chuẩn bị cho những nhịp giáp và đại kích khác nhau.",mechanics:"Giáp tích lũy có trần; hai dạng áp lực xen một nhịp nghỉ.",advice:["Nghịch Luân tháo phần giáp vừa tăng, không tua lại toàn bộ trận.","Giữ đòn lớn cho sơ hở hoặc dùng xuyên để không lệ thuộc sơ hở."],unlocks:[],artId:"thien-luat"},{id:"ky-hanh-2",name:"Kỷ Hành · phản đạo",chapter:10,requires:["thien-luat"],recommendedRank:5,maxTurns:11,fighter:K(910,53,7),revival:{remaining:0,hpPercent:350},pattern:[y("Mở đoàn","Một hit nhẹ khi Kỷ Hành nhường lối cho đoàn tù.",[300]),y("Chặn sau","Bốn nhát nhỏ liên tiếp; khiên bền hoặc giảm thương giữ giá trị.",[450,450,450,450]),y("Phản lệnh","Một đại kích đã báo; đây là nhịp áp lực chính.",[1900],!0),y("Thu kiếm","Đòn vừa, không có tăng giáp hoặc hồi.",[800])],introduction:"Kỷ Hành vẫn đeo thẻ giữ lệnh, nhưng đoàn tù đã được đổi đường. Anh chặn người chơi để tay giám sát không biết ai vừa mở cửa: “Đánh ta trước khi chúng nhìn ra.”",victory:"Trong bao kiếm có thư do A Lạc viết. Người bị giam đã tự giấu tên khỏi một trụ; họ đang chờ đường ra, không chờ một người làm thay mọi việc.",defeat:"Kỷ Hành giữ việc đổi đoàn chưa bị lộ. Cậu đã thấy khác biệt giữa bốn nhát Chặn sau và một đại kích Phản lệnh; có thể đổi cách phòng ngự khi trở lại.",mechanics:"Tái ngộ với chuỗi bốn hit và đại kích, không lặp nhịp tỷ thí chương02.",advice:["Một lần né không chặn cả bốn hit.","Có thể chọn công lớn vào nhịp Mở đoàn để giảm tổng phản công cần chịu."],unlocks:[],artId:"ky-hanh"},{id:"tru-thach",name:"Thần Tướng Thạch Trụ",chapter:11,requires:["ky-hanh-2"],recommendedRank:5,maxTurns:11,fighter:K(930,46,21),revival:{remaining:0,hpPercent:350},pattern:[y("Khóa đá","Một đòn nhẹ, giáp tăng 3.",[500],!0,0,3),y("Nghiền tên","Một hit mạnh đã báo; giáp không tăng trong nhịp này.",[1800],!0),y("Bia nứt","Một hit nhẹ trước khe nứt của trụ.",[200])],introduction:"Thần tướng giữ ba trụ đá ghi tên người từ các thôn. Một nét mực A Lạc để lại chỉ đúng vết nứt; cần phá người giữ trước khi phá trụ.",victory:"Ba trụ đá ngừng ghi tên. A Lạc mở một cửa từ phía trong, nhưng dòng tên vẫn chạy qua ba trụ nước.",defeat:"Khe nứt vẫn còn đúng chỗ A Lạc đánh dấu. Cậu rút ra trước khi trụ khép, giữ được đường trở lại.",mechanics:"Giáp lớn theo nhịp ba lượt; một đòn xuyên mạnh hoặc công pháp tích lực có lợi.",advice:["Đừng chia mọi đòn
