<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>Thói quen · Bản demo tương tác</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color-scheme: light;
        --bg: #f4f3f8;
        --paper: #fff;
        --ink: #272438;
        --muted: #6f6a82;
        --line: #e7e4ef;
        --purple: #7460d5;
        --soft: #eeeafa;
        --orange: #bd5d39;
        --orange-soft: #fcf3ee;
        --orange-line: #efdbd0;
        --red: #a43e4d;
        --red-soft: #fcf0f1;
        color: var(--ink);
        background: var(--bg);
        font-synthesis: none;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-size: 14px; line-height: 1.5; }
      button, input, select, textarea { font: inherit; color: inherit; }
      button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
      button:disabled { opacity: .45; cursor: default; }
      button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
        outline: 3px solid var(--purple); outline-offset: 3px;
      }
      [hidden] { display: none !important; }
      h1, h2, h3, p { margin: 0; }
      svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
      button svg { pointer-events: none; }
      .demo-bar { border-bottom: 1px solid var(--line); background: #eeecf5; }
      .demo-bar-inner { max-width: 600px; margin: auto; padding: 5px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 11px; }
      .demo-bar button { border: 0; background: none; padding: 8px 0 8px 12px; min-height: 36px; font-size: 11px; white-space: nowrap; text-decoration: underline; text-underline-offset: 3px; }
      .app { max-width: 560px; margin: auto; padding: 28px 22px 55px; }
      .page-heading { display: flex; justify-content: space-between; align-items: center; gap: 15px; }
      .page-actions { display: flex; align-items: center; gap: 8px; flex: none; }
      .page-actions > .btn { height: 44px; min-height: 44px; padding: 10px 14px; }
      .page-menu { position: relative; }
      .page-menu > summary { list-style: none; cursor: pointer; width: 44px; height: 44px; min-height: 44px; border: 1px solid var(--line); background: var(--paper); color: var(--muted); }
      .page-menu > summary::-webkit-details-marker { display: none; }
      .menu-list { position: absolute; top: calc(100% + 7px); right: 0; min-width: 215px; padding: 6px; background: var(--paper); border: 1px solid var(--line); border-radius: 13px; box-shadow: 0 10px 30px #30203c14; z-index: 10; }
      .menu-list button { display: flex; align-items: center; gap: 10px; border: 0; border-radius: 8px; background: none; width: 100%; min-height: 45px; padding: 10px 12px; text-align: left; font-size: 12px; }
      .menu-list button:hover { background: var(--bg); }
      .menu-list svg { width: 17px; height: 17px; color: var(--muted); }
      .menu-count { margin-left: auto; color: var(--muted); }
      .back-button { display: inline-flex; align-items: center; gap: 5px; margin: -7px 0 11px; }
      .back-button svg { width: 15px; height: 15px; }
      h1 { font-size: 28px; font-weight: 650; letter-spacing: -.6px; line-height: 1.2; }
      .page-description { margin-top: 8px; font-size: 13px; color: var(--muted); }
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 44px; padding: 10px 15px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); font-size: 13px; font-weight: 550; }
      .btn svg { width: 17px; height: 17px; }
      .primary { background: var(--purple); border-color: var(--purple); color: white; }
      .danger { color: var(--red); border-color: #edcfd5; background: var(--red-soft); }
      .danger-solid { color: white; border-color: var(--red); background: var(--red); }
      .text-button { border: 0; background: none; color: var(--purple); min-height: 44px; padding: 8px 0; font-size: 12px; font-weight: 600; }
      .icon-button { display: grid; place-items: center; width: 44px; min-width: 44px; min-height: 44px; border: 0; border-radius: 12px; background: none; color: var(--muted); }
      .icon-button:hover, .text-button:hover { background: var(--soft); }
      .today-summary { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 5px 16px; padding: 21px 20px; border: 1px solid var(--line); border-bottom: 0; border-radius: 18px 18px 0 0; margin: 25px 0 0; background: var(--paper); }
      .summary-date { grid-column: 1; grid-row: 1; font-size: 13px; color: var(--ink); font-weight: 600; }
      .summary-number { grid-column: 2; grid-row: 1 / span 2; font-size: 19px; color: var(--muted); line-height: 1.1; font-variant-numeric: tabular-nums; }
      .summary-number strong { color: var(--purple); font-size: 36px; font-weight: 650; letter-spacing: -1.5px; }
      .summary-title { grid-column: 1; grid-row: 2; font-size: 12px; color: var(--muted); }
      .habit-section { margin-top: 22px; padding: 6px 18px 8px; border: 1px solid var(--line); border-radius: 18px; background: var(--paper); }
      .today-summary + .habit-section { margin-top: 0; padding-top: 0; border-top: 0; border-radius: 0 0 18px 18px; }
      .today-summary + .habit-section > .section-head { border-top: 1px solid var(--line); }
      .summary-bar { display: block; width: 100%; height: 5px; border: 0; border-radius: 4px; margin-top: 14px; overflow: hidden; appearance: none; }
      .summary-bar::-webkit-progress-bar { background: var(--line); border-radius: 4px; }
      .summary-bar::-webkit-progress-value { background: var(--purple); border-radius: 4px; }
      .summary-bar::-moz-progress-bar { background: var(--purple); }
      .section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 5px 0 4px; min-height: 56px; }
      .section-head h2 { font-size: 14px; font-weight: 600; letter-spacing: -.3px; }
      .section-head p { font-size: 11px; color: var(--muted); margin-top: 3px; }
      .section-actions { display: flex; gap: 15px; align-items: center; flex: none; }
      .selection-toggle { flex: none; padding-left: 0; }
      .selection-toggle[aria-pressed="true"] { color: var(--ink); }
      .habit-row { display: flex; align-items: center; gap: 9px; padding: 13px 0; position: relative; }
      .habit-row + .habit-row::before { content: ""; position: absolute; left: 39px; right: 0; top: 0; height: 1px; background: var(--line); }
      .habit-row.selected { background: var(--soft); border-radius: 10px; }
      .habit-check { width: 21px; height: 21px; margin: 0 6px 0 0; flex: none; accent-color: var(--purple); cursor: pointer; }
      .check-wrap { display: flex; align-items: center; justify-content: center; width: 30px; min-height: 44px; flex: none; cursor: pointer; }
      .check-wrap .habit-check { margin: 0; }
      .habit-check:disabled { cursor: default; }
      .habit-open { flex: 1; min-width: 0; border: 0; background: none; padding: 3px 0; text-align: left; min-height: 44px; }
      .habit-copy { flex: 1; min-width: 0; }
      .habit-copy > .habit-open { width: 100%; display: block; }
      .habit-inline-progress { display: block; min-height: 44px; border: 0; background: none; color: var(--purple); padding: 4px 0; font-size: 12px; text-align: left; }
      .habit-open strong { display: block; font-size: 15px; font-weight: 550; overflow-wrap: anywhere; }
      .habit-meta { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; line-height: 1.6; }
      .habit-meta svg { display: inline; vertical-align: -2px; height: 12px; width: 12px; margin-right: 3px; }
      .habit-row.done .habit-open strong { color: var(--muted); }
      .amount { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: none; border: 1px solid var(--line); border-radius: 10px; min-height: 48px; width: 64px; min-width: 64px; background: var(--paper); padding: 5px 8px; font-size: 11px; line-height: 1.3; }
      .amount strong { color: var(--purple); font-size: 14px; font-weight: 600; }
      .amount span { color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
      .habit-options { position: relative; flex: none; }
      .habit-options > summary { list-style: none; cursor: pointer; color: var(--purple); font-size: 12px; font-weight: 550; }
      .habit-options > summary::-webkit-details-marker { display: none; }
      .habit-options > .menu-list { min-width: 185px; }
      .sheet-footer .habit-options { flex: 1; min-width: 0; }
      .sheet-footer .habit-options > summary { width: 100%; height: 100%; }
      .sheet-footer .habit-options > .menu-list { top: auto; bottom: calc(100% + 7px); }
      .habit-meta-note { display: block; margin-top: 3px; }
      .row-chevron { display: grid; place-items: center; width: 16px; min-height: 44px; padding: 0; border: 0; background: none; color: #aaa1b7; flex: none; }
      .row-chevron svg { width: 14px; height: 14px; }
      .group { border-top: 1px solid var(--line); }
      .group > summary { cursor: pointer; min-height: 49px; display: flex; align-items: center; gap: 8px; list-style: none; font-size: 12px; color: var(--muted); }
      .group > summary::-webkit-details-marker { display: none; }
      .group > summary::before { content: "›"; font-size: 22px; line-height: 1; transition: transform .15s; }
      .group[open] > summary::before { transform: rotate(90deg); }
      .done-count { color: var(--muted); font-size: 11px; }
      .tower-entry { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 18px; padding: 18px; border: 1px solid var(--line); border-radius: 18px; background: var(--paper); }
      .tower-entry-copy { min-width: 0; }
      .tower-eyebrow { font-size: 9px; font-weight: 650; letter-spacing: 1.1px; color: var(--orange); }
      .tower-entry h2 { font-size: 15px; font-weight: 600; letter-spacing: -.2px; margin-top: 6px; }
      .tower-entry p:last-child { font-size: 12px; color: var(--muted); margin-top: 7px; line-height: 1.6; }
      .tower-entry > .btn { flex: none; font-size: 12px; padding: 9px 12px; color: var(--purple); }
      .journal-entry { display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 18px; padding: 16px 18px; text-align: left; border: 1px solid var(--line); border-radius: 18px; background: var(--paper); }
      .journal-entry > svg { color: var(--purple); }
      .journal-entry-copy { flex: 1; min-width: 0; }
      .journal-entry strong { display: block; font-size: 14px; font-weight: 600; }
      .journal-entry small { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
      .journal-entry > svg:last-child { width: 16px; color: var(--muted); }
      .journal-date-row { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
      .journal-date-row label { color: var(--muted); font-size: 12px; flex: 1; }
      .journal-date-row input { max-width: 65%; min-width: 0; min-height: 44px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); font-size: 14px; }
      .journal-form textarea { min-height: 105px; }
      .journal-status { color: var(--muted); font-size: 11px; margin-bottom: 18px; }
      .journal-list-page .page-heading { flex-wrap: wrap; }
      .diary-list { margin-top: 25px; border: 1px solid var(--line); border-radius: 18px; background: var(--paper); overflow: hidden; }
      .diary-day { display: flex; align-items: center; gap: 16px; width: 100%; padding: 20px 18px; border: 0; background: var(--paper); text-align: left; }
      .diary-day + .diary-day { border-top: 1px solid var(--line); }
      .diary-day:hover { background: var(--bg); }
      .diary-day:focus-visible { outline-offset: -4px; }
      .diary-day > time { width: 1.8em; flex: none; text-align: center; font-size: 24px; font-weight: 600; color: var(--purple); line-height: 1.2; }
      .diary-day time small { display: block; margin-top: 5px; font-size: 10px; font-weight: 400; color: var(--muted); }
      .diary-copy { min-width: 0; flex: 1; }
      .diary-copy strong { font-size: 14px; font-weight: 600; }
      .diary-copy p { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; font-size: 13px; line-height: 1.7; color: var(--muted); margin-top: 7px; }
      .diary-copy small { display: block; margin-top: 5px; font-size: 11px; color: var(--muted); }
      .diary-day > svg { width: 16px; color: var(--muted); }
      .journal-empty { margin-top: 25px; background: var(--paper); border-style: solid; }
      .reading-date { display: block; font-size: 24px; font-weight: 650; letter-spacing: -.6px; line-height: 1.35; margin: 2px 0 24px; }
      .reading-date span, .reading-date strong { display: block; font-weight: inherit; }
      .reading-status { margin-top: -10px; margin-bottom: 24px; }
      .journal-reward { margin: -8px 0 24px; padding: 11px 13px; border-radius: 11px; background: var(--soft); color: var(--purple); font-size: 12px; line-height: 1.7; }
      .journal-reward strong { font-weight: 600; }
      .reading-section + .reading-section { margin-top: 24px; padding-top: 22px; border-top: 1px solid var(--line); }
      .reading-section h3 { font-size: 12px; font-weight: 550; color: var(--muted); margin-bottom: 10px; }
      .reading-section p { font-size: 15px; line-height: 1.8; white-space: pre-wrap; overflow-wrap: anywhere; }
      .tower-path { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; list-style: none; margin: 0 0 22px; padding: 0; }
      .tower-path li { border: 1px solid var(--line); border-radius: 10px; text-align: center; padding: 9px 3px; font-size: 10px; color: var(--muted); }
      .tower-path li.current { color: var(--purple); border-color: var(--purple); background: var(--soft); }
      .tower-path li.cleared { color: var(--purple); background: var(--soft); }
      .tower-stage { text-align: center; }
      .tower-stage h3 { font-size: 20px; letter-spacing: -.4px; line-height: 1.35; }
      .tower-stage > p { font-size: 12px; line-height: 1.7; color: var(--muted); margin: 9px auto 0; max-width: 34ch; }
      .tower-art { display: block; width: 100%; height: auto; fill: none; stroke: none; stroke-width: 0; }
      .tower-entry-art { width: 85px; margin: 2px auto 20px; }
      .tower-reward-list { margin: 20px 0; padding: 0; list-style: none; }
      .tower-reward-list li { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
      .tower-reward-list strong { color: var(--ink); font-weight: 550; }
      .tower-conditions { display: grid; gap: 8px; padding: 13px; border-radius: 11px; background: var(--bg); font-size: 11px; color: var(--muted); }
      .tower-conditions .met { color: var(--purple); }
      .tower-demo-note { text-align: center; color: var(--muted); font-size: 10px; margin: 17px 0 0; }
      .tower-deck { display: grid; grid-template-columns: repeat(var(--cards), minmax(0, 1fr)); align-items: center; gap: 9px; margin: 23px 0; }
      .tower-deck button { display: block; min-width: 0; width: 100%; padding: 0; border: 0; background: transparent; border-radius: 9px; transition: transform .15s; }
      .tower-deck button:hover { transform: translateY(-5px); }
      .tower-deck button:focus-visible { outline-offset: 4px; }
      .tower-result-art { width: 100px; margin: 8px auto 20px; }
      .tower-purse { display: flex; justify-content: space-between; gap: 12px; padding: 13px; border: 1px solid var(--orange-line); border-radius: 11px; background: var(--orange-soft); margin-top: 20px; font-size: 12px; }
      .tower-purse span { color: var(--muted); }
      .tower-purse strong { color: var(--orange); font-weight: 600; }
      .tower-decision-note { font-size: 11px; line-height: 1.7; color: var(--muted); margin-top: 15px; }
      .empty { padding: 28px 20px; border: 1px dashed var(--line); border-radius: 17px; text-align: center; }
      .empty svg { width: 29px; height: 29px; color: var(--purple); margin-bottom: 10px; }
      .empty h3 { font-size: 15px; margin-bottom: 7px; }
      .empty p { font-size: 12px; color: var(--muted); max-width: 32ch; margin: 0 auto; }
      .empty button { margin-top: 17px; }
      .bulk { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 560px; padding: 12px 20px max(16px, env(safe-area-inset-bottom)); border: 1px solid var(--line); border-bottom: 0; border-radius: 18px 18px 0 0; background: #fff; box-shadow: 0 -8px 30px #3420440c; z-index: 5; }
      .bulk-label { font-size: 12px; font-weight: 600; margin-bottom: 9px; }
      .bulk-actions { display: flex; gap: 9px; }
      .bulk-actions .btn { flex: 1; font-size: 12px; padding: 10px 8px; }
      body.selecting .app { padding-bottom: 170px; }
      dialog { padding: 0; color: var(--ink); border: 1px solid var(--line); width: calc(100% - 32px); max-width: 470px; max-height: min(88dvh, 790px); border-radius: 22px; box-shadow: 0 25px 100px #24173725; background: var(--paper); overflow: hidden; }
      dialog[open] { display: flex; flex-direction: column; }
      dialog::backdrop { background: #28213d66; backdrop-filter: blur(3px); }
      .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 13px 16px 12px 23px; gap: 10px; border-bottom: 1px solid var(--line); flex: none; }
      .sheet-head h2 { font-size: 18px; letter-spacing: -.4px; overflow-wrap: anywhere; line-height: 1.4; }
      .sheet-body { padding: 22px 23px; overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
      .sheet-footer { padding: 15px 23px max(18px, env(safe-area-inset-bottom)); display: flex; gap: 9px; border-top: 1px solid var(--line); flex: none; }
      .sheet-footer .btn { flex: 1; }
      .detail-today { background: var(--bg); border: 1px solid var(--line); padding: 18px; border-radius: 15px; }
      .detail-caption { font-size: 11px; color: var(--muted); }
      .detail-number { font-size: 33px; letter-spacing: -1.3px; font-weight: 650; color: var(--purple); line-height: 1.2; margin-top: 7px; }
      .detail-number small { font-size: 14px; color: var(--muted); letter-spacing: 0; font-weight: 400; }
      .detail-status { color: var(--muted); font-size: 11px; margin-top: 10px; }
      .detail-status.met { color: var(--purple); }
      .info { margin: 20px 0 0; }
      .info > div { display: flex; gap: 20px; align-items: baseline; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
      .info dt { color: var(--muted); flex: none; }
      .info dd { text-align: right; margin: 0; overflow-wrap: anywhere; }
      .note { margin-top: 18px; font-size: 12px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
      .history { margin-top: 16px; }
      .history > summary, .extra > summary { cursor: pointer; min-height: 44px; padding: 10px 0; color: var(--muted); font-size: 12px; }
      .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; margin: 5px 0 10px; }
      .week-cell { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 10px; color: var(--muted); }
      .week-cell b { font-size: 13px; width: 31px; height: 34px; display: grid; place-items: center; border-radius: 9px; background: var(--bg); font-weight: 500; }
      .week-cell.met b { color: var(--purple); background: var(--soft); }
      .week-legend { color: var(--muted); font-size: 10px; margin-top: 8px; }
      .manage { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 10px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1px 13px; }
      .manage button { min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 8px 0; border: 0; background: none; font-size: 12px; color: var(--muted); }
      .manage svg { width: 15px; height: 15px; }
      .manage .remove { color: var(--red); }
      .archive-notice { background: var(--bg); padding: 16px; border-radius: 13px; font-size: 12px; color: var(--muted); display: flex; gap: 10px; align-items: flex-start; }
      .archive-notice svg { color: var(--muted); margin-top: 2px; }
      .archive-notice strong { display: block; color: var(--ink); margin-bottom: 4px; font-weight: 550; }
      .field { display: block; margin-bottom: 18px; min-width: 0; }
      .field > span, .field-title { display: block; font-size: 12px; font-weight: 550; margin-bottom: 8px; }
      .field input, .field select, .field textarea { width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; font-size: 16px; }
      .field textarea { resize: vertical; min-height: 76px; }
      .field input:disabled { color: var(--muted); background: var(--bg); }
      .field-help { display: block; color: var(--muted); font-size: 11px; margin-top: 6px; font-weight: 400; }
      .field-row { display: flex; gap: 12px; }
      .field-row > .field { flex: 1; }
      .extra { border-top: 1px solid var(--line); }
      .extra > summary { color: var(--ink); }
      .extra[open] > summary { margin-bottom: 10px; }
      .weekdays { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 18px; }
      .weekday { position: relative; flex: 1; min-width: 30px; }
      .weekday input { position: absolute; width: 1px; height: 1px; opacity: 0; }
      .weekday span { display: grid; place-items: center; min-height: 42px; border: 1px solid var(--line); border-radius: 8px; font-size: 12px; cursor: pointer; }
      .weekday input:checked + span { background: var(--soft); border-color: var(--purple); color: var(--purple); }
      .weekday input:focus-visible + span { outline: 3px solid var(--purple); outline-offset: 2px; }
      .form-error { color: var(--red); font-size: 12px; margin-top: 10px; }
      .log-progress { font-size: 33px; font-weight: 600; letter-spacing: -.9px; line-height: 1.3; font-variant-numeric: tabular-nums; }
      .log-progress small { font-size: 14px; color: var(--muted); letter-spacing: 0; font-weight: 400; }
      .log-context { color: var(--muted); font-size: 11px; margin: 4px 0 22px; }
      .log-range-block { margin-bottom: 22px; }
      input.duration-range { display: block; width: 100%; min-height: 44px; padding: 0; border: 0; background: transparent; appearance: none; cursor: pointer; --fill: 0%; }

          <label class="field"><span>Lặp lại</span><select name="cadence"><option value="daily">Mỗi ngày</option><option value="weekdays">Chọn ngày trong tuần</option><option value="weekly">Linh hoạt theo tuần</option></select></label>
          <div id="days-field"><span class="field-title" id="days-label">Các ngày thực hiện</span><div class="weekdays" role="group" aria-labelledby="days-label">${["T2", "T3", "T4", "T5", "T6", "T7", "CN"].map((label, i) => `<label class="weekday"><input name="days" type="checkbox" value="${i}" ${original.days.includes(i) ? "checked" : ""} /><span>${label}</span></label>`).join("")}</div></div>
          <label class="field" id="quota-field"><span>Số ngày mỗi tuần</span><input name="quota" type="number" min="1" max="7" step="1" value="${original.quota}" required /><small class="field-help">Thực hiện vào bất kỳ ngày nào. Mỗi ngày tính một lần.</small></label>
          <details class="extra" ${original.reminder || original.note ? "open" : ""}><summary>Nhắc giờ & ghi chú</summary><label class="field"><span>Giờ nhắc <small style="font-weight:400;color:var(--muted)">· không bắt buộc</small></span><input name="reminder" type="time" value="${esc(original.reminder)}" /><small class="field-help">Để trống nếu không cần nhắc.</small></label><label class="field"><span>Ghi chú</span><textarea name="note" maxlength="300" placeholder="Điều cậu muốn nhớ…">${esc(original.note)}</textarea></label></details>
          <p class="form-error" id="form-error" role="alert" hidden></p>
        </form>`, `<button class="btn" data-action="${h ? "detail" : "close"}" ${h ? `data-id="${esc(h.id)}"` : ""}>Hủy</button><button class="btn primary" type="submit" form="habit-form">${h ? "Lưu thay đổi" : "Thêm thói quen"}</button>`);
        const form = $("#habit-form");
        form.elements.metric.value = original.metric; form.elements.cadence.value = original.cadence;
        function updateFields() {
          const metric = form.elements.metric.value, repeat = form.elements.cadence.value;
          $("#target-fields").hidden = metric === "check";
          form.elements.target.disabled = metric === "check";
          $("#unit-field").hidden = metric !== "quantity";
          form.elements.unit.disabled = metric !== "quantity";
          $("#days-field").hidden = repeat !== "weekdays";
          $("#quota-field").hidden = repeat !== "weekly";
          form.elements.quota.disabled = repeat !== "weekly";
        }
        form.elements.metric.addEventListener("change", updateFields); form.elements.cadence.addEventListener("change", updateFields); updateFields();
        form.addEventListener("submit", event => {
          event.preventDefault();
          const data = new FormData(form), name = String(data.get("name")).trim(), metric = String(data.get("metric")), repeat = String(data.get("cadence"));
          const days = data.getAll("days").map(Number), unit = metric === "quantity" ? String(data.get("unit")).trim() : metric === "duration" ? "phút" : "lần";
          const error = !name ? "Nhập tên thói quen nhé." : repeat === "weekdays" && !days.length ? "Chọn ít nhất một ngày trong tuần nhé." : !unit ? "Nhập đơn vị ghi nhận nhé." : "";
          if (error) { $("#form-error").textContent = error; $("#form-error").hidden = false; return; }
          const patch = { name, metric, target: metric === "check" ? 1 : Number(data.get("target")), unit, cadence: repeat, days, quota: repeat === "weekly" ? Number(data.get("quota")) : original.quota, reminder: String(data.get("reminder")), note: String(data.get("note")).trim() };
          if (h) {
            if (h.metric !== metric || h.unit !== unit) { h.value = 0; h.history = [null, null, null, null, null, null]; }
            Object.assign(h, patch);
          } else {
            habits.push({ id: crypto.randomUUID ? crypto.randomUUID() : "habit-" + Date.now(), ...patch, value: 0, weekBase: 0, archived: false, history: [null, null, null, null, null, null] });
            tab = "active";
          }
          selecting = false; selected.clear(); persist(); render(); closeSheet(); toast(h ? "Đã lưu thay đổi" : "Đã thêm thói quen");
        });
      }
      function toggleSelection(id, focusAction = "check") {
        selected.has(id) ? selected.delete(id) : selected.add(id);
        render(`[data-action='${focusAction}'][data-id='${CSS.escape(id)}']`);
      }
      document.addEventListener("click", event => {
        const button = event.target.closest("[data-action]");
        if (!button || button.disabled) return;
        const action = button.dataset.action, h = getHabit(button.dataset.id);
        if (action === "add") openEditor();
        if (action === "archive-list" || action === "back") { tab = action === "archive-list" ? "archived" : "active"; selecting = false; selected.clear(); render(action === "archive-list" ? "[data-action='back']" : ".page-menu > summary"); }
        if (action === "select-mode") { selecting = !selecting; selected.clear(); render("[data-action='select-mode']"); }
        if (action === "select-all") { const list = visible(); selected = selected.size === list.length ? new Set() : new Set(list.map(h => h.id)); render("[data-action='select-all']"); }
        if (action === "open") selecting ? toggleSelection(h.id, "open") : openDetail(h);
        if (action === "check") selecting ? toggleSelection(h.id) : toggle(h);
        if (action === "log") openLog(h);
        if (action === "defer-today") deferHabit(h);
        if (action === "resume-today") deferHabit(h, true);
        if (action === "journal" || action === "journal-today") journalDrafts[DAY] ? openJournal() : showJournal();
        if (action === "journal-list") { tab = "journals"; selecting = false; selected.clear(); render("[data-action='back']"); window.scrollTo(0, 0); }
        if (action === "journal-open") showJournal(button.dataset.day);
        if (action === "journal-edit") openJournal(button.dataset.day);
        if (action === "journal-delete") deleteJournal(button.dataset.day);
        if (action === "detail") openDetail(h);
        if (action === "close") closeSheet();
        if (action === "edit") openEditor(h);
        if (action === "toggle-one") toggle(h);
        if (action === "archive-one") archiveHabits([h.id]);
        if (action === "restore-one") archiveHabits([h.id], true);
        if (action === "delete-one") deleteHabits([h.id]);
        if (action === "delete-selected") deleteHabits([...selected]);
        if (action === "tower-open") openTower();
        if (["tower-start", "tower-pick", "tower-next", "tower-claim"].includes(action)) towerCommand(action, Number(button.dataset.card));
      });
      document.addEventListener("click", event => { document.querySelectorAll(".page-menu[open], .habit-options[open]").forEach(menu => { if (!menu.contains(event.target)) menu.open = false; }); });
      document.addEventListener("keydown", event => { if (event.key === "Escape") document.querySelectorAll(".page-menu[open], .habit-options[open]").forEach(menu => { menu.open = false; $("summary", menu).focus(); event.preventDefault(); }); });
      for (const dialog of [sheet, confirmation]) dialog.addEventListener("click", event => {
        if (event.target !== dialog) return;
        const rect = dialog.getBoundingClientRect();
        if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) dialog.close();
      });
      $("#reset").addEventListener("click", () => openConfirmation("Đặt lại dữ liệu mẫu?", '<p class="confirm-copy">Thói quen và lượt tháp sẽ trở về dữ liệu mẫu ban đầu. Nhật ký đã viết được giữ lại.</p>', "Đặt lại demo", () => {
        habits = initial(); tower = null; tab = "active"; selecting = false; selected.clear(); groups.done = false; groups.outside = false;
        persist(); render(); toast("Đã đặt lại dữ liệu mẫu");
      }, false));
      render();
      persist();
      function refreshDay() {
        const next = todayKey();
        if (next <= DAY) return;
        advanceHabits(DAY, next); DAY = next;
        persist(); render();
        if (sheet.open && !sheet.querySelector("#journal-form, .journal-reading")) closeSheet();
        const journalDate = $("#journal-date"); if (journalDate) journalDate.max = DAY;
      }
      document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshDay(); });
      window.addEventListener("focus", refreshDay);
      setInterval(refreshDay, 60000);
    </script>
  </body>
</html>
