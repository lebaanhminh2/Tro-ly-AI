<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>FE demo - Minh Anh · Trợ lý của cậu</title>
  <style>:root {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color-scheme: light;
  --bg: #f4f3f8;
  --surface: #fff;
  --text: #272438;
  --muted: #78748a;
  --line: #e7e4ef;
  --accent: #7460d5;
  --soft: #eeeafa;
  --status: #635776;
  --gold: #a46e23;
  --shadow: 0 10px 35px #28213f08;
}
.habit-navigation,
.habit-filters {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin: 12px 0;
}
.habit-navigation {
  border-bottom: 1px solid var(--line);
  padding-bottom: 10px;
}
.habit-navigation button[aria-pressed='true'],
.habit-filters button[aria-pressed='true'] {
  background: var(--soft);
  color: var(--text);
}
.habit-list {
  display: grid;
  gap: 12px;
  margin: 18px 0;
}
.habit-card {
  margin: 0;
  border-left: 3px solid var(--line);
}
.habit-card.is-met {
  border-left-color: var(--status);
}
.habit-card-head,
.habit-card-body {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-width: 0;
}
.habit-copy {
  min-width: 0;
}
.habit-card h2 {
  font-size: 17px;
  line-height: 1.4;
  margin: 0;
  overflow-wrap: anywhere;
}
.habit-cadence {
  font-size: 12px;
  color: var(--muted);
  margin: 3px 0 0;
}
.habit-card-body {
  margin-top: 12px;
  align-items: flex-start;
}
.habit-card-body > div {
  min-width: 0;
  flex: 1;
}
.habit-value {
  margin: 0 0 3px;
  font-variant-numeric: tabular-nums;
}
.habit-value strong {
  font-size: 23px;
  font-weight: 650;
}
.habit-value span {
  font-size: 13px;
  color: var(--muted);
}
.habit-status {
  font-size: 13px;
  line-height: 1.5;
  margin: 0;
  color: var(--text);
}
.habit-week {
  font-size: 12px;
  line-height: 1.5;
  margin: 4px 0 0;
  color: var(--muted);
}
.habit-check {
  flex-shrink: 0;
  min-height: 44px;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  color: var(--text);
  font-size: 13px;
}
.habit-check.checked {
  background: var(--soft);
  border-color: transparent;
}
.habit-log-button {
  flex-shrink: 0;
  font-size: 13px;
  padding: 10px 12px;
  min-height: 44px;
}
.habit-pending,
.habit-note {
  font-size: 12px;
  line-height: 1.5;
  color: var(--muted);
  margin: 10px 0 0;
  overflow-wrap: anywhere;
}
.habit-pending {
  padding-top: 10px;
  border-top: 1px solid var(--line);
}
.habit-empty {
  margin-top: 28px;
  line-height: 1.6;
  max-width: 42ch;
}
.habit-weekdays {
  border: 0;
  padding: 0;
  margin: 16px 0;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.habit-weekdays legend {
  font-size: 13px;
  margin-bottom: 8px;
}
.habit-weekdays button {
  padding: 10px;
  min-width: 38px;
  min-height: 44px;
}
.habit-weekdays button[aria-pressed='true'] {
  background: var(--soft);
  border-color: var(--accent);
  color: var(--accent);
}
.habit-weekdays[hidden],
.habit-form [hidden] {
  display: none !important;
}
.habit-form-explanation {
  line-height: 1.6;
  margin-top: 16px;
}
.habit-history-tools {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  margin: 20px 0;
}
.habit-history-tools select {
  min-width: 0;
  flex: 1;
  min-height: 44px;
  font-size: 14px;
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  color: var(--text);
}
.habit-history-summary {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.6;
}
.habit-history-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 0;
  border-bottom: 1px solid var(--line);
}
.habit-history-row h3 {
  font-size: 14px;
  margin: 0;
  overflow-wrap: anywhere;
}
.habit-history-row > div {
  min-width: 0;
}
.habit-history-row .hint {
  font-size: 12px;
  margin: 4px 0 0;
}
.habit-history-value {
  text-align: right;
  font-size: 13px;
  max-width: 46%;
  font-variant-numeric: tabular-nums;
}
.habit-history-value small {
  display: block;
  font-size: 11px;
  color: var(--muted);
  margin-top: 5px;
}
.habit-notice p {
  font-size: 13px;
  line-height: 1.6;
}
.day-timeline {
  margin: 18px 0;
}
.time-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 8px;
}
.time-scroll {
  height: min(64dvh, 620px);
  min-height: 320px;
  overflow-y: auto;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--surface);
  margin-top: 14px;
  overscroll-behavior: contain;
  position: relative;
}
.time-canvas {
  position: relative;
  margin: 16px 10px 16px 0;
}
.time-hour {
  position: absolute;
  left: 0;
  right: 0;
  border-top: 1px solid var(--line);
  pointer-events: none;
}
.time-hour > span {
  position: absolute;
  top: 3px;
  left: 8px;
  font-size: 11px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.time-task,
.time-busy {
  position: absolute;
  left: 55px;
  right: 4px;
  border-radius: 12px;
  overflow: hidden;
}
.time-busy {
  background: repeating-linear-gradient(
    135deg,
    var(--line),
    var(--line) 2px,
    transparent 2px,
    transparent 9px
  );
  color: var(--muted);
  padding: 7px 10px;
  display: flex;
  flex-direction: column;
  font-size: 12px;
}
.time-task {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 3px 5px 3px 9px;
  background: var(--soft);
  border: 1px solid var(--accent);
  box-shadow: 0 3px 8px #00000008;
  z-index: 2;
}
.time-task .check {
  flex-shrink: 0;
  width: 20px;
  height: 20px;
}
.time-task-label {
  min-height: 0 !important;
  min-width: 0;
  flex: 1;
  text-align: left;
  background: none;
  border: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 2px;
  touch-action: pan-y;
}
.time-task-label strong {
  font-size: 13px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 100%;
}
.time-task-label small {
  font-size: 10px;
  color: var(--muted);
}
.time-task.current {
  border-width: 2px;
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent);
}
.time-drag {
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  width: 36px;
  align-self: stretch;
  min-height: 0 !important;
  border: 0;
  background: transparent;
  font-size: 25px;
  color: var(--accent);
  cursor: grab;
  flex-shrink: 0;
}
.time-task.dragging {
  z-index: 5;
  box-shadow: 0 8px 25px #0003;
  opacity: 0.95;
}
.time-task.invalid {
  border-color: #d75c65;
}
.time-drop-hint {
  position: sticky;
  top: 0;
  z-index: 6;
  background: var(--text);
  color: var(--surface);
  padding: 10px;
  border-radius: 10px;
  font-size: 13px;
}
.time-now {
  position: absolute;
  left: 0;
  right: 0;
  border-top: 2px solid #d85870;
  z-index: 4;
  pointer-events: none;
}
.time-now span {
  position: absolute;
  left: 0;
  top: -10px;
  background: #d85870;
  color: white;
  padding: 2px 5px;
  border-radius: 5px;
  font-size: 10px;
}
.time-completed {
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 14px;
}
.time-completed summary {
  cursor: pointer;
  color: var(--muted);
}
.estimate-editor {
  margin: 12px 0;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 14px;
}
.estimate-editor .work-slider {
  width: 100%;
  margin-top: 8px;
}
.daily-plan {
  margin: 18px 0;
}
.plan-summary {
  font-size: 13px;
  color: var(--muted);
  margin: 10px 0;
}
.daily-list {
  display: grid;
  gap: 10px;
}
.daily-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--surface);
  box-shadow: var(--shadow);
}
.daily-item .check {
  width: 22px;
  height: 22px;
  flex: none;
}
.daily-item-open {
  min-width: 0;
  min-height: 0 !important;
  flex: 1;
  text-align: left;
  border: 0;
  background: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.daily-item-open strong {
  font-size: 16px;
}
.daily-item-open small {
  color: var(--muted);
  font-size: 12px;
}
.daily-later {
  margin-top: 15px;
  padding: 12px;
  border-top: 1px solid var(--line);
}
.daily-later summary {
  cursor: pointer;
  color: var(--accent);
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
}
button,
input,
select {
  font: inherit;
}
button {
  cursor: pointer;
  touch-action: manipulation;
  color: inherit;
}
button:disabled {
  opacity: 0.45;
  cursor: default;
}
button:focus-visible,
input:focus-visible {
  outline: 3px solid #9d8de8;
  outline-offset: 3px;
}
button {
  min-height: 44px;
}
p,
h1,
h2,
h3 {
  margin: 0;
}
h1 {
  font-size: 30px;
  letter-spacing: -1.1px;
  line-height: 1.25;
}
h2 {
  font-size: 18px;
  letter-spacing: -0.35px;
}
h3 {
  font-size: 16px;
}
p {
  line-height: 1.55;
}
.shell {
  max-width: 520px;
  margin: auto;
  min-height: 100dvh;
}
.demo-strip {
  padding: 9px 16px;
  text-align: center;
  font-size: 10px;
  letter-spacing: 0.6px;
  background: var(--soft);
  color: var(--accent);
}
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px 22px 18px;
  padding-top: max(22px, env(safe-area-inset-top));
}
.identity {
  display: flex;
  gap: 10px;
  align-items: center;
}
.avatar {
  position: relative;
  width: 42px;
  height: 42px;
  border-radius: 15px;
  background: #d8d0f3;
  color: #554696;
  font-family: Georgia, serif;
  font-size: 29px;
  text-align: center;
}
.avatar span {
  position: absolute;
  right: -3px;
  top: -5px;
  font: 18px sans-serif;
  color: var(--gold);
}
.eyebrow {
  font-size: 10px;
  letter-spacing: 2px;
  font-weight: 750;
  color: var(--muted);
}
.brand-caption {
  font-size: 12px;
  color: var(--muted);
}
.icon-button {
  border: 1px solid var(--line);
  border-radius: 15px;
  background: var(--surface);
  width: 44px;
  font-size: 21px;
}
main {
  padding: 8px 22px 125px;
  outline: none;
}
.heading {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: end;
  margin: 8px 0 22px;
}
.subtitle {
  margin-top: 8px;
  color: var(--muted);
  font-size: 13px;
}
.date-pill,
.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--surface);
  border: 1px solid var(--line);
  padding: 7px 10px;
  border-radius: 12px;
  font-size: 11px;
  white-space: nowrap;
}
.pill {
  background: var(--soft);
  border: 0;
  color: var(--accent);
}
.hero {
  padding: 24px;
  border-radius: 26px;
  background: linear-gradient(135deg, #eee8fd, #ede8fa);
  border: 1px solid #ded8f0;
  position: relative;
  overflow: hidden;
}
.hero:after {
  content: '✦';
  position: absolute;
  right: 18px;
  top: 0;
  font-size: 100px;
  color: #7660a710;
  pointer-events: none;
}
.hero h2 {
  font-size: 24px;
  line-height: 1.3;
  margin: 13px 0 8px;
  position: relative;
}
.hero .eyebrow {
  color: #6a568f;
}
.hero p {
  color: #5f5d72;
  font-size: 13px;
}
.hero .actions {
  margin-top: 20px;
}
.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.primary,
.secondary,
.danger {
  border: 0;
  border-radius: 14px;
  padding: 12px 18px;
  font-weight: 650;
  font-size: 13px;
}
.primary {
  background: var(--accent);
  color: white;
  box-shadow: 0 5px 16px #7460d52b;
}
.secondary {
  background: var(--surface);
  border: 1px solid var(--line);
}
.danger {
  background: #fbe9eb;
  color: #a1354d;
}
.text-button {
  border: 0;
  background: none;
  color: var(--accent);
  font-size: 12px;
  font-weight: 650;
  padding: 8px 0;
}
.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 24px 0 12px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 21px;
  padding: 18px;
  box-shadow: var(--shadow);
}
.capacity {
  margin: 16px 0;
  display: grid;
  gap: 9px;
}
.capacity-row {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
}
.track {
  height: 6px;
  border-radius: 6px;
  background: var(--line);
  overflow: hidden;
}
.track > span {
  display: block;
  height: 100%;
  background: var(--accent);
  border-radius: inherit;
}
.segment {
  display: flex;
  background: var(--line);
  padding: 4px;
  border-radius: 14px;
  margin: 18px 0 12px;
}
.segment button {
  flex: 1;
  min-height: 36px;
  border: 0;
  background: transparent;
  border-radius: 10px;
  color: var(--muted);
  font-size: 13px;
}
.segment button[aria-pressed='true'] {
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 2px 5px #00000008;
}
.timeline-row {
  display: grid;
  grid-template-columns: 45px 12px 1fr;
  gap: 9px;
  align-items: start;
  padding: 16px 0;
}
.timeline-row + .timeline-row {
  border-top: 1px solid var(--line);
}
.time {
  font-size: 12px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  padding-top: 4px;
}
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  margin-top: 7px;
}
.dot.fixed {
  background: var(--muted);
}
.dot.sleep {
  background: #ad9564;
}
.timeline-row small,
.task-row small,
.reminder-row small {
  display: block;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
  margin-top: 5px;
}
.list-reset {
  list-style: none;
  margin: 0;
  padding: 0;
}
.task-row {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}
.task-row:last-child {
  border: 0;
}
.task-open {
  flex: 1;
  border: 0;
  background: none;
  text-align: left;
  min-width: 0;
  padding: 0;
}
.task-open strong {
  display: block;
  overflow-wrap: anywhere;
}
.code {
  font-size: 11px;
  color: var(--muted);
  margin-right: 5px;
}
.check {
  width: 23px;
  height: 23px;
  min-height: 44px;
  accent-color: var(--accent);
  flex-shrink: 0;
}
.task-row.done strong {
  text-decoration: line-through;
  color: var(--muted);
}
.empty {
  text-align: center;
  padding: 36px 22px;
}
.empty .empty-symbol {
  display: block;
  font-size: 36px;
  color: var(--accent);
  margin-bottom: 15px;
}
.empty p {
  color: var(--muted);
  font-size: 13px;
  margin: 10px 0 18px;
}
.reminder-row {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 18px;
  margin-bottom: 12px;
  display: flex;
  gap: 14px;
  text-align: left;
  align-items: center;
}
.reminder-icon {
  height: 42px;
  width: 42px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  background: var(--soft);
  color: var(--accent);
  font-size: 21px;
  flex-shrink: 0;
}
.reminder-main {
  flex: 1;
  min-width: 0;
}
.reminder-main strong {
  overflow-wrap: anywhere;
}
.chevron {
  color: var(--muted);
}
.off {
  opacity: 0.65;
}
.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 14px;
}
.stat-label {
  font-size: 12px;
  color: var(--muted);
}
.stat-value {
  font-size: 32px;
  font-weight: 750;
  letter-spacing: -1px;
  margin-top: 6px;
}
.stat-value small {
  font-size: 13px;
  color: var(--muted);
  font-weight: 400;
  letter-spacing: 0;
}
.chart {
  display: flex;
  gap: 12px;
  align-items: end;
  height: 130px;
  margin: 20px 0 8px;
}
.chart-col {
  flex: 1;
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: end;
  height: 100%;
  font-size: 11px;
  color: var(--muted);
}
.chart-bar {
  background: #b5a7e9;
  border-radius: 6px 6px 3px 3px;
  min-height: 3px;
  margin: 6px 0 9px;
}
.chart-col:last-child .chart-bar {
  background: var(--accent);
}
.streak {
  display: flex;
  gap: 18px;
  align-items: center;
}
.streak-icon {
  font-size: 30px;
  color: var(--gold);
}
.rank-card {
  border: 1px solid #dfcda7;
  background: linear-gradient(140deg, #fbf5e6, #efe9fa);
  border-radius: 23px;
  padding: 22px;
  text-align: center;
  color: #67532f;
  margin: 15px 0;
}
.rank-seal {
  width: 66px;
  height: 66px;
  margin: 0 auto 14px;
  border: 1px solid #baa274;
  border-radius: 20px;
  display: grid;
  place-items: center;
  font-size: 31px;
  transform: rotate(4deg);
  background: #ffffff55;
}
.rank-card h2 {
  font-family: Georgia, serif;
  font-size: 28px;
  margin: 6px 0;
}
.rank-card p {
  font-size: 12px;
}
.rank-row {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 15px 0;
  border-bottom: 1px solid var(--line);
}
.rank-row:last-child {
  border: 0;
}
.rank-row > div {
  flex: 1;
}
.rank-row small {
  font-size: 12px;
  color: var(--muted);
}
.rank-row .track {
  margin-top: 9px;
}
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 520px;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding: 10px 14px max(12px, env(safe-area-inset-bottom));
  display: flex;
  z-index: 5;
}
.bottom-nav button {
  flex: 1;
  display: grid;
  justify-items: center;
  gap: 5px;
  min-height: 55px;

.effect-spin {
  animation: reward-spin 0.72s ease-in-out both;
  box-shadow:
    0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent),
    0 8px 24px color-mix(in srgb, var(--accent) 24%, transparent);
}
.effect-breakthrough {
  animation: breakthrough-pulse 0.86s ease-in-out both;
  box-shadow:
    0 0 0 4px color-mix(in srgb, var(--gold) 22%, transparent),
    0 8px 28px color-mix(in srgb, var(--gold) 28%, transparent);
}
@keyframes reward-spin {
  0% {
    transform: rotate(0) scale(1);
  }
  25% {
    transform: rotate(-4deg) scale(1.03);
  }
  50% {
    transform: rotate(4deg) scale(1.06);
  }
  75% {
    transform: rotate(-2deg) scale(1.03);
  }
  100% {
    transform: rotate(0) scale(1);
  }
}
@keyframes breakthrough-pulse {
  0% {
    transform: scale(1);
    filter: saturate(1);
  }
  35% {
    transform: scale(1.05);
    filter: saturate(1.35);
  }
  70% {
    transform: scale(0.98);
    filter: saturate(1.1);
  }
  100% {
    transform: scale(1);
    filter: saturate(1);
  }
}

.focus-flip-card {
  display: block;
  width: 100%;
  min-width: 0;
  padding: 0;
  border: 0;
  border-radius: 18px;
  background: transparent;
  text-align: center;
  perspective: 1100px;
  -webkit-tap-highlight-color: transparent;
}
.focus-flip-card:disabled {
  opacity: 1;
  cursor: wait;
}
.focus-flip-inner {
  display: grid;
  transform: rotateY(0);
  transform-style: preserve-3d;
}
.focus-flip-card.is-focused .focus-flip-inner {
  transform: rotateY(180deg);
}
.focus-flip-face {
  grid-area: 1/1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 184px;
  padding: 20px 18px;
  border-radius: 18px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
.focus-flip-back {
  transform: rotateY(180deg);
}
.focus-flip-mark {
  display: block;
  margin-bottom: 9px;
  font-size: 34px;
  line-height: 1.15;
}
.focus-flip-back .focus-flip-mark,
.sleep-card-seal {
  display: grid;

  width: 38px;
  height: 38px;
  border: 1px solid #baa274;

}

}

  line-height: 1.25;

}

}
.focus-flip-task {

}

}

}

}
.work-state {
  display: grid;
  gap: 10px;
  min-width: 0;
}
.focus-session-time {
  display: block;
  margin-top: 5px;
  font-size: 12px;
  font-weight: 600;
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
  color: inherit;
}
.work-state-detail {

}

  line-height: 1.5;
  font-variant-numeric: tabular-nums;
}
.focus-flip-card.focus-activating:not(.is-focused) .focus-flip-inner {
  animation: focus-card-flip-forward 0.52s cubic-bezier(0.45, 0.05, 0.2, 1) both;
}
.focus-flip-card.is-focused.focus-activating .focus-flip-inner {
  animation: focus-card-flip-backward 0.52s cubic-bezier(0.45, 0.05, 0.2, 1) both;
}
.focus-flip-card.focus-reverting:not(.is-focused) .focus-flip-inner {
  animation: focus-card-revert-front 0.36s ease-out both;
}
.focus-flip-card.is-focused.focus-reverting .focus-flip-inner {
  animation: focus-card-revert-back 0.36s ease-out both;
}
@keyframes focus-card-flip-forward {
  from {
    transform: rotateY(0);
  }
  to {
    transform: rotateY(180deg);
  }
}
@keyframes focus-card-flip-backward {
  from {
    transform: rotateY(180deg);
  }
  to {
    transform: rotateY(360deg);
  }
}
@keyframes focus-card-revert-front {
  from {
    transform: rotateY(180deg);
  }
  to {
    transform: rotateY(360deg);
  }
}
@keyframes focus-card-revert-back {
  from {
    transform: rotateY(360deg);
  }
  to {
    transform: rotateY(180deg);
  }
}
@media (prefers-reduced-motion: reduce) {
  .focus-flip-card .focus-flip-inner {
    animation: none !important;
  }
}

  display: flex;
  flex: 1;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}
dialog.schedule-sheet-open .sheet-title-row {
  position: relative;
  z-index: 4;
  flex: 0 0 auto;
  margin-bottom: 10px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
dialog.schedule-sheet-open .sheet-title-row .icon-button {
  position: relative;
  z-index: 5;
  flex: 0 0 auto;
  touch-action: manipulation;
}
dialog.schedule-sheet-open #sheet-feedback {
  flex: 0 0 auto;
}
dialog.schedule-sheet-open .schedule-form {
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  overflow-y: auto;
  padding: 2px 2px 0;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  touch-action: auto;
}
dialog.schedule-sheet-open::backdrop {
  touch-action: none;
  overscroll-behavior: none;
}
dialog.schedule-sheet-open .time-slots,
dialog.schedule-sheet-open .availability-row,
dialog.schedule-sheet-open .form-field,
dialog.schedule-sheet-open input[type='time'] {
  position: relative;
  pointer-events: auto;
}
.schedule-intro {
  margin: 4px 0 18px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
}
.schedule-section-title {
  margin: 20px 0 10px;
  font-size: 16px;
}
.duration-picker {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  margin: 12px 0 4px;
}
.duration-picker select {
  min-width: 0;
  min-height: 48px;
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--bg);
  color: var(--text);
}
.duration-picker .secondary {
  min-width: 92px;
  padding-left: 12px;
  padding-right: 12px;
}
.estimate-list:empty {
  display: none;
}
.estimate-title {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}
.estimate-title strong {
  min-width: 0;
  line-height: 1.4;
  overflow-wrap: anywhere;
}
.estimate-title .text-button {
  flex: 0 0 auto;
}
dialog.schedule-sheet-open .sheet-submit {
  position: sticky;
  bottom: 0;
  z-index: 6;
  margin: 20px -2px 0;
  padding: 12px 2px max(14px, env(safe-area-inset-bottom));
  border-top: 1px solid var(--line);
  background: var(--surface);
}
dialog.schedule-sheet-open .sheet-submit .primary {
  width: 100%;
  min-height: 50px;
}
@media (max-width: 390px) {
  .duration-picker {
    grid-template-columns: 1fr;
  }
  .duration-picker .secondary {
    width: 100%;
  }
}

/* Browser sign-in and the wider desktop workspace. */
[hidden] {
  display: none !important;
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.browser-login {
  max-width: 600px;
  margin: 24px auto;
  display: grid;
  gap: 20px;
}
.browser-login h1 {
  margin-top: 10px;
  font-size: 32px;
  line-height: 1.2;
}
.login-card {
  display: grid;
  gap: 16px;
  padding: 24px;
}
.login-card .subtitle {
  margin: 0;
}
.login-command {
  display: block;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--soft);
  color: var(--text);
  font-size: clamp(13px, 3.6vw, 19px);
  white-space: normal;
  overflow-wrap: anywhere;
  user-select: all;
}
.login-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.login-actions a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  min-height: 44px;
}
.login-status,
.login-error {
  font-size: 12px;
  line-height: 1.6;
  color: var(--muted);
}
.login-error {
  color: var(--text);
  padding: 10px 12px;
  background: var(--soft);
  border-radius: 10px;
}
.login-screen .bottom-nav {
  display: none;
}
.login-screen #settings {
  display: none;
}
.login-screen main {
  padding-bottom: 32px;
}
@media (min-width: 900px) {
  .shell {
    max-width: 1280px;
    padding: 0 24px;
    display: grid;
    grid-template-columns: 210px minmax(0, 1fr);
    column-gap: 24px;
    grid-template-rows: auto auto 1fr;
    align-items: start;
  }
  .demo-strip {
    grid-column: 1/-1;
    border-radius: 0 0 12px 12px;
  }
  .app-header {
    grid-column: 1;
    grid-row: 2;
    padding: 28px 8px 16px;
    flex-wrap: wrap;
    gap: 16px;
    position: static;
    top: auto;
  }
  .header-actions {
    width: 100%;
    justify-content: space-between;
  }
  main {
    grid-column: 2;
    grid-row: 2/4;
    min-width: 0;
    padding: 30px 0 48px;
  }
  .bottom-nav {
    grid-column: 1;
    grid-row: 3;
    position: static;
    top: auto;
    left: auto;
    bottom: auto;
    transform: none;
    width: auto;
    max-width: none;
    padding: 8px 0;
    background: transparent;
    border: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .bottom-nav button {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 12px;
    padding: 12px 16px;
    min-height: 50px;
    border-radius: 14px;
    font-size: 14px;
    text-align: left;
  }
  .bottom-nav button span {
    width: 24px;
    text-align: center;
  }
  .bottom-nav button[aria-current='page'] {
    background: var(--soft);
  }
  .bottom-nav button:hover {
    background: var(--surface);
  }
  .today-page {
    display: grid;
    grid-template-columns: 260px minmax(0, 1fr);
    grid-template-areas: 'heading heading' 'rest rest' 'focus main';
    gap: 16px 22px;
    align-items: start;
  }
  .today-page > .heading {
    grid-area: heading;
    margin-bottom: 4px;
  }
  .today-page > .rest-state {
    grid-area: rest;
  }
  .today-page > .work-state {
    grid-area: focus;
    position: sticky;
    top: 24px;
  }
  .today-page > .today-main {
    grid-area: main;
  }
  .today-page .plan-overview {
    grid-template-columns: 1fr;
  }
  .today-page .plan-actions {
    max-width: none;
  }
  .today-page .focus-flip-face {
    min-height: 240px;
    padding: 24px 18px;
  }
  .today-page .focus-flip-title {
    font-size: 23px;
  }
  .today-page .sleep-card {
    min-height: 240px;
    padding: 24px 18px;
  }
  .task-list-section {
    max-width: none;
  }
  dialog,
  dialog.task-sheet-open,
  dialog.schedule-sheet-open,
  dialog.settings-sheet-open {
    inset: 0;
    margin: auto;
    width: min(640px, calc(100vw - 64px));
    max-width: 640px;
    max-height: 86dvh;
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 24px;
    box-shadow: 0 24px 80px #1a122c26;
  }
  dialog:not(.task-sheet-open):not(.schedule-sheet-open):not(.reward-sheet-open):not(
      .settings-sheet-open
    ):not(.draw-sheet-open) {
    height: fit-content;
  }
  dialog .sheet-handle {
    display: none;
  }
  dialog.task-sheet-open .task-sheet-body {
    padding-bottom: 12px;
  }
  dialog.task-sheet-open .task-actions,
  dialog.schedule-sheet-open .sheet-submit {
    padding-bottom: 0;
  }
  #toast {
    bottom: 28px;
  }
  .login-screen .shell {
    display: block;
    max-width: 840px;
  }
  .login-screen .app-header {
    position: static;
    width: 100%;
    padding: 28px 0;
    flex-wrap: nowrap;
  }
  .login-screen .header-actions {
    width: auto;
  }
  .login-screen main {
    padding: 8px 0 48px;
  }
  .browser-login {
    margin: 28px auto 48px;
  }
  .browser-login h1 {
    font-size: 40px;
  }
}

/* Reward calendar: readable future gifts, distinct milestones, one claim action. */
:root {
  --muted: #6f6a82;
}
:root[data-theme='dark'] {
  --muted: #b1acc1;
}
select:focus-visible,
textarea:focus-visible,
summary:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 3px;
}
.achievements-page {
  display: flex;
  flex-direction: column;
  gap: 24px;
  min-width: 0;
}
.achievements-page > *,
.achievement-overview > *,
.cultivation-section > * {
  min-width: 0;
}
.achievements-page .checkin-card {
  padding: 22px;
  border-radius: 22px;
  border-color: color-mix(in srgb, var(--accent) 22%, var(--line));
  background: var(--surface);
}
.checkin-heading {
  display: flex;
  justify-content: space-between;
  gap: 18px;
  align-items: center;
}
.checkin-heading h2 {
  font-size: 25px;
  margin-top: 7px;
  letter-spacing: -0.7px;
}
.checkin-heading .subtitle {
  margin-top: 5px;
  font-size: 12px;
}
.checkin-count {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  flex-shrink: 0;
  color: var(--muted);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}
.checkin-count strong {
  color: var(--accent);
  font-size: 42px;
  line-height: 1;
  letter-spacing: -1.5px;
}
.checkin-count span {
  margin-top: 5px;
}
.checkin-card > .checkin-track {
  height: 7px;
  margin: 18px 0 9px;
}
.checkin-track > span {
  background: linear-gradient(
    90deg,
    var(--accent),
    color-mix(in srgb, var(--accent) 65%, var(--gold))
  );
}
.checkin-meta {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 5px 16px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
}
.checkin-preview {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 20px 0 24px;
}
.checkin-current,
.checkin-upcoming {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 9px;
  padding: 16px;
  border-radius: 15px;
}
.checkin-current {
  background: color-mix(in srgb, var(--accent) 7%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--line));
}
.checkin-current .eyebrow {
  color: var(--accent);
}
.checkin-upcoming {
  background: var(--bg);
  border: 1px solid var(--line);
}
.checkin-preview h3 {
  font-size: 17px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
.checkin-upcoming .hint {
  margin: 0;
  line-height: 1.5;
}
.checkin-claim {
  align-self: flex-start;
  min-height: 44px;
  margin-top: auto;
  padding: 10px 16px;
  box-shadow: none;
}
.checkin-claim:disabled {
  opacity: 1;
  background: transparent;
  color: var(--status);
  padding-left: 0;
  padding-right: 0;
  box-shadow: none;
}
.reward-calendar-heading {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: baseline;
  gap: 5px 12px;
  margin-bottom: 12px;
}
.reward-calendar-heading h3 {
  font-size: 15px;
}
.reward-calendar-heading .hint {
  margin: 0;
  font-size: 11px;
}
.reward-calendar {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px;
}
.reward-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  min-width: 0;
  min-height: 128px;
  padding: 10px 7px 8px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--surface);
  color: var(--text);
  text-align: center;
  transition:
    border-color 0.15s,
    background-color 0.15s;
}
.reward-cell-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.3;
  white-space: nowrap;
}
.reward-cell-top > span:last-child {
  color: var(--status);
}
.reward-cell-icon {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 11px;
  background: var(--soft);
  color: var(--accent);
  font-size: 24px;
  line-height: 1;
}
.reward-cell-label {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 32px;
  font-size: 12px;
  font-weight: 650;
  line-height: 1.4;
  overflow-wrap: anywhere;
}
.reward-cell-label small {
  font-size: 10px;
  font-weight: 500;
  margin-top: 3px;
  line-height: 1.4;
}
.reward-cell-status {
  margin-top: auto;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.4;
}
.reward-cell.is-received {
  background: color-mix(in srgb, var(--status) 4%, var(--surface));
  border-color: color-mix(in srgb, var(--status) 20%, var(--line));
}
.reward-cell.is-received .reward-cell-status {
  color: var(--status);
}
.reward-cell.is-milestone {
  background: color-mix(in srgb, var(--gold) 6%, var(--surface));
  border-color: color-mix(in srgb, var(--gold) 35%, var(--line));
}
.reward-cell.is-milestone .reward-cell-icon {
  background: color-mix(in srgb, var(--gold) 13%, var(--surface));
  color: var(--gold);
}
.reward-cell.is-milestone .reward-cell-top > span:last-child {
  color: var(--gold);
}
.reward-cell.is-grand {
  background: linear-gradient(
    145deg,
    color-mix(in srgb, var(--gold) 12%, var(--surface)),
    color-mix(in srgb, var(--accent) 8%, var(--surface))
  );
}
.reward-cell.is-today {
  border: 2px solid var(--accent);
  padding: 9px 6px 7px;
  background: color-mix(in srgb, var(--accent) 6%, var(--surface));
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 10%, transparent);
}
.reward-cell.is-today .reward-cell-status {
  color: var(--accent);
  font-weight: 750;
}
.reward-cell:hover {
  border-color: var(--accent);
  background: var(--soft);
}
.checkin-grand {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-top: 16px;
  padding: 13px 14px;
  border: 1px solid color-mix(in srgb, var(--gold) 30%, var(--line));
  border-radius: 13px;
  background: color-mix(in srgb, var(--gold) 5%, var(--surface));
  color: var(--text);
  font-size: 12px;
  font-weight: 650;
}
.checkin-grand-mark {
  flex-shrink: 0;
  color: var(--gold);
  font-size: 25px;
}
.checkin-footnote {
  margin-top: 12px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.7;
}
.checkin-notice {
  margin-top: 12px;
  padding: 10px 12px;
  border-radius: 10px;
  background: var(--soft);
  color: var(--text);
  font-size: 12px;
  line-height: 1.6;
}
.daily-reward-detail {
  padding: 24px 20px;
  margin: 8px 0 18px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--soft);
  color: var(--text);
  font-size: 20px;
  font-weight: 650;
  text-align: center;
  line-height: 1.6;
}
.daily-reward-detail.is-milestone {
  background: color-mix(in srgb, var(--gold) 8%, var(--surface));
  border-color: color-mix(in srgb, var(--gold) 35%, var(--line));
}
.achievement-overview,
.achievement-insights,
.cultivation-section,
.cultivation-summary,
.achievement-details {
  display: grid;
  gap: 16px;
}
.achievement-insights .achievement-metrics,
.cultivation-balances,
.cultivation-summary .reward-tools {
  margin: 0;
}
.achievement-overview .flame-card {
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.achievement-overview .flame-mark {
  margin: 6px 0 8px;
  line-height: 1.15;
}
.achievement-overview .flame-count {
  line-height: 1.2;
}
.achievement-overview .flame-name {
  margin-top: 6px;
  line-height: 1.3;
}
.achievement-overview .flame-best {
  margin-top: 4px;
  line-height: 1.5;
}
.achievement-bedtime {
  margin-top: 4px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
}
.achievement-chart > .hint {
  margin: 12px 0 0;
}
.achievement-chart .chart {
  margin-top: 8px;
  height: 100px;
}
.cultivation-section .breakthrough-card {
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.cultivation-section .breakthrough-card > .primary {
  width: 100%;
  margin-top: 4px;
}
.rank-summary {
  display: grid;
  gap: 8px;
  min-width: 0;
}
.rank-summary > .protection {
  margin: 0;
  padding: 0 4px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
.cultivation-summary .rank-card {
  padding: 18px;
}
.cultivation-summary .rank-seal {
  width: 48px;
  height: 48px;
  margin-bottom: 10px;
  font-size: 26px;
}
.cultivation-balances > .card {
  padding: 14px 16px;
}
.cultivation-balances .stat-value {
  font-size: 28px;
}
.achievement-details {
  align-items: start;
}
.achievement-details .realm-path {
  padding: 10px 16px;
}
.achievement-details summary {
  font-size: 13px;
}
.achievement-details .hint {
  line-height: 1.65;
}

/* Desktop lists and sheets keep compact actions and a consistent content edge. */
.today-page > .heading {
  flex-wrap: wrap;
  align-items: center;
}
.daily-reward-entry {
  flex-shrink: 0;
  padding: 9px 13px;
  color: var(--accent);
  font-size: 12px;
  box-shadow: none;
}
.task-time-editor {
  margin: 16px 0;
}
.task-time-editor .remaining-editor,
.task-time-editor .work-progress {
  margin: 0;
  border-radius: 14px;
  background: var(--bg);
  border-color: var(--line);
}
.task-time-modes {
  margin: 0 0 10px;
}
.task-time-modes button {
  min-height: 42px;
}
.task-extras {
  padding: 0 0 10px;
  margin: 16px 0;
  border-bottom: 1px solid var(--line);
}
.task-extras summary {
  min-height: 44px;
  display: list-item;
  padding: 12px 0;
  cursor: pointer;
  font-size: 13px;
  color: var(--muted);
  font-weight: 650;
}
.task-extras .form-field textarea {
  min-height: 82px;
}
.task-extra-meta {
  display: inline-block;
  margin-left: 10px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 400;
}
.task-step-row.done > span {
  color: var(--muted);
  text-decoration: line-through;
}
.task-sheet-body form > h3 {
  margin: 18px 0 4px;
}
dialog.task-sheet-open .task-actions {
  grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
}
dialog.task-sheet-open .task-actions > .task-plan-action {
  min-height: 38px;
  font-size: 12px;
  padding: 6px 10px;
}
.reminders-page {
  display: flex;
  flex-direction: column;
  gap: 18px;
  min-width: 0;
}
.reminders-page > .heading {
  margin: 0;
  align-items: center;
  flex-wrap: wrap;
}
.reminders-page .top-create {
  width: auto;
  margin: 0;
  flex-shrink: 0;
  min-height: 44px;
  padding: 10px 16px;
  box-shadow: none;
}
.reminder-filters {
  width: 100%;
  max-width: 330px;
  margin: 0;
}
.reminder-filters button.secondary {
  min-height: 42px;
  min-width: 0;
  white-space: normal;
  overflow-wrap: anywhere;
}
.reminder-list {
  display: grid;
  gap: 12px;
  min-width: 0;
  align-items: start;
}
.reminder-list .reminder-row {
  margin: 0;
  border-radius: 16px;
  min-height: 112px;
  padding: 16px;
  gap: 12px;
}
.reminder-main strong {
  font-size: 15px;
  line-height: 1.5;
}
.reminder-main small {
  font-size: 11px;
}
.reminder-badge {
  flex-shrink: 0;
  align-self: flex-start;
  padding: 5px 8px;
  border-radius: 8px;
  background: var(--bg);
  color: var(--muted);
  font-size: 10px;
  font-weight: 650;
  white-space: nowrap;
}
.reminder-badge.is-enabled {
  background: color-mix(in srgb, var(--status) 8%, var(--surface));
  color: var(--status);
}
.reminders-page > .footer-note,
.reminders-page > .hint {
  margin: 0;
}
.reminder-row.off {
  opacity: 1;
  background: var(--bg);

  }
  .app-ready main {

  .app-ready #content > section > .heading {

  }
  .app-ready #content > section > .heading h1 {

    align-items: center;

  }
  .app-ready #content > section > .heading .achievement-bedtime {

  }
  .app-ready #content > :is(.today-page, .reminders-page, .achievements-page) > .heading {
    margin-bottom: 8px;

  .app-ready #content > section > .heading > :is(button, .primary) {
    grid-column: 2;
    grid-row: 2;
    min-height: 44px;
    margin: 0;
    padding: 10px 12px;

  }
  .app-ready #content .segment button,
  .app-ready #content .beast-tab {
    position: relative;

    line-height: 1.4;

    border-radius: 0;

  .app-ready #content .segment button::after,
  .app-ready #content .beast-tab::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 50%;
    width: calc(100% - 24px);
    max-width: 112px;
    height: 3px;
    border-radius: 3px;
    transform: translateX(-50%) scaleX(0.8);
    background: var(--accent);
    opacity: 0;
    transition:
      opacity 0.18s ease,
      transform 0.18s ease;
  }
  .app-ready #content .segment button[aria-pressed='true'],
  .app-ready #content .beast-tab[aria-current='page'] {
    color: var(--text);
    font-weight: 650;
  }
  .app-ready #content .segment button[aria-pressed='true']::after,
  .app-ready #content .beast-tab[aria-current='page']::after {
    opacity: 1;
    transform: translateX(-50%) scaleX(1);
  }
  @media (prefers-reduced-motion: reduce) {
    .app-ready #content .segment button::after,
    .app-ready #content .beast-tab::after {
      transition: none;
    }
  }
  .bottom-nav {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    padding: 8px max(8px, env(safe-area-inset-right), var(--app-host-safe-right, 0px))

  .bottom-nav button {

    padding: 2px;
    gap: 4px;
    font-size: 11px;
    line-height: 1.4;
    font-weight: 600;
  }
  .bottom-nav button > .nav-label {
    max-width: 100%;
    white-space: normal;
    overflow-wrap: normal;
  }
}

  align-items: flex-start;
  padding: 18px 19px 0;
  gap: 10px;
}
.beast-summon-head h2 {
  font-size: 20px;
  line-height: 1.3;
  letter-spacing: -0.55px;
  font-weight: 700;
  margin: 0;
}
.beast-summon-head p {
  font-size: 11px;
  color: var(--muted);
  margin: 5px 0 0;
}
.beast-summon-rates {
  flex-shrink: 0;
  display: flex;
  gap: 6px;
  align-items: center;
  min-height: 44px;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 11px;
  padding: 0 0 0 7px;
}
.beast-summon-rates span {
  display: grid;
  place-items: center;
  font-size: 9px;
  width: 14px;
  height: 14px;
  border: 1px solid #c5b7d0;
  border-radius: 50%;
}
.beast-summon-banner {
  display: flex;
  justify-content: center;
  align-items: center;
  height: clamp(220px, calc(var(--app-viewport-height, 100svh) * 0.36), 360px);
  overflow: hidden;
}
.beast-summon-banner img {
  display: block;
  height: 90%;
  width: auto;
  max-width: 100%;
  object-fit: contain;
  filter: saturate(0.8) contrast(0.94);
}
.beast-wallet {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin: 0 19px 7px;
  min-height: 40px;
}
.beast-summon-balance {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: var(--muted);
}
.beast-wallet strong {
  color: var(--accent);
  font-size: 18px;
  font-weight: 700;
  margin-left: 1px;
}
.beast-summon-actions .beast-ticket-icon {
  width: 14px;
  height: 14px;
  color: inherit;
}
.beast-ticket-icon {
  display: inline-flex;
  width: 17px;
  height: 17px;
  color: var(--accent);
}
.beast-summon-exchange {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 44px;
  border: 0;
  background: transparent;
  color: var(--accent);
  font-size: 12px;
  padding: 0;
}
.beast-summon-exchange span {
  display: grid;
  place-items: center;
  width: 21px;
  height: 21px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: color-mix(in srgb, var(--accent) 4%, var(--surface));
  font-size: 16px;
  line-height: 1;
}
.beast-summon-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 0 18px;
  margin: 0;
}
.beast-summon-actions button {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  min-width: 0;
  min-height: 56px;
  padding: 10px 8px;
  font-size: 13px;
  line-height: 1.2;
  font-weight: 700;
  border-radius: 13px;
  border: 1px solid #ded2f3;
  box-shadow: none;
}
.beast-summon-actions .secondary {
  background: color-mix(in srgb, var(--accent) 4%, var(--surface));
  color: var(--accent);
}
.beast-summon-actions .primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.beast-summon-actions small {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  font-weight: 500;
  opacity: 0.8;
  color: inherit;
}
.beast-summon-actions button:disabled {
  opacity: 0.5;
  cursor: default;
}
.beast-pity {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px;
  margin: 15px 19px 0;
  padding: 13px 0 15px;
  border-top: 1px solid var(--line);
}
.beast-summon-meter {
  min-width: 0;
}
.beast-summon-meter-label {
  display: flex;
  justify-content: space-between;
  gap: 4px;
  font-size: 10px;
  line-height: 1.4;
  color: var(--muted);
  margin-bottom: 6px;
}
.beast-summon-meter-label strong {
  color: #b5813c;
  font-size: 10px;
}
.beast-summon-meter:last-child strong {
  color: #d2627e;
}
.beast-summon-meter progress {
  display: block;
  width: 100%;
  height: 3px;
  border: 0;
  border-radius: 3px;
  appearance: none;
  background: #f0ebf7;
  color: #d6ae72;
}
.beast-summon-meter progress::-webkit-progress-bar {
  background: #f0ebf7;
  border-radius: 3px;
}
.beast-summon-meter progress::-webkit-progress-value {
  background: #d6ae72;
  border-radius: 3px;
}
.beast-summon-meter progress::-moz-progress-bar {
  background: #d6ae72;
  border-radius: 3px;
}
.beast-summon-meter:last-child progress {
  color: #de95aa;
}
.beast-summon-meter:last-child progress::-webkit-progress-value {
  background: #de95aa;
}
.beast-summon-meter:last-child progress::-moz-progress-bar {
  background: #de95aa;
}
.beast-summon-pool-link {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
  min-height: 44px;
  padding: 0 19px;
  text-align: left;
  font-size: 11px;
  border: 0;
  background: transparent;
  color: var(--muted);
}
.beast-summon-pool-link span {
  font-size: 17px;
}
.beast-summon-footer {
  display: flex;
  align-items: center;
  border-top: 1px solid var(--line);
  background: color-mix(in srgb, var(--accent) 2%, var(--surface));
  padding-right: 16px;
  gap: 12px;
}
.beast-summon-footer .beast-summon-pool-link {
  flex: 1;
  min-width: 0;
  padding-top: 10px;
  padding-bottom: 10px;
}
.beast-summon-empty {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 0 6px;
  padding: 8px 16px 0;
  font-size: 12px;
  color: var(--muted);
}
.beast-summon-empty .text-button {
  color: var(--accent);
  font-size: 12px;
  padding: 8px 2px;
}
.beast-page--summon > .text-button {
  display: block;
  margin-top: 10px;
  min-height: 44px;
  font-size: 11px;
}
.beast-summon-pool {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 9px;
  margin-top: 18px;
}
.beast-pool-card {
  min-width: 0;
  padding: 10px 9px;
  border: 1px solid color-mix(in srgb, var(--rank-color) 40%, var(--line));
  border-radius: 11px;
  background: var(--surface);
}
.beast-pool-card small {
  color: var(--rank-color);
  font-weight: 700;
  font-size: 10px;
}
.beast-pool-card img {
  display: block;
  width: 100%;
  height: 75px;
  object-fit: contain;
  margin: 6px 0 3px;
}
.beast-pool-card strong {
  display: block;
  font-size: 11px;
  font-weight: 600;
  overflow-wrap: anywhere;
}
@media (min-width: 900px) {
  .beast-summon-panel {
    max-width: 960px;
    margin: auto;
    display: grid;
    grid-template-columns: 1fr 0.95fr;
    grid-template-areas: 'art wallet' 'art actions' 'art empty' 'art pity' 'foot foot';
    column-gap: 34px;
    padding: 0 26px;
  }
  .beast-summon-head {
    grid-area: head;
    padding: 26px 0 0;
  }
  .beast-summon-head h2 {
    font-size: 25px;
  }
  .beast-summon-head p {
    font-size: 12px;
  }
  .beast-summon-banner {
    grid-area: art;
    height: 360px;
  }
  .beast-wallet {
    grid-area: wallet;
    margin: 26px 0 0;
    align-self: end;
  }
  .beast-summon-actions {
    grid-area: actions;
    padding: 0;
    align-self: center;
    margin-top: 12px;
  }
  .beast-summon-actions button {
    min-height: 64px;
    font-size: 14px;
  }
  .beast-pity {
    grid-area: pity;
    margin: 18px 0 30px;
    padding: 20px 0 0;
    align-self: start;
  }
  .beast-summon-meter-label,
  .beast-summon-meter-label strong {
    font-size: 11px;
  }
  .beast-summon-footer {
    grid-area: foot;
    padding-right: 0;
  }
  .beast-summon-empty {
    grid-area: empty;
  }
  .beast-summon-pool-link {
    padding: 0;
    min-height: 49px;
    background: none;
    font-size: 12px;
  }
}
@media (max-width: 380px) {
  .beast-summon-head {
    padding: 16px 17px 0;
  }
  .beast-wallet {
    margin: 0 17px 7px;
  }
  .beast-summon-balance {
    font-size: 11px;
  }
  .beast-summon-actions {
    padding: 0 16px;
    gap: 9px;
  }
  .beast-summon-actions button {
    min-height: 54px;
    font-size: 12px;
  }
  .beast-pity {
    margin: 13px 17px 0;
    gap: 16px;
    padding: 12px 0 14px;
  }
  .beast-summon-pool-link {
    padding: 0 17px;
  }
}
/* Art keeps a useful size; a short viewport scrolls instead of shrinking the card. */
@media (max-width: 899px) {
  .beast-page > .heading h1 {
    font-size: var(--page-title-size);
    letter-spacing: -0.6px;
  }
  .beast-page .beast-alchemy-entry {
    min-height: 44px;
    font-size: 12px;
    border: 0;
    padding: 10px 0;
    background: transparent;
    border-radius: 0;
    color: var(--muted);
  }
  .beast-page .beast-tabs {
    margin: 0 0 16px;
    padding: 0;
    gap: 4px;
    background: transparent;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    max-width: 100%;
  }
  .beast-page .beast-tab {
    min-height: 48px;
    font-size: var(--tab-label-size);
    font-weight: 600;
    line-height: 1.4;
    white-space: normal;
    overflow-wrap: anywhere;
  }
  .beast-wallet {
    margin: 12px 20px 0;
    min-height: 44px;
    flex-wrap: wrap;
    gap: 4px 12px;
  }
  .beast-summon-balance,
  .beast-summon-exchange {
    flex-shrink: 0;
  }
  .beast-summon-banner {
    margin: 4px 0 12px;
  }
  .beast-wallet strong {
    font-size: 22px;
    color: var(--text);
    font-weight: 650;
  }
  .beast-summon-balance,
  .beast-summon-exchange {
    font-size: 13px;
  }
  .beast-summon-actions button {
    min-height: 56px;
    font-size: 14px;
    font-weight: 650;
    padding: 10px;
  }
  .beast-pity {
    margin: 4px 20px 0;
    padding: 20px 0;
    border-top: 0;
    gap: 20px;
  }
  .beast-summon-meter-label,
  .beast-summon-meter-label strong {
    font-size: 12px;
  }
  .beast-summon-meter-label {
    flex-wrap: wrap;
  }
  .beast-summon-pool-link,
  .beast-summon-rates {
    font-size: 12px;
    min-height: 44px;
  }
  .beast-summon-footer {
    background: transparent;
  }
}
.beast-picker {
  display: grid;
  gap: 9px;
  margin: 20px 0;
}
.beast-picker-item {
  display: flex;
  align-items: center;
  gap: 14px;
  text-align: left;
  padding: 6px 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 15px;
  color: var(--text);
  font-size: 13px;
  min-height: 76px;
}
.beast-picker-item img {
  width: 66px;
  height: 66px;
  flex-shrink: 0;
  object-fit: contain;
}
.beast-picker-item[aria-pressed='true'] {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 6%, var(--surface));
}
.beast-picker-cancel {
  min-height: 44px;
  margin-top: 8px;
}
.beast-picker-copy {
  display: grid;
  gap: 4px;
  min-width: 0;
  padding: 8px 0;
  overflow-wrap: anywhere;
}
.beast-picker-copy small {
  font-size: 11px;
  line-height: 1.5;
  color: var(--muted);
}
.beast-picker-copy .beast-picker-role {
  color: var(--accent);
}
.beast-detail-image {
  display: block;
  margin: 4px auto;
  width: min(100%, 290px);
  height: auto;
  aspect-ratio: 1;
  object-fit: contain;
}
.beast-evolutions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 15px 0;
}
.beast-evolutions button {
  font-size: 10px;
  padding: 10px 5px;
}
.beast-cost {
  font-size: 18px;
  font-weight: 700;
  margin: 24px 0;
}
.beast-furnace {
  text-align: center;
  margin: 18px auto;
  font-size: 95px;
  line-height: 1.4;
  color: var(--accent);
  filter: drop-shadow(0 6px 20px #8f7bd14a);
}
.beast-alchemy-count {
  font-size: 17px;
  font-weight: 700;
  text-align: center;
}
.beast-sheet-open #sheet-content > .hint {
  margin: 12px 0;
}
.beast-alchemy-overview {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 8px 0 16px;
}
.beast-alchemy-overview > div:last-child {
  min-width: 0;
}
.beast-alchemy-overview h3 {
  font-size: 18px;
  margin: 6px 0;
}
.beast-alchemy-overview .beast-furnace {
  width: 100px;
  flex: 0 0 100px;
  margin: 0;
}
.beast-alchemy-overview .beast-alchemy-count {
  text-align: left;
  font-size: 14px;
  color: var(--muted);
}
.beast-alchemy-progress {
  display: block;
  width: 100%;
  height: 8px;
  accent-color: var(--accent);
  border: 0;
  border-radius: 8px;
  overflow: hidden;
  background: var(--line);
}
.beast-alchemy-progress::-webkit-progress-bar {
  background: var(--line);
}
.beast-alchemy-progress::-webkit-progress-value {
  background: var(--accent);
  border-radius: 8px;
}
.beast-alchemy-progress::-moz-progress-bar {
  background: var(--accent);
}
.beast-alchemy-chance {
  font-size: 12px;
  color: var(--muted);
  margin: 12px 0 16px;
}
.beast-alchemy-chance.is-guaranteed {
  color: var(--accent);
  font-weight: 650;
}
.beast-alchemy-craft,
.beast-alchemy-stock > button,
.beast-tower-claim,
.beast-tower-continue {
  width: 100%;
}
.beast-alchemy-stock {
  display: grid;
  gap: 10px;
  padding: 20px 0;
  margin-top: 20px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.beast-alchemy-stock h3 {
  font-size: 15px;
}
.beast-alchemy-rules {
  margin-top: 12px;
}
.beast-alchemy-rules summary {
  display: list-item;
  cursor: pointer;
  color: var(--muted);
  padding: 12px 0;
  min-height: 44px;
  font-size: 12px;
}
.beast-alchemy-rules .hint {
  margin: 0 0 12px;
  line-height: 1.7;
}
.beast-elixir-picker {
  display: grid;
  gap: 8px;
  margin: 16px 0;
}
.beast-empty-note {
  padding: 20px 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
}
.beast-alchemy-result {
  display: grid;
  gap: 16px;
  text-align: center;
}
.beast-alchemy-result .beast-furnace {
  width: 150px;
  margin: 0 auto;
}
.beast-alchemy-result .hint {
  line-height: 1.6;
}
.beast-tower-requirements {
  list-style: none;
  padding: 0;
  margin: 16px 0;
  display: grid;
  gap: 12px;
  font-size: 13px;
  color: var(--muted);
}
.beast-tower-requirements [data-met='true'] {
  color: var(--accent);
}
.beast-tower-step.is-current {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}
.beast-tower-claim,
.beast-tower-continue {
  margin-top: 12px;
}
.beast-furnace {
  width: 230px;
  max-width: 80%;
  font-size: initial;
}
.beast-furnace svg {
  width: 100%;
  display: block;
}
.beast-furnace-core {
  animation: beast-core-pulse 3s ease-in-out infinite;
}
.beast-furnace-vapor {
  animation: beast-vapor 4s ease-in-out infinite;
}
.beast-furnace[data-mode='failed'] .beast-furnace-vapor {
  opacity: 0.18;
  animation: none;
}
.beast-elixir-pearl {
  filter: drop-shadow(0 0 12px #e6c48d);
  animation: beast-reveal-in 0.7s both;
}
.beast-target-picker {
  display: grid;
  gap: 8px;
  margin: 18px 0;
}
.beast-target-option {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 48px;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  font-size: 13px;
}
.beast-target-option input {
  accent-color: var(--accent);
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}
.beast-reward-choice {
  padding: 20px;
  margin: 16px 0;
}
.beast-reward-choice h2 {
  font-size: 16px;
}
.beast-reward-choice button {
  margin: 8px 8px 0 0;
  min-height: 44px;
}
@keyframes beast-vapor {
  0%,
  100% {
    opacity: 0.35;
    transform: translateY(3px);
  }
  50% {
    opacity: 0.85;
    transform: translateY(-4px);
  }
}
@keyframes beast-core-pulse {
  50% {
    opacity: 0.5;
  }
}
.beast-tower-entry {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 19px;
  margin: 20px 0;
  border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--line));
  background: linear-gradient(
    125deg,
    color-mix(in srgb, var(--accent) 6%, var(--surface)),
    var(--surface)
  );
}
.beast-tower-entry h3 {
  font-size: 16px;
  margin: 8px 0;
}
.beast-tower-entry .beast-eyebrow {
  margin: 0;
}
.beast-tower-entry .hint {
  font-size: 11px;
  margin: 0;
  line-height: 1.7;
}
.beast-tower-entry button {
  font-size: 11px;
  white-space: nowrap;
  padding: 12px;
  flex-shrink: 0;
}
.beast-tower-track {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 5px;
  margin: 23px 0;
}
.beast-tower-step {
  text-align: center;
  padding: 12px 3px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
}
.beast-tower-step strong,
.beast-tower-step small {
  display: block;
  font-size: 10px;
}
.beast-tower-step small {
  font-size: 9px;
  color: var(--muted);
  margin-top: 7px;
  line-height: 1.6;
}
.beast-tower-step.is-cleared {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 7%, var(--surface));
}
.beast-tower-risk {
  font-size: 14px;
  font-weight: 650;
  color: var(--accent);
  margin: 18px 0;
}
.beast-tower-cards {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 9px;
  margin: 25px 0;
}
.beast-tower-card {
  height: 125px;
  min-width: 0;
  border: 1px solid #c1b3ee85;
  border-radius: 14px;
  background:
    radial-gradient(ellipse, #b3a3e22b, transparent 65%), linear-gradient(155deg, #44385f, #252136);
  color: #d8c5ff;
  font-size: 27px;
  box-shadow:
    inset 0 0 0 5px #ffffff08,
    0 6px 15px #211c3914;
  transition: transform 0.2s;
}
.beast-tower-card:hover {
  transform: translateY(-4px);
}

/* Approved v12 reveal; all component styling stays inside this dialog. */
html:has(dialog.beast-reveal[open]) {
  overflow: hidden;
  scrollbar-gutter: auto;
}
dialog.beast-reveal {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 16px;
  line-height: normal;
  font-synthesis: none;
  --accent: #7460d5;
  --line: #e4deed;
}
.beast-reveal * {
  box-sizing: border-box;
}
.beast-reveal [hidden] {
  display: none !important;
}
.beast-reveal button {
  font: inherit;
  cursor: pointer;
  touch-action: manipulation;
  box-shadow: none;
}
.beast-reveal button:disabled {
  opacity: 0.45;
  cursor: wait;
}
.beast-reveal button:focus-visible {
  outline: 3px solid #aa91e2;
  outline-offset: 3px;
}
.beast-reveal p,
.beast-reveal h2 {
  margin: 0;
}
.beast-reveal p {
  line-height: normal;
}
.beast-reveal .top-actions [data-reveal='close'] {

  min-width: 40px;
  font-weight: 300;
}
.beast-reveal .eyebrow {
  font-size: 9px;
  font-weight: 650;
  letter-spacing: 1.9px;
  line-height: 1.6;
  color: #83758f;
}
dialog.beast-reveal {
  position: fixed;
  max-width: none;
  max-height: none;
  inset: auto;
  margin: 0;
  padding: 0;
  border: 0;
  overflow: clip;
  color: var(--title-color);
  background: #f6f3fa;
  --hero-size: 300px;
  --card-width: 300px;
  --card-height: 420px;
  --art-top: 18px;
  --hero-y: 40%;
  --visual-y: var(--hero-y);
  --scene-label: #80728d;
  --title-color: #f7f4fc;
  --detail-color: #a8acc1;
  --rank: #b63d53;
}
.beast-reveal::backdrop {
  background: #33283e29;
}
.beast-reveal canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
.beast-reveal .cinematic {
  position: absolute;
  inset: -5px;
  pointer-events: none;
  transform-origin: 50% var(--visual-y);
  will-change: transform;
}
.beast-reveal .cinematic canvas {
  inset: 5px;
  width: calc(100% - 10px);
  height: calc(100% - 10px);
}
.beast-reveal .cinematic > .seal-stage,
.beast-reveal .cinematic > .portrait {
  margin-top: 5px;
}
.beast-reveal .reveal-top {
  position: absolute;
  top: max(20px, env(safe-area-inset-top));
  left: 24px;
  right: 16px;

  justify-content: space-between;
  align-items: center;
  gap: 12px;
  z-index: 7;
}
.beast-reveal .reveal-top > div:first-child {
  opacity: var(--opening-labels, 0);
}
.beast-reveal.is-summary .reveal-top > div:first-child {
  opacity: 1;
}
.beast-reveal .reveal-top p {
  font-size: 12px;
  color: var(--scene-label);
  letter-spacing: 0.5px;
  font-variant-numeric: tabular-nums;
}
.beast-reveal .top-actions {
  display: flex;
  align-items: center;
  gap: 5px;
}
.beast-reveal .top-actions button {
  background: transparent;
  color: var(--scene-label);
  border: 0;
  min-height: 44px;
  font-size: 12px;
  padding: 8px 10px;
}
.beast-reveal [data-reveal='close'] {
  font-size: 25px;
  min-width: 40px;
  font-weight: 300;
}
.beast-reveal .seal-stage {
  position: absolute;
  left: 50%;
  top: var(--visual-y);
  width: var(--card-width);
  height: var(--card-height);
  transform: translate(-50%, -50%);
  perspective: 1100px;
  will-change: transform, opacity;
  pointer-events: none;
  z-index: 2;
}
.beast-reveal .seal {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  will-change: transform;
}
.beast-reveal .seal-back,
.beast-reveal .seal-front {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
.beast-reveal .seal-back > img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  filter: drop-shadow(0 0 3px var(--omen-shadow, transparent));
}
.beast-reveal .seal-back::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(
    110deg,
    transparent 34%,
    var(--omen-color) 47%,
    #fff5e6 50%,
    transparent 63%
  );
  background-size: 250% 100%;
  background-position: var(--reflection-x, 150%) 0;
  mask-image: var(--seal-image);
  mask-size: contain;
  mask-position: center;
  mask-repeat: no-repeat;
  -webkit-mask-image: var(--seal-image);
  -webkit-mask-size: contain;
  -webkit-mask-position: center;
  -webkit-mask-repeat: no-repeat;
  mix-blend-mode: screen;
  opacity: calc(var(--omen-presence, 0) * 0.48);
  pointer-events: none;
}
.beast-reveal .seal-front {
  transform: rotateY(180deg);
}
.beast-reveal .front-mat,
.beast-reveal .rarity-frame {
  position: absolute;
  inset: 0;
  overflow: hidden;
  border-radius: 0;
  border: 4px solid transparent;
  background:
    linear-gradient(#111b2a, #111b2a) padding-box,
    linear-gradient(
        135deg,
        #b9b8b2 0%,
        #606675 12%,
        #303747 32%,
        #525c6c 52%,
        #222b3b 76%,
        #737b88 100%
      )
      border-box;
  box-shadow: inset 0 0 0 1px #080f1bd9;
}
.beast-reveal .front-mat::before,
.beast-reveal .rarity-frame::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(
      ellipse at 50% 36%,
      color-mix(in srgb, var(--rank) 10%, #273346),
      transparent 65%
    ),
    linear-gradient(150deg, #ffffff03, transparent 48%, #00000020);
}
.beast-reveal .seal-front > img,
.beast-reveal .seal-front > span,
.beast-reveal .frame-piece {
  display: none;
}
.beast-reveal .portrait {
  position: absolute;
  left: 50%;
  top: var(--hero-y);
  width: var(--card-width);
  height: var(--card-height);
  transform: translate(-50%, -50%);
  opacity: 0;
  will-change: transform, opacity;
  pointer-events: none;
  z-index: 3;
}
.beast-reveal .portrait > img {
  position: absolute;
  z-index: 2;
  left: calc((100% - var(--hero-size)) / 2);
  top: var(--art-top);
  width: var(--hero-size);
  height: var(--hero-size);
  object-fit: contain;
  display: block;
}
.beast-reveal .portrait::after {
  content: '';
  position: absolute;
  left: 20%;
  right: 20%;
  top: calc(var(--art-top) + var(--hero-size) * 0.86);
  height: calc(var(--hero-size) * 0.1);
  background: radial-gradient(ellipse, #02040a70, transparent 70%);
  pointer-events: none;
}
.beast-reveal .outgoing {
  z-index: 2;
}
.beast-reveal .anticipation {
  position: absolute;
  top: calc(var(--visual-y) + var(--card-height) / 2 + 12px);
  left: 16px;
  right: 16px;
  text-align: center;
  font-size: 11px;
  letter-spacing: 0.6px;
  color: var(--scene-label);
  pointer-events: none;
}
.beast-reveal .result-dock {
  position: absolute;
  bottom: max(20px, env(safe-area-inset-bottom));
  left: 24px;
  right: 24px;
  display: flex;
  flex-direction: column;
  gap: 24px;
  z-index: 4;
}
.beast-reveal .identity {
  display: block;
  position: absolute;
  z-index: 3;
  left: 22px;
  right: 22px;
  bottom: 22px;
  padding-top: 16px;
  border-top: 1px solid #e1e7f01c;
  text-align: left;
  opacity: 0;
  transform: translateY(7px);
  pointer-events: none;
}
.beast-reveal.is-static {
  background: #070d1c;
  --title-color: #f7f4fc;
  --scene-label: #c2c7d7;
  --detail-color: #a8acc1;
}
.beast-reveal .beast-reveal-placeholder {
  position: absolute;
  left: 0;
  right: 0;
  top: var(--art-top);
  height: var(--hero-size);
  display: grid;
  place-items: center;
  color: var(--rank);
  font-size: 64px;
}
.beast-reveal .identity-heading {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 12px;
}
.beast-reveal .card-rarity {
  color: var(--rank);
  font-size: 12px;
  line-height: 1;
  font-weight: 650;
  letter-spacing: 1.8px;
  border: 1px solid color-mix(in srgb, var(--rank) 28%, transparent);
  padding: 7px 8px 7px 10px;
  background: color-mix(in srgb, var(--rank) 7%, #111b2a);
}
.beast-reveal .identity h2 {
  flex: 1 0 auto;
  max-width: 100%;
  font-size: clamp(22px, calc(var(--card-width) * 0.088), 29px);
  font-weight: 650;
  letter-spacing: -0.6px;
  line-height: 1.18;
  color: var(--title-color);
  overflow-wrap: normal;
}
.beast-reveal .identity p {
  font-size: 11px;
  color: #b7c0d0;
  margin-top: 8px;
  line-height: 1.5;
}
.beast-reveal .result-actions {
  display: grid;
  gap: 5px;
  opacity: 0;
  visibility: hidden;
  transform: translateY(10px);
}
.beast-reveal .result-primary {
  min-height: 52px;
  width: 100%;
  border-radius: 12px;
  border: 1px solid #6e57ba;
  background: #7460c5;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  padding: 12px 14px;
  letter-spacing: 0.2px;
}
.beast-reveal .replay,
.beast-reveal .batch-skip {
  min-height: 40px;
  background: none;
  border: 0;
  color: #9ea1b8;
  font-size: 11px;
  padding: 8px;
}
.beast-reveal .batch-skip {
  justify-self: center;
  min-width: 88px;
  min-height: 44px;
  color: #b5b9cb;
}
.beast-reveal .batch-skip:hover {
  color: #eceaf5;
}
.beast-reveal.has-result .result-actions {
  opacity: 1;
  visibility: visible;
  transform: none;
  transition:
    opacity 0.25s,
    transform 0.25s;
}
.beast-reveal .summary {
  position: absolute;
  inset: 0;
  overflow: auto;
  padding: 100px 20px 24px;
  z-index: 6;
  background: #f6f3fa;
  text-align: center;
}
.beast-reveal .summary .eyebrow {
  color: #85728e;
}
.beast-reveal .summary h2 {
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -0.7px;
  margin: 12px 0 9px;
}
.beast-reveal .summary > p {
  font-size: 12px;
  color: #82718c;
}
.beast-reveal .summary-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin: 26px 0 20px;
}
.beast-reveal .summary-card {
  border: 1px solid #e1d9eb;
  border-top: 2px solid var(--card-rank);
  border-radius: 12px;
  background: #fffafd;
  padding: 14px 6px 12px;
  min-width: 0;
}
.beast-reveal .summary-card img {
  display: block;
  width: 100%;
  height: 96px;
  object-fit: contain;
}
.beast-reveal .summary-card strong {
  display: block;
  font-size: 12px;
  color: #483a56;
  margin-top: 7px;
  overflow-wrap: anywhere;
}
.beast-reveal .summary-card span {
  display: block;
  font-size: 9px;
  font-weight: 650;
  letter-spacing: 1.5px;
  color: var(--card-rank);
  margin-top: 6px;
}
.beast-reveal .summary > .replay {
  display: block;
  width: 100%;
}
.beast-reveal.is-summary .seal-stage,
.beast-reveal.is-summary .cinematic,
.beast-reveal.is-summary .portrait,
.beast-reveal.is-summary .result-dock,
.beast-reveal.is-summary .anticipation,
.beast-reveal.is-summary canvas {
  visibility: hidden;
}
@media (max-width: 600px) {
  dialog.beast-reveal {
    border-radius: 0 !important;
  }
}
@media (max-height: 650px) {
  .beast-reveal .result-dock {
    bottom: max(12px, env(safe-area-inset-bottom));

@media (prefers-reduced-motion: reduce) {

}
.beast-reveal .omen {

  left: 50%;

.beast-reveal .omen img {

.beast-reveal .cinematic > [data-reveal='portrait'] {

}
.beast-reveal .impact-veil {

}
.beast-reveal .rarity-frame {

.beast-reveal .rarity-signal {

@keyframes beast-reveal-in {

@media (max-width: 380px) {

@media (prefers-reduced-motion: reduce) {

  }

/* A shared flat card frame, a readable reveal and a stable continuation target. */
button.tower-card {
  isolation: isolate;
  box-shadow:
    0 2px 3px #59354a08,
    0 9px 18px #59354a12;
}
.tower-card::after {
  content: '';
  position: absolute;
  inset: -5px;
  border: 1px solid transparent;
  border-radius: 14px;
  pointer-events: none;
  opacity: 0;
}
.tower-card.is-selected::after {
  border-color: #b9a3d1;
  opacity: 1;
  transition: opacity 0.25s;
}
.tower-board.has-selection .tower-card:not(.is-selected) {
  opacity: 0.4;
  filter: saturate(0.7);
  transition:
    transform 0.3s,
    opacity 0.45s,
    filter 0.4s;
}
.tower-card.is-impact::after {
  border-color: #b66f58;
  animation: tower-loss-ring 0.65s ease-out both;
}
.tower-card.is-impact .tower-card-front {
  animation: tower-loss-wash 0.45s ease-out both;
}
.tower-crack {
  stroke-dasharray: 170;
  stroke-dashoffset: 170;
}
.tower-splinters {
  opacity: 0;
  transform-origin: 124px 155px;
}
.tower-card.is-impact .tower-crack,
.tower-card.is-settled .tower-crack {
  stroke-dashoffset: 0;
  transition: stroke-dashoffset 0.38s ease-out;
}
.tower-card.is-impact .tower-splinters {
  animation: tower-shards 0.7s ease-out both;
}
.tower-card.is-settled:not(.is-impact) .tower-splinters {
  opacity: 0.5;
}
.tower-card[data-result='trap'].is-settled::after {
  opacity: 0;
}
.tower-ticket {
  transform-box: view-box;
}
.tower-card[data-result='safe'].is-revealed .tower-ticket {
  animation: tower-ticket-in 0.36s 0.5s both;
}
.tower-purse {
  transition:
    background-color 0.4s,
    border-color 0.4s;
}
.tower-purse.is-lost {
  background: color-mix(in srgb, var(--tower-trap) 55%, var(--surface));
  border-color: var(--tower-trap-border);
}
.tower-purse.is-lost .tower-purse-icon,
.tower-purse.is-lost .tower-purse-label {
  color: var(--tower-trap-ink);
}
.tower-purse.is-lost.has-forfeited-reward .tower-purse-value {
  color: var(--muted);
  text-decoration: line-through;
  text-decoration-color: var(--tower-trap-ink);
  text-decoration-thickness: 1px;
}
.tower-stage.is-failed .tower-status {
  color: var(--muted);
}
.tower-board:has(> .tower-card:last-child:nth-child(2)) {
  grid-template-columns: repeat(2, minmax(0, 144px));
  min-height: 270px;
  padding-top: 26px;
  padding-bottom: 14px;
}
.tower-board:has(> .tower-card:last-child:nth-child(2)) > .tower-card {
  max-width: 144px;
}
.tower-experience.has-run {
  grid-template-rows: auto auto 1fr 62px minmax(34px, auto);
}
.tower-experience.has-run > .tower-actions {
  min-height: 62px;
}
.tower-experience.has-run > .tower-actions:empty {
  display: grid;
  visibility: hidden;
}
.tower-experience.has-run > .tower-actions > .tower-action {
  min-height: 62px;
}
.tower-experience.has-run > .tower-footnote {
  min-height: 34px;
}
.tower-experience.has-run > .tower-footnote:empty {
  display: block;
  visibility: hidden;
}
@media (max-width: 699px) {
  .tower-experience.has-run {
    min-height: calc(100dvh - 114px);
  }
}
@keyframes tower-loss-ring {
  0% {
    opacity: 0.75;
    transform: scale(0.98);
  }
  100% {
    opacity: 0;
    transform: scale(1.2);
  }
}
@keyframes tower-loss-wash {
  0% {
    filter: brightness(1.12);
  }
  100% {
    filter: brightness(1);
  }
}
@keyframes tower-shards {
  0% {
    opacity: 0;
    transform: scale(0.9);
  }
  25% {
    opacity: 0.8;
  }
  100% {
    opacity: 0.4;
    transform: scale(1.07) translateY(3px);
  }
}
@keyframes tower-ticket-in {
  from {
    opacity: 0.2;
  }
  to {
    opacity: 1;
  }
}
@media (prefers-reduced-motion: reduce) {
  .tower-experience *,
  .tower-experience *::after {
    animation: none !important;
    transition: none !important;
  }
  .tower-card.is-impact::after {
    opacity: 0;
  }
  .tower-card .tower-crack {
    stroke-dashoffset: 0;
  }
  .tower-card.is-impact .tower-splinters {
    opacity: 0.5;
  }
}
html[data-motion='reduce'] .tower-experience *,
html[data-motion='reduce'] .tower-experience *::after {
  animation: none !important;
  transition: none !important;
}
html[data-motion='reduce'] .tower-card .tower-crack {
  stroke-dashoffset: 0;
}

  --evolution-color: #d6af79;
  --evolution-light: #ffedcb;
  --evolution-identity: 0;
  --evolution-intro: 1;
  position: fixed;
  inset: 0;
  margin: 0;
  width: 100vw;
  max-width: none;
  height: 100dvh;
  min-height: 100dvh;
  max-height: none;
  padding: 0;
  border: 0;
  border-radius: 0;
  overflow: hidden;
  isolation: isolate;
  overscroll-behavior: contain;
  color: #f4eee3;
  background: #090c16;
  font-family: inherit;

  color-scheme: dark;

.beast-evolution::backdrop {

.beast-evolution [hidden] {
  display: none !important;

.beast-evolution h2 {
  margin: 0;

.beast-evolution .beast-evolution-theatre {
  position: absolute;
  inset: 0;

  height: 100%;
  display: block;
  border-radius: 0;
  overflow: hidden;
  background: #090c16;
}
.beast-evolution-theatre canvas {
  width: 100%;
  height: 100%;

}
.beast-evolution .evolution-top {
  position: absolute;
  z-index: 3;
  inset: 0 0 auto;
  padding: max(18px, env(safe-area-inset-top)) clamp(20px, 5vw, 48px) 12px;
  display: flex;

.tower-result-label strong{font-size:28px;font-weight:700;line-height:1.05;letter-spacing:-.8px;}

.tower-card[data-result="trap"] .tower-result-label strong,.tower-card[data-result="rescued"] .tower-result-label strong{font-size:18px;letter-spacing:-.3px;}

.tower-card.is-selected{transform:translateY(-4px);}

.tower-card:focus-visible{outline:2px solid var(--accent);outline-offset:4px;}

.tower-status{font-size:12px;line-height:1.6;color:var(--muted);min-height:20px;margin:10px 0 0;text-align:center;}
.tower-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start;}
.tower-actions:empty{display:none;}
.tower-actions .tower-action{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;margin:0;width:100%;min-height:56px;min-width:0;border-radius:14px;padding:12px 8px;font-size:14px;font-weight:650;line-height:1.3;}
.tower-actions .tower-action small{font-size:10px;font-weight:500;opacity:.85;color:inherit;}
.tower-actions>button:only-child,.tower-conditions{grid-column:1/-1;}
.tower-actions .primary{background:var(--accent);color:#fff;border:1px solid var(--accent);box-shadow:none;}
.tower-actions .secondary{background:var(--surface);border:1px solid color-mix(in srgb,var(--accent) 22%,var(--line));color:var(--accent);}
.tower-actions .tower-action:disabled{opacity:.5;}
.tower-actions .tower-action:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
.tower-footnote{font-size:11px;line-height:1.6;text-align:center;color:var(--muted);margin:0 auto;max-width:330px;}
.tower-footnote:empty,.tower-status:empty{display:none;}
.tower-conditions{display:grid;gap:6px;font-size:12px;line-height:1.6;margin:0;color:var(--text);}
.tower-conditions p{margin:0;}
.tower-entry-art{position:relative;display:grid;place-items:center;height:196px;margin:0 0 24px;pointer-events:none;}
.tower-entry-art>.tower-card-art{width:142px;height:183px;filter:drop-shadow(0 9px 12px #75483215);}
.tower-entry-illustration{display:block;width:100%;height:100%;}
.tower-stage.is-entry .tower-stage-title{font-size:24px;letter-spacing:-.6px;}
.tower-stage.is-entry .tower-stage-hint{max-width:310px;margin:8px auto 0;font-size:13px;line-height:1.7;}
.tower-board.is-preview{display:block;padding:22px 0 0;min-height:0;}

.tower-preview-row{display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:14px 0;border-top:1px solid var(--line);}
.tower-preview-row span{font-size:11px;color:var(--muted);}
.tower-preview-row strong{font-size:14px;font-weight:600;color:var(--text);}
.tower-board.is-receipt{display:block;min-height:0;padding:24px 0 28px;}
.tower-receipt{width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;}
.tower-receipt-check{width:240px;height:170px;display:block;margin:6px 0 16px;}
.tower-receipt-illustration{width:100%;height:100%;}
.tower-receipt-reward{font-size:30px;font-weight:650;line-height:1.3;letter-spacing:-.8px;color:var(--text);}
.tower-receipt-balance{margin:0;font-size:13px;color:var(--muted);}

/* A shared flat card frame, a readable reveal and a stable continuation target. */
button.tower-card{isolation:isolate;box-shadow:0 2px 3px #59354a08,0 9px 18px #59354a12;}
.tower-card::after{content:"";position:absolute;inset:-5px;border:1px solid transparent;border-radius:14px;pointer-events:none;opacity:0;}
.tower-card.is-selected::after{border-color:#b9a3d1;opacity:1;transition:opacity .25s;}
.tower-board.has-selection .tower-card:not(.is-selected){opacity:.4;filter:saturate(.7);transition:transform .3s,opacity .45s,filter .4s;}
.tower-card.is-impact::after{border-color:#b66f58;animation:tower-loss-ring .65s ease-out both;}
.tower-card.is-impact .tower-card-front{animation:tower-loss-wash .45s ease-out both;}
.tower-crack{stroke-dasharray:170;stroke-dashoffset:170;}
.tower-splinters{opacity:0;transform-origin:124px 155px;}
.tower-card.is-impact .tower-crack,.tower-card.is-settled .tower-crack{stroke-dashoffset:0;transition:stroke-dashoffset .38s ease-out;}
.tower-card.is-impact .tower-splinters{animation:tower-shards .7s ease-out both;}
.tower-card.is-settled:not(.is-impact) .tower-splinters{opacity:.5;}
.tower-card[data-result="trap"].is-settled::after{opacity:0;}
.tower-ticket{transform-box:view-box;}
.tower-card[data-result="safe"].is-revealed .tower-ticket{animation:tower-ticket-in .36s .5s both;}
.tower-purse{transition:background-color .4s,border-color .4s;}
.tower-purse.is-lost{background:color-mix(in srgb,var(--tower-trap) 55%,var(--surface));border-color:var(--tower-trap-border);}
.tower-purse.is-lost .tower-purse-icon,.tower-purse.is-lost .tower-purse-label{color:var(--tower-trap-ink);}
.tower-purse.is-lost.has-forfeited-reward .tower-purse-value{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--tower-trap-ink);text-decoration-thickness:1px;}
.tower-stage.is-failed .tower-status{color:var(--muted);}
.tower-board:has(>.tower-card:last-child:nth-child(2)){grid-template-columns:repeat(2,minmax(0,144px));min-height:270px;padding-top:26px;padding-bottom:14px;}

.tower-experience.has-run{grid-template-rows:auto auto 1fr 62px minmax(34px,auto);}
.tower-experience.has-run>.tower-actions{min-height:62px;}
.tower-experience.has-run>.tower-actions:empty{display:grid;visibility:hidden;}
.tower-experience.has-run>.tower-actions>.tower-action{min-height:62px;}
.tower-experience.has-run>.tower-footnote{min-height:34px;}
.tower-experience.has-run>.tower-footnote:empty{display:block;visibility:hidden;}
