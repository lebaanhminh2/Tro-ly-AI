<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>FE demo - Minh Anh · Trợ lý của cậu</title>
  <style>:root {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color-scheme: light;
  --bg: #f4f3f8;
  --surface: #fff;
  --text: #272438;
  --muted: #78748a;
  --line: #e7e4ef;
  --accent: #7460d5;
  --soft: #eeeafa;
  --status: #635776;
  --gold: #a46e23;
  --shadow: 0 10px 35px #28213f08;
}
.habit-navigation,
.habit-filters {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin: 12px 0;
}
.habit-navigation {
  border-bottom: 1px solid var(--line);
  padding-bottom: 10px;
}
.habit-navigation button[aria-pressed='true'],
.habit-filters button[aria-pressed='true'] {
  background: var(--soft);
  color: var(--text);
}
.habit-list {
  display: grid;
  gap: 12px;
  margin: 18px 0;
}
.habit-card {
  margin: 0;
  border-left: 3px solid var(--line);
}
.habit-card.is-met {
  border-left-color: var(--status);
}
.habit-card-head,
.habit-card-body {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-width: 0;
}
.habit-copy {
  min-width: 0;
}
.habit-card h2 {
  font-size: 17px;
  line-height: 1.4;
  margin: 0;
  overflow-wrap: anywhere;
}
.habit-cadence {
  font-size: 12px;
  color: var(--muted);
  margin: 3px 0 0;
}
.habit-card-body {
  margin-top: 12px;
  align-items: flex-start;
}
.habit-card-body > div {
  min-width: 0;
  flex: 1;
}
.habit-value {
  margin: 0 0 3px;
  font-variant-numeric: tabular-nums;
}
.habit-value strong {
  font-size: 23px;
  font-weight: 650;
}
.habit-value span {
  font-size: 13px;
  color: var(--muted);
}
.habit-status {
  font-size: 13px;
  line-height: 1.5;
  margin: 0;
  color: var(--text);
}
.habit-week {
  font-size: 12px;
  line-height: 1.5;
  margin: 4px 0 0;
  color: var(--muted);
}
.habit-check {
  flex-shrink: 0;
  min-height: 44px;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  color: var(--text);
  font-size: 13px;
}
.habit-check.checked {
  background: var(--soft);
  border-color: transparent;
}
.habit-log-button {
  flex-shrink: 0;
  font-size: 13px;
  padding: 10px 12px;
  min-height: 44px;
}
.habit-pending,
.habit-note {
  font-size: 12px;
  line-height: 1.5;
  color: var(--muted);
  margin: 10px 0 0;
  overflow-wrap: anywhere;
}
.habit-pending {
  padding-top: 10px;
  border-top: 1px solid var(--line);
}
.habit-empty {
  margin-top: 28px;
  line-height: 1.6;
  max-width: 42ch;
}
.habit-weekdays {
  border: 0;
  padding: 0;
  margin: 16px 0;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.habit-weekdays legend {
  font-size: 13px;
  margin-bottom: 8px;
}
.habit-weekdays button {
  padding: 10px;
  min-width: 38px;
  min-height: 44px;
}
.habit-weekdays button[aria-pressed='true'] {
  background: var(--soft);
  border-color: var(--accent);
  color: var(--accent);
}
.habit-weekdays[hidden],
.habit-form [hidden] {
  display: none !important;
}
.habit-form-explanation {
  line-height: 1.6;
  margin-top: 16px;
}
.habit-history-tools {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  margin: 20px 0;
}
.habit-history-tools select {
  min-width: 0;
  flex: 1;
  min-height: 44px;
  font-size: 14px;
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  color: var(--text);
}
.habit-history-summary {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.6;
}
.habit-history-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 0;
  border-bottom: 1px solid var(--line);
}
.habit-history-row h3 {
  font-size: 14px;
  margin: 0;
  overflow-wrap: anywhere;
}
.habit-history-row > div {
  min-width: 0;
}
.habit-history-row .hint {
  font-size: 12px;
  margin: 4px 0 0;
}
.habit-history-value {
  text-align: right;
  font-size: 13px;
  max-width: 46%;
  font-variant-numeric: tabular-nums;
}
.habit-history-value small {
  display: block;
  font-size: 11px;
  color: var(--muted);
  margin-top: 5px;
}
.habit-notice p {
  font-size: 13px;
  line-height: 1.6;
}
.day-timeline {
  margin: 18px 0;
}
.time-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 8px;
}
.time-scroll {
  height: min(64dvh, 620px);
  min-height: 320px;
  overflow-y: auto;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--surface);
  margin-top: 14px;
  overscroll-behavior: contain;
  position: relative;
}
.time-canvas {
  position: relative;
  margin: 16px 10px 16px 0;
}
.time-hour {
  position: absolute;
  left: 0;
  right: 0;
  border-top: 1px solid var(--line);
  pointer-events: none;
}
.time-hour > span {
  position: absolute;
  top: 3px;
  left: 8px;
  font-size: 11px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.time-task,
.time-busy {
  position: absolute;
  left: 55px;
  right: 4px;
  border-radius: 12px;
  overflow: hidden;
}
.time-busy {
  background: repeating-linear-gradient(
    135deg,
    var(--line),
    var(--line) 2px,
    transparent 2px,
    transparent 9px
  );
  color: var(--muted);
  padding: 7px 10px;
  display: flex;
  flex-direction: column;
  font-size: 12px;
}
.time-task {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 3px 5px 3px 9px;
  background: var(--soft);
  border: 1px solid var(--accent);
  box-shadow: 0 3px 8px #00000008;
  z-index: 2;
}
.time-task .check {
  flex-shrink: 0;
  width: 20px;
  height: 20px;
}
.time-task-label {
  min-height: 0 !important;
  min-width: 0;
  flex: 1;
  text-align: left;
  background: none;
  border: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 2px;
  touch-action: pan-y;
}
.time-task-label strong {
  font-size: 13px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 100%;
}
.time-task-label small {
  font-size: 10px;
  color: var(--muted);
}
.time-task.current {
  border-width: 2px;
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent);
}
.time-drag {
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  width: 36px;
  align-self: stretch;
  min-height: 0 !important;
  border: 0;
  background: transparent;
  font-size: 25px;
  color: var(--accent);
  cursor: grab;
  flex-shrink: 0;
}
.time-task.dragging {
  z-index: 5;
  box-shadow: 0 8px 25px #0003;
  opacity: 0.95;
}
.time-task.invalid {
  border-color: #d75c65;
}
.time-drop-hint {
  position: sticky;
  top: 0;
  z-index: 6;
  background: var(--text);
  color: var(--surface);
  padding: 10px;
  border-radius: 10px;
  font-size: 13px;
}
.time-now {
  position: absolute;
  left: 0;
  right: 0;
  border-top: 2px solid #d85870;
  z-index: 4;
  pointer-events: none;
}
.time-now span {
  position: absolute;
  left: 0;
  top: -10px;
  background: #d85870;
  color: white;
  padding: 2px 5px;
  border-radius: 5px;
  font-size: 10px;
}
.time-completed {
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 14px;
}
.time-completed summary {
  cursor: pointer;
  color: var(--muted);
}
.estimate-editor {
  margin: 12px 0;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 14px;
}
.estimate-editor .work-slider {
  width: 100%;
  margin-top: 8px;
}
.daily-plan {
  margin: 18px 0;
}
.plan-summary {
  font-size: 13px;
  color: var(--muted);
  margin: 10px 0;
}
.daily-list {
  display: grid;
  gap: 10px;
}
.daily-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--surface);
  box-shadow: var(--shadow);
}
.daily-item .check {
  width: 22px;
  height: 22px;
  flex: none;
}
.daily-item-open {
  min-width: 0;
  min-height: 0 !important;
  flex: 1;
  text-align: left;
  border: 0;
  background: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.daily-item-open strong {
  font-size: 16px;
}
.daily-item-open small {
  color: var(--muted);
  font-size: 12px;
}
.daily-later {
  margin-top: 15px;
  padding: 12px;
  border-top: 1px solid var(--line);
}
.daily-later summary {
  cursor: pointer;
  color: var(--accent);
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
}
button,
input,
select {
  font: inherit;
}
button {
  cursor: pointer;
  touch-action: manipulation;
  color: inherit;
}
button:disabled {
  opacity: 0.45;
  cursor: default;
}
button:focus-visible,
input:focus-visible {
  outline: 3px solid #9d8de8;
  outline-offset: 3px;
}
button {
  min-height: 44px;
}
p,
h1,
h2,
h3 {
  margin: 0;
}
h1 {
  font-size: 30px;
  letter-spacing: -1.1px;
  line-height: 1.25;
}
h2 {
  font-size: 18px;
  letter-spacing: -0.35px;
}
h3 {
  font-size: 16px;
}
p {
  line-height: 1.55;
}
.shell {
  max-width: 520px;
  margin: auto;
  min-height: 100dvh;
}
.demo-strip {
  padding: 9px 16px;
  text-align: center;
  font-size: 10px;
  letter-spacing: 0.6px;
  background: var(--soft);
  color: var(--accent);
}
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px 22px 18px;
  padding-top: max(22px, env(safe-area-inset-top));
}
.identity {
  display: flex;
  gap: 10px;
  align-items: center;
}
.avatar {
  position: relative;
  width: 42px;
  height: 42px;
  border-radius: 15px;
  background: #d8d0f3;
  color: #554696;
  font-family: Georgia, serif;
  font-size: 29px;
  text-align: center;
}
.avatar span {
  position: absolute;
  right: -3px;
  top: -5px;
  font: 18px sans-serif;
  color: var(--gold);
}
.eyebrow {
  font-size: 10px;
  letter-spacing: 2px;
  font-weight: 750;
  color: var(--muted);
}
.brand-caption {
  font-size: 12px;
  color: var(--muted);
}
.icon-button {
  border: 1px solid var(--line);
  border-radius: 15px;
  background: var(--surface);
  width: 44px;
  font-size: 21px;
}
main {
  padding: 8px 22px 125px;
  outline: none;
}
.heading {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: end;
  margin: 8px 0 22px;
}
.subtitle {
  margin-top: 8px;
  color: var(--muted);
  font-size: 13px;
}
.date-pill,
.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--surface);
  border: 1px solid var(--line);
  padding: 7px 10px;
  border-radius: 12px;
  font-size: 11px;
  white-space: nowrap;
}
.pill {
  background: var(--soft);
  border: 0;
  color: var(--accent);
}
.hero {
  padding: 24px;
  border-radius: 26px;
  background: linear-gradient(135deg, #eee8fd, #ede8fa);
  border: 1px solid #ded8f0;
  position: relative;
  overflow: hidden;
}
.hero:after {
  content: '✦';
  position: absolute;
  right: 18px;
  top: 0;
  font-size: 100px;
  color: #7660a710;
  pointer-events: none;
}
.hero h2 {
  font-size: 24px;
  line-height: 1.3;
  margin: 13px 0 8px;
  position: relative;
}
.hero .eyebrow {
  color: #6a568f;
}
.hero p {
  color: #5f5d72;
  font-size: 13px;
}
.hero .actions {
  margin-top: 20px;
}
.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.primary,
.secondary,
.danger {
  border: 0;
  border-radius: 14px;
  padding: 12px 18px;
  font-weight: 650;
  font-size: 13px;
}
.primary {
  background: var(--accent);
  color: white;
  box-shadow: 0 5px 16px #7460d52b;
}
.secondary {
  background: var(--surface);
  border: 1px solid var(--line);
}
.danger {
  background: #fbe9eb;
  color: #a1354d;
}
.text-button {
  border: 0;
  background: none;
  color: var(--accent);
  font-size: 12px;
  font-weight: 650;
  padding: 8px 0;
}
.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 24px 0 12px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 21px;
  padding: 18px;
  box-shadow: var(--shadow);
}
.capacity {
  margin: 16px 0;
  display: grid;
  gap: 9px;
}
.capacity-row {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
}
.track {
  height: 6px;
  border-radius: 6px;
  background: var(--line);
  overflow: hidden;
}
.track > span {
  display: block;
  height: 100%;
  background: var(--accent);
  border-radius: inherit;
}
.segment {
  display: flex;
  background: var(--line);
  padding: 4px;
  border-radius: 14px;
  margin: 18px 0 12px;
}
.segment button {
  flex: 1;
  min-height: 36px;
  border: 0;
  background: transparent;
  border-radius: 10px;
  color: var(--muted);
  font-size: 13px;
}
.segment button[aria-pressed='true'] {
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 2px 5px #00000008;
}
.timeline-row {
  display: grid;
  grid-template-columns: 45px 12px 1fr;
  gap: 9px;
  align-items: start;
  padding: 16px 0;
}
.timeline-row + .timeline-row {
  border-top: 1px solid var(--line);
}
.time {
  font-size: 12px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  padding-top: 4px;
}
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  margin-top: 7px;
}
.dot.fixed {
  background: var(--muted);
}
.dot.sleep {
  background: #ad9564;
}
.timeline-row small,
.task-row small,
.reminder-row small {
  display: block;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
  margin-top: 5px;
}
.list-reset {
  list-style: none;
  margin: 0;
  padding: 0;
}
.task-row {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}
.task-row:last-child {
  border: 0;
}
.task-open {
  flex: 1;
  border: 0;
  background: none;
  text-align: left;
  min-width: 0;
  padding: 0;
}
.task-open strong {
  display: block;
  overflow-wrap: anywhere;
}
.code {
  font-size: 11px;
  color: var(--muted);
  margin-right: 5px;
}
.check {
  width: 23px;
  height: 23px;
  min-height: 44px;
  accent-color: var(--accent);
  flex-shrink: 0;
}
.task-row.done strong {
  text-decoration: line-through;
  color: var(--muted);
}
.empty {
  text-align: center;
  padding: 36px 22px;
}
.empty .empty-symbol {
  display: block;
  font-size: 36px;
  color: var(--accent);
  margin-bottom: 15px;
}
.empty p {
  color: var(--muted);
  font-size: 13px;
  margin: 10px 0 18px;
}
.reminder-row {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 18px;
  margin-bottom: 12px;
  display: flex;
  gap: 14px;
  text-align: left;
  align-items: center;
}
.reminder-icon {
  height: 42px;
  width: 42px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  background: var(--soft);
  color: var(--accent);
  font-size: 21px;
  flex-shrink: 0;
}
.reminder-main {
  flex: 1;
  min-width: 0;
}
.reminder-main strong {
  overflow-wrap: anywhere;
}
.chevron {
  color: var(--muted);
}
.off {
  opacity: 0.65;
}
.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 14px;
}
.stat-label {
  font-size: 12px;
  color: var(--muted);
}
.stat-value {
  font-size: 32px;
  font-weight: 750;
  letter-spacing: -1px;
  margin-top: 6px;
}
.stat-value small {
  font-size: 13px;
  color: var(--muted);
  font-weight: 400;
  letter-spacing: 0;
}
.chart {
  display: flex;
  gap: 12px;
  align-items: end;
  height: 130px;
  margin: 20px 0 8px;
}
.chart-col {
  flex: 1;
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: end;
  height: 100%;
  font-size: 11px;
  color: var(--muted);
}
.chart-bar {
  background: #b5a7e9;
  border-radius: 6px 6px 3px 3px;
  min-height: 3px;
  margin: 6px 0 9px;
}
.chart-col:last-child .chart-bar {
  background: var(--accent);
}
.streak {
  display: flex;
  gap: 18px;
  align-items: center;
}
.streak-icon {
  font-size: 30px;
  color: var(--gold);
}
.rank-card {
  border: 1px solid #dfcda7;
  background: linear-gradient(140deg, #fbf5e6, #efe9fa);
  border-radius: 23px;
  padding: 22px;
  text-align: center;
  color: #67532f;
  margin: 15px 0;
}
.rank-seal {
  width: 66px;
  height: 66px;
  margin: 0 auto 14px;
  border: 1px solid #baa274;
  border-radius: 20px;
  display: grid;
  place-items: center;
  font-size: 31px;
  transform: rotate(4deg);
  background: #ffffff55;
}
.rank-card h2 {
  font-family: Georgia, serif;
  font-size: 28px;
  margin: 6px 0;
}
.rank-card p {
  font-size: 12px;
}
.rank-row {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 15px 0;
  border-bottom: 1px solid var(--line);
}
.rank-row:last-child {
  border: 0;
}
.rank-row > div {
  flex: 1;
}
.rank-row small {
  font-size: 12px;
  color: var(--muted);
}
.rank-row .track {
  margin-top: 9px;
}
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 520px;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding: 10px 14px max(12px, env(safe-area-inset-bottom));
  display: flex;
  z-index: 5;
}
.bottom-nav button {
  flex: 1;
  display: grid;
  justify-items: center;
  gap: 5px;
  min-height: 55px;

.effect-spin {
  animation: reward-spin 0.72s ease-in-out both;
  box-shadow:
    0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent),
    0 8px 24px color-mix(in srgb, var(--accent) 24%, transparent);
}
.effect-breakthrough {
  animation: breakthrough-pulse 0.86s ease-in-out both;
  box-shadow:
    0 0 0 4px color-mix(in srgb, var(--gold) 22%, transparent),
    0 8px 28px color-mix(in srgb, var(--gold) 28%, transparent);
}
@keyframes reward-spin {
  0% {
    transform: rotate(0) scale(1);
  }
  25% {
    transform: rotate(-4deg) scale(1.03);
  }
  50% {
    transform: rotate(4deg) scale(1.06);
  }
  75% {
    transform: rotate(-2deg) scale(1.03);
  }
  100% {
    transform: rotate(0) scale(1);
  }
}
@keyframes breakthrough-pulse {
  0% {
    transform: scale(1);
    filter: saturate(1);
  }
  35% {
    transform: scale(1.05);
    filter: saturate(1.35);
  }
  70% {
    transform: scale(0.98);
    filter: saturate(1.1);
  }
  100% {
    transform: scale(1);
    filter: saturate(1);
  }
}
@media (prefers-reduced-motion: reduce) {
  .effect-spin,
  .effect-breakthrough {
    animation: none;
  }
}
.mystery-card {
  min-height: 92px;
  display: grid;
  place-items: center;
  font-size: 42px;
  letter-spacing: 2px;
  background: linear-gradient(135deg, var(--soft), var(--surface));
  border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--line));
  transition:
    transform 0.18s ease,
    background 0.18s ease;
}
.mystery-card.effect-spin {
  animation: mystery-flip 0.62s ease-in-out both;
}
.mystery-card.mystery-revealed {
  font-size: 16px;
  letter-spacing: 0;
  background: var(--soft);
}
.effect-success {
  background: var(--soft);
  color: var(--status);
  animation: stamp-in 0.28s ease-out both;
}
.effect-failure {
  background: #fff4e5;
  color: #8a5b19;
  animation: stamp-in 0.28s ease-out both;
}
@keyframes mystery-flip {
  0% {
    transform: perspective(500px) rotateY(0) scale(1);
    opacity: 1;
  }
  45% {
    transform: perspective(500px) rotateY(90deg) scale(0.96);
    opacity: 0.45;
  }
  55% {
    transform: perspective(500px) rotateY(-90deg) scale(0.96);
    opacity: 0.45;
  }
  100% {
    transform: perspective(500px) rotateY(0) scale(1);
    opacity: 1;
  }
}
@keyframes stamp-in {
  0% {
    transform: scale(0.94);
    opacity: 0.5;
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}
@media (prefers-reduced-motion: reduce) {
  .mystery-card {
    transition: none;
  }
  .mystery-card.effect-spin,
  .effect-success,
  .effect-failure {
    animation: none;
  }
}

.focus-flip-card {
  display: block;
  width: 100%;
  min-width: 0;
  padding: 0;
  border: 0;
  border-radius: 18px;
  background: transparent;
  text-align: center;
  perspective: 1100px;

}
.focus-flip-card:disabled {
  opacity: 1;

  display: grid;
  transform: rotateY(0);
  transform-style: preserve-3d;
}

.focus-flip-card.focus-activating:not(.is-focused) .focus-flip-inner {
  animation: focus-card-flip-forward 0.52s cubic-bezier(0.45, 0.05, 0.2, 1) both;
}
.focus-flip-card.is-focused.focus-activating .focus-flip-inner {
  animation: focus-card-flip-backward 0.52s cubic-bezier(0.45, 0.05, 0.2, 1) both;
}
.focus-flip-card.focus-reverting:not(.is-focused) .focus-flip-inner {
  animation: focus-card-revert-front 0.36s ease-out both;
}
.focus-flip-card.is-focused.focus-reverting .focus-flip-inner {
  animation: focus-card-revert-back 0.36s ease-out both;
}
@keyframes focus-card-flip-forward {
  from {
    transform: rotateY(0);
  }
  to {
    transform: rotateY(180deg);
  }
}
@keyframes focus-card-flip-backward {
  from {
    transform: rotateY(180deg);
  }
  to {
    transform: rotateY(360deg);
  }
}
@keyframes focus-card-revert-front {
  from {
    transform: rotateY(180deg);
  }
  to {
    transform: rotateY(360deg);
  }
}
@keyframes focus-card-revert-back {
  from {
    transform: rotateY(360deg);
  }
  to {
    transform: rotateY(180deg);
  }
}
@media (prefers-reduced-motion: reduce) {
  .focus-flip-card .focus-flip-inner {
    animation: none !important;
  }

  flex: 0 0 auto;
  touch-action: manipulation;
}
dialog.schedule-sheet-open #sheet-feedback {
  flex: 0 0 auto;
}
dialog.schedule-sheet-open .schedule-form {
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  overflow-y: auto;
  padding: 2px 2px 0;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  touch-action: auto;
}
dialog.schedule-sheet-open::backdrop {
  touch-action: none;
  overscroll-behavior: none;
}
dialog.schedule-sheet-open .time-slots,
dialog.schedule-sheet-open .availability-row,
dialog.schedule-sheet-open .form-field,
dialog.schedule-sheet-open input[type='time'] {
  position: relative;
  pointer-events: auto;
}
.schedule-intro {
  margin: 4px 0 18px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
}
.schedule-section-title {
  margin: 20px 0 10px;
  font-size: 16px;
}
.duration-picker {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  margin: 12px 0 4px;
}
.duration-picker select {
  min-width: 0;
  min-height: 48px;
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--bg);
  color: var(--text);
}
.duration-picker .secondary {
  min-width: 92px;
  padding-left: 12px;
  padding-right: 12px;
}
.estimate-list:empty {
  display: none;
}
.estimate-title {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}
.estimate-title strong {
  min-width: 0;
  line-height: 1.4;
  overflow-wrap: anywhere;
}
.estimate-title .text-button {
  flex: 0 0 auto;
}
dialog.schedule-sheet-open .sheet-submit {
  position: sticky;
  bottom: 0;
  z-index: 6;
  margin: 20px -2px 0;
  padding: 12px 2px max(14px, env(safe-area-inset-bottom));
  border-top: 1px solid var(--line);
  background: var(--surface);
}
dialog.schedule-sheet-open .sheet-submit .primary {
  width: 100%;
  min-height: 50px;
}
@media (max-width: 390px) {
  .duration-picker {
    grid-template-columns: 1fr;
  }
  .duration-picker .secondary {
    width: 100%;
  }
}

/* Browser sign-in and the wider desktop workspace. */
[hidden] {
  display: none !important;
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.browser-login {
  max-width: 600px;
  margin: 24px auto;
  display: grid;
  gap: 20px;
}
.browser-login h1 {
  margin-top: 10px;
  font-size: 32px;
  line-height: 1.2;
}
.login-card {
  display: grid;
  gap: 16px;
  padding: 24px;
}
.login-card .subtitle {
  margin: 0;
}
.login-command {
  display: block;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--soft);
  color: var(--text);
  font-size: clamp(13px, 3.6vw, 19px);
  white-space: normal;
  overflow-wrap: anywhere;
  user-select: all;
}
.login-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.login-actions a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  min-height: 44px;
}
.login-status,
.login-error {
  font-size: 12px;
  line-height: 1.6;
  color: var(--muted);
}
.login-error {
  color: var(--text);
  padding: 10px 12px;
  background: var(--soft);
  border-radius: 10px;
}
.login-screen .bottom-nav {
  display: none;
}
.login-screen #settings {
  display: none;
}
.login-screen main {
  padding-bottom: 32px;
}
@media (min-width: 900px) {
  .shell {
    max-width: 1280px;
    padding: 0 24px;
    display: grid;
    grid-template-columns: 210px minmax(0, 1fr);
    column-gap: 24px;
    grid-template-rows: auto auto 1fr;
    align-items: start;
  }
  .demo-strip {
    grid-column: 1/-1;
    border-radius: 0 0 12px 12px;
  }
  .app-header {
    grid-column: 1;
    grid-row: 2;
    padding: 28px 8px 16px;
    flex-wrap: wrap;
    gap: 16px;
    position: static;
    top: auto;
  }
  .header-actions {
    width: 100%;
    justify-content: space-between;
  }
  main {
    grid-column: 2;
    grid-row: 2/4;
    min-width: 0;
    padding: 30px 0 48px;
  }
  .bottom-nav {
    grid-column: 1;
    grid-row: 3;
    position: static;
    top: auto;
    left: auto;
    bottom: auto;
    transform: none;
    width: auto;
    max-width: none;
    padding: 8px 0;
    background: transparent;
    border: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .bottom-nav button {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 12px;
    padding: 12px 16px;
    min-height: 50px;
    border-radius: 14px;
    font-size: 14px;
    text-align: left;
  }
  .bottom-nav button span {
    width: 24px;
    text-align: center;
  }
  .bottom-nav button[aria-current='page'] {
    background: var(--soft);
  }
  .bottom-nav button:hover {
    background: var(--surface);
  }
  .today-page {
    display: grid;
    grid-template-columns: 260px minmax(0, 1fr);
    grid-template-areas: 'heading heading' 'rest rest' 'focus main';
    gap: 16px 22px;
    align-items: start;
  }
  .today-page > .heading {
    grid-area: heading;
    margin-bottom: 4px;
  }
  .today-page > .rest-state {
    grid-area: rest;
  }
  .today-page > .work-state {
    grid-area: focus;
    position: sticky;
    top: 24px;
  }
  .today-page > .today-main {
    grid-area: main;
  }
  .today-page .plan-overview {
    grid-template-columns: 1fr;
  }
  .today-page .plan-actions {
    max-width: none;
  }
  .today-page .focus-flip-face {
    min-height: 240px;
    padding: 24px 18px;
  }
  .today-page .focus-flip-title {
    font-size: 23px;
  }
  .today-page .sleep-card {
    min-height: 240px;
    padding: 24px 18px;
  }
  .task-list-section {
    max-width: none;
  }
  dialog,
  dialog.task-sheet-open,
  dialog.schedule-sheet-open,
  dialog.settings-sheet-open {
    inset: 0;
    margin: auto;
    width: min(640px, calc(100vw - 64px));
    max-width: 640px;
    max-height: 86dvh;
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 24px;
    box-shadow: 0 24px 80px #1a122c26;
  }
  dialog:not(.task-sheet-open):not(.schedule-sheet-open):not(.reward-sheet-open):not(
      .settings-sheet-open
    ):not(.draw-sheet-open) {
    height: fit-content;
  }
  dialog .sheet-handle {
    display: none;
  }
  dialog.task-sheet-open .task-sheet-body {
    padding-bottom: 12px;
  }
  dialog.task-sheet-open .task-actions,
  dialog.schedule-sheet-open .sheet-submit {
    padding-bottom: 0;
  }
  #toast {
    bottom: 28px;
  }
  .login-screen .shell {
    display: block;
    max-width: 840px;
  }
  .login-screen .app-header {
    position: static;
    width: 100%;
    padding: 28px 0;
    flex-wrap: nowrap;
  }
  .login-screen .header-actions {
    width: auto;
  }
  .login-screen main {
    padding: 8px 0 48px;
  }
  .browser-login {
    margin: 28px auto 48px;
  }
  .browser-login h1 {
    font-size: 40px;
  }
}

/* Reward calendar: readable future gifts, distinct milestones, one claim action. */
:root {
  --muted: #6f6a82;
}
:root[data-theme='dark'] {
  --muted: #b1acc1;
}
select:focus-visible,
textarea:focus-visible,
summary:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 3px;
}
.achievements-page {
  display: flex;
  flex-direction: column;
  gap: 24px;
  min-width: 0;
}
.achievements-page > *,
.achievement-overview > *,
.cultivation-section > * {
  min-width: 0;
}
.achievements-page .checkin-card {
  padding: 22px;
  border-radius: 22px;
  border-color: color-mix(in srgb, var(--accent) 22%, var(--line));
  background: var(--surface);
}
.checkin-heading {
  display: flex;
  justify-content: space-between;
  gap: 18px;
  align-items: center;
}
.checkin-heading h2 {
  font-size: 25px;
  margin-top: 7px;
  letter-spacing: -0.7px;
}
.checkin-heading .subtitle {
  margin-top: 5px;
  font-size: 12px;
}
.checkin-count {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  flex-shrink: 0;
  color: var(--muted);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}
.checkin-count strong {
  color: var(--accent);
  font-size: 42px;
  line-height: 1;
  letter-spacing: -1.5px;
}
.checkin-count span {
  margin-top: 5px;
}
.checkin-card > .checkin-track {
  height: 7px;
  margin: 18px 0 9px;
}
.checkin-track > span {
  background: linear-gradient(
    90deg,
    var(--accent),
    color-mix(in srgb, var(--accent) 65%, var(--gold))
  );
}
.checkin-meta {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 5px 16px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
}
.checkin-preview {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 20px 0 24px;
}
.checkin-current,
.checkin-upcoming {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 9px;
  padding: 16px;
  border-radius: 15px;
}
.checkin-current {
  background: color-mix(in srgb, var(--accent) 7%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--line));
}
.checkin-current .eyebrow {
  color: var(--accent);
}
.checkin-upcoming {
  background: var(--bg);
  border: 1px solid var(--line);
}
.checkin-preview h3 {
  font-size: 17px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
.checkin-upcoming .hint {
  margin: 0;
  line-height: 1.5;
}
.checkin-claim {
  align-self: flex-start;
  min-height: 44px;
  margin-top: auto;
  padding: 10px 16px;
  box-shadow: none;
}
.checkin-claim:disabled {
  opacity: 1;
  background: transparent;
  color: var(--status);
  padding-left: 0;
  padding-right: 0;
  box-shadow: none;
}
.reward-calendar-heading {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: baseline;
  gap: 5px 12px;
  margin-bottom: 12px;
}
.reward-calendar-heading h3 {
  font-size: 15px;
}
.reward-calendar-heading .hint {
  margin: 0;
  font-size: 11px;
}
.reward-calendar {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px;
}
.reward-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  min-width: 0;
  min-height: 128px;
  padding: 10px 7px 8px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--surface);
  color: var(--text);
  text-align: center;
  transition:
    border-color 0.15s,
    background-color 0.15s;
}
.reward-cell-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.3;
  white-space: nowrap;
}
.reward-cell-top > span:last-child {
  color: var(--status);
}
.reward-cell-icon {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 11px;
  background: var(--soft);
  color: var(--accent);
  font-size: 24px;
  line-height: 1;
}
.reward-cell-label {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 32px;
  font-size: 12px;
  font-weight: 650;
  line-height: 1.4;
  overflow-wrap: anywhere;
}
.reward-cell-label small {
  font-size: 10px;
  font-weight: 500;
  margin-top: 3px;
  line-height: 1.4;
}
.reward-cell-status {
  margin-top: auto;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.4;
}
.reward-cell.is-received {
  background: color-mix(in srgb, var(--status) 4%, var(--surface));
  border-color: color-mix(in srgb, var(--status) 20%, var(--line));
}
.reward-cell.is-received .reward-cell-status {
  color: var(--status);
}
.reward-cell.is-milestone {
  background: color-mix(in srgb, var(--gold) 6%, var(--surface));
  border-color: color-mix(in srgb, var(--gold) 35%, var(--line));
}
.reward-cell.is-milestone .reward-cell-icon {
  background: color-mix(in srgb, var(--gold) 13%, var(--surface));
  color: var(--gold);
}
.reward-cell.is-milestone .reward-cell-top > span:last-child {
  color: var(--gold);
}
.reward-cell.is-grand {
  background: linear-gradient(
    145deg,
    color-mix(in srgb, var(--gold) 12%, var(--surface)),
    color-mix(in srgb, var(--accent) 8%, var(--surface))
  );
}
.reward-cell.is-today {
  border: 2px solid var(--accent);
  padding: 9px 6px 7px;
  background: color-mix(in srgb, var(--accent) 6%, var(--surface));
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 10%, transparent);
}
.reward-cell.is-today .reward-cell-status {
  color: var(--accent);
  font-weight: 750;
}
.reward-cell:hover {
  border-color: var(--accent);
  background: var(--soft);
}
.checkin-grand {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-top: 16px;
  padding: 13px 14px;
  border: 1px solid color-mix(in srgb, var(--gold) 30%, var(--line));
  border-radius: 13px;
  background: color-mix(in srgb, var(--gold) 5%, var(--surface));
  color: var(--text);
  font-size: 12px;
  font-weight: 650;
}
.checkin-grand-mark {
  flex-shrink: 0;
  color: var(--gold);
  font-size: 25px;
}
.checkin-footnote {
  margin-top: 12px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.7;
}
.checkin-notice {
  margin-top: 12px;
  padding: 10px 12px;
  border-radius: 10px;
  background: var(--soft);
  color: var(--text);
  font-size: 12px;
  line-height: 1.6;
}
.daily-reward-detail {
  padding: 24px 20px;
  margin: 8px 0 18px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--soft);
  color: var(--text);
  font-size: 20px;
  font-weight: 650;
  text-align: center;
  line-height: 1.6;
}
.daily-reward-detail.is-milestone {
  background: color-mix(in srgb, var(--gold) 8%, var(--surface));
  border-color: color-mix(in srgb, var(--gold) 35%, var(--line));
}
.achievement-overview,
.achievement-insights,
.cultivation-section,
.cultivation-summary,
.achievement-details {
  display: grid;
  gap: 16px;
}
.achievement-insights .achievement-metrics,
.cultivation-balances,
.cultivation-summary .reward-tools {
  margin: 0;
}
.achievement-overview .flame-card {
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.achievement-overview .flame-mark {
  margin: 6px 0 8px;
  line-height: 1.15;
}
.achievement-overview .flame-count {
  line-height: 1.2;
}
.achievement-overview .flame-name {
  margin-top: 6px;
  line-height: 1.3;
}
.achievement-overview .flame-best {
  margin-top: 4px;
  line-height: 1.5;
}
.achievement-bedtime {
  margin-top: 4px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
}
.achievement-chart > .hint {
  margin: 12px 0 0;
}
.achievement-chart .chart {
  margin-top: 8px;
  height: 100px;
}
.cultivation-section .breakthrough-card {
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.cultivation-section .breakthrough-card > .primary {
  width: 100%;
  margin-top: 4px;
}
.rank-summary {
  display: grid;
  gap: 8px;
  min-width: 0;
}
.rank-summary > .protection {
  margin: 0;
  padding: 0 4px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
.cultivation-summary .rank-card {
  padding: 18px;
}
.cultivation-summary .rank-seal {
  width: 48px;
  height: 48px;
  margin-bottom: 10px;
  font-size: 26px;
}
.cultivation-balances > .card {
  padding: 14px 16px;
}
.cultivation-balances .stat-value {
  font-size: 28px;
}
.achievement-details {
  align-items: start;
}
.achievement-details .realm-path {
  padding: 10px 16px;
}
.achievement-details summary {
  font-size: 13px;
}
.achievement-details .hint {
  line-height: 1.65;
}

/* Desktop lists and sheets keep compact actions and a consistent content edge. */
.today-page > .heading {
  flex-wrap: wrap;
  align-items: center;
}
.daily-reward-entry {
  flex-shrink: 0;
  padding: 9px 13px;
  color: var(--accent);
  font-size: 12px;
  box-shadow: none;
}
.task-time-editor {
  margin: 16px 0;
}
.task-time-editor .remaining-editor,
.task-time-editor .work-progress {
  margin: 0;
  border-radius: 14px;
  background: var(--bg);
  border-color: var(--line);
}
.task-time-modes {
  margin: 0 0 10px;
}
.task-time-modes button {
  min-height: 42px;
}
.task-extras {
  padding: 0 0 10px;
  margin: 16px 0;
  border-bottom: 1px solid var(--line);
}
.task-extras summary {
  min-height: 44px;
  display: list-item;
  padding: 12px 0;
  cursor: pointer;
  font-size: 13px;
  color: var(--muted);
  font-weight: 650;
}
.task-extras .form-field textarea {
  min-height: 82px;
}
.task-extra-meta {
  display: inline-block;
  margin-left: 10px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 400;
}
.task-step-row.done > span {
  color: var(--muted);
  text-decoration: line-through;
}
.task-sheet-body form > h3 {
  margin: 18px 0 4px;
}
dialog.task-sheet-open .task-actions {
  grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
}
dialog.task-sheet-open .task-actions > .task-plan-action {
  min-height: 38px;
  font-size: 12px;
  padding: 6px 10px;
}
.reminders-page {
  display: flex;
  flex-direction: column;
  gap: 18px;
  min-width: 0;
}
.reminders-page > .heading {
  margin: 0;
  align-items: center;
  flex-wrap: wrap;
}
.reminders-page .top-create {
  width: auto;
  margin: 0;
  flex-shrink: 0;
  min-height: 44px;
  padding: 10px 16px;
  box-shadow: none;
}
.reminder-filters {
  width: 100%;
  max-width: 330px;
  margin: 0;
}
.reminder-filters button {
  min-height: 42px;
}
.reminder-list {
  display: grid;
  gap: 12px;
  min-width: 0;
  align-items: start;
}
.reminder-list .reminder-row {
  margin: 0;
  border-radius: 16px;
  min-height: 112px;
  padding: 16px;
  gap: 12px;
}
.reminder-main strong {
  font-size: 15px;
  line-height: 1.5;
}
.reminder-main small {
  font-size: 11px;
}
.reminder-badge {
  flex-shrink: 0;
  align-self: flex-start;
  padding: 5px 8px;
  border-radius: 8px;
  background: var(--bg);
  color: var(--muted);
  font-size: 10px;
  font-weight: 650;
  white-space: nowrap;
}
.reminder-badge.is-enabled {
  background: color-mix(in srgb, var(--status) 8%, var(--surface));
  color: var(--status);
}
.reminders-page > .footer-note,
.reminders-page > .hint {
  margin: 0;
}
.reminder-row.off {
  opacity: 1;
  background: var(--bg);
}
.reminder-row:hover {
  border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
}
@media (min-width: 900px) {
  .achievement-overview {
    grid-template-columns: minmax(220px, 0.8fr) minmax(0, 1.6fr);
  }
  .cultivation-section {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 20px;
  }
  .achievement-details {
    grid-template-columns: repeat(2, minmax(0, 1fr));

.beast-alchemy-entry {
  flex-shrink: 0;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--accent);
  border-radius: 16px;
  padding: 12px;
  font-size: 11px;
  font-weight: 700;
  min-height: 44px;
}
.beast-tabs {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 4px;
  padding: 5px;
  background: color-mix(in srgb, var(--accent) 7%, var(--surface));
  border-radius: 17px;
  margin: 20px 0;
}
.beast-tab {
  border: 0;
  min-height: 46px;
  padding: 8px 2px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  background: none;
  white-space: normal;
  overflow-wrap: anywhere;
  min-width: 0;
  line-height: 1.4;
}
.beast-tab[aria-current='page'] {
  background: var(--surface);
  color: var(--accent);
  box-shadow: 0 3px 10px #241c4810;
}
.beast-notice {
  border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--line));
  background: color-mix(in srgb, var(--accent) 5%, var(--surface));
  padding: 18px;
  border-radius: 18px;
  margin: 12px 0;
  font-size: 13px;
}
.beast-notice h2 {
  font-size: 17px;
}
.beast-notice .hint {
  line-height: 1.7;
  margin: 8px 0;
}
.beast-empty {
  text-align: center;
  padding: 44px 22px;
}
.beast-empty h2 {
  font-size: 21px;
}
.beast-empty-symbol {
  display: block;
  color: var(--accent);
  font-size: 65px;
  margin-bottom: 10px;
}
.beast-empty .hint {
  max-width: 340px;
  margin: 12px auto 24px;
  line-height: 1.8;
}
.beast-hero {
  min-height: 395px;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  padding-bottom: 14px;
  position: relative;
  isolation: isolate;
  overflow: hidden;
  border-radius: 27px;
  background:
    radial-gradient(ellipse at 55% 65%, #8e75cc45, transparent 58%),
    linear-gradient(140deg, #242333, #302a46);
  color: #fff;
}
.beast-hero::after {
  content: '';
  position: absolute;
  z-index: -1;
  width: 260px;
  height: 65px;
  bottom: 36px;
  left: 50%;
  transform: translateX(-50%);
  border: 1px solid #b7a1e331;
  border-radius: 50%;
  box-shadow:
    0 0 0 15px #a899d30b,
    0 0 0 38px #a899d306;
}
.beast-hero-copy {
  position: relative;
  z-index: 2;
  padding: 24px 25px;
  pointer-events: none;
}
.beast-hero-copy h2 {
  margin: 8px 0 3px;
  font-size: 30px;
  font-weight: 650;
  letter-spacing: -1px;
  overflow-wrap: anywhere;
}
.beast-hero-copy p {
  color: #d6cee6;
  font-size: 12px;
  margin: 0;
}
.beast-rank {
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--rank-color);
}
.beast-role-label {
  display: inline-block;
  margin-top: 12px;
  padding: 5px 9px;
  border: 1px solid #ffffff24;
  border-radius: 8px;
  font-size: 10px;
  background: #ffffff09;
  color: #e6def5;
}
.beast-hero > img {
  position: relative;
  width: min(100%, 260px);
  height: auto;
  aspect-ratio: 1;
  justify-self: center;
  object-fit: contain;
  filter: drop-shadow(0 16px 24px #13101f77);
  z-index: 1;
}
.beast-hero-view {
  position: relative;
  justify-self: end;
  margin: 14px 18px 0;
  z-index: 3;
  color: #fff;
  background: #ffffff14;
  border: 1px solid #ffffff2d;
  backdrop-filter: blur(12px);
  border-radius: 11px;
  min-height: 44px;
  padding: 8px 13px;
  font-size: 11px;
}
.beast-role-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 16px 0 22px;
}
.beast-role-actions button {
  font-size: 11px;
}
.beast-role-actions .secondary {
  padding: 11px 14px;
  min-height: 42px;
}
.beast-progress {
  padding: 23px 22px;
}
.beast-progress-heading,
.beast-collection-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.beast-progress h2,
.beast-collection-heading h2 {
  font-size: 16px;
  margin: 0;
}
.beast-progress-heading .hint {
  font-size: 12px;
  margin: 0;
  white-space: nowrap;
}
.beast-progress-track {
  height: 15px;
  position: relative;
  isolation: isolate;
  background: color-mix(in srgb, var(--muted) 10%, var(--surface));
  border-radius: 8px;
  margin: 23px 0 12px;
  overflow: hidden;
}
.beast-progress-earned,
.beast-progress-gray {
  position: absolute;
  inset-block: 0;
  transition: width 0.5s ease;
}
.beast-progress-earned {
  left: 0;
  background: linear-gradient(90deg, #7460d5, #a89ae6);
  border-radius: 8px 0 0 8px;
}
.beast-progress-gray {
  right: 0;
  background: repeating-linear-gradient(125deg, #91909e, #91909e 5px, #a5a4b1 5px, #a5a4b1 10px);
  border-radius: 0 8px 8px 0;
}
.beast-progress-legend {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 11px;
  color: var(--accent);
}
.beast-progress-legend > span:last-child {
  color: var(--muted);
}
.beast-purity {
  font-size: 15px;
  font-weight: 700;
  margin: 23px 0 8px;
}
.beast-progress > .hint {
  line-height: 1.8;
  font-size: 11px;
}
.beast-evolution-cards {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 7px;
  margin: 18px 0;
}
.beast-evolution-card {
  padding: 9px 2px;
  border-radius: 16px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  min-width: 0;
}
.beast-evolution-card.is-current {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 5%, var(--surface));
}
.beast-evolution-card img {
  width: 100%;
  height: auto;
  aspect-ratio: 1;
  object-fit: contain;
}
.beast-evolution-card small,
.beast-evolution-card strong {
  display: block;
  font-size: 9px;
  overflow-wrap: anywhere;
  padding: 0 3px;
}
.beast-evolution-card small {
  color: var(--muted);
  margin: 2px 0 5px;
}
.beast-support {
  padding: 24px;
  margin: 22px 0;
}
.beast-eyebrow {
  font-size: 9px;
  letter-spacing: 1.8px;
  font-weight: 700;
  color: var(--accent);
}
.beast-support h3 {
  font-size: 14px;
  margin: 22px 0 7px;
}
.beast-support .hint {
  font-size: 12px;
  line-height: 1.85;
  margin: 0;
}
.beast-support .beast-eyebrow {
  margin: 0;
}
.beast-collection-heading {
  margin: 24px 0 18px;
}
.beast-collection-heading .hint {
  font-size: 11px;
}
.beast-collection-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.beast-collection-card {
  position: relative;
  min-width: 0;
  border: 1px solid var(--line);
  border-top: 2px solid var(--rank-color);
  border-radius: 19px;
  background: var(--surface);
  padding: 14px;
  color: var(--text);
  text-align: left;
}
.beast-collection-card img {
  width: 100%;
  height: auto;
  aspect-ratio: 1;
  object-fit: contain;
}
.beast-card-rank {
  font-size: 10px;
  font-weight: 800;
  color: var(--rank-color);
}
.beast-collection-card strong {
  display: block;
  font-size: 14px;
  margin: 4px 0;
}
.beast-collection-card small {
  display: block;
  font-size: 10px;
  line-height: 1.8;
  color: var(--muted);
}
.beast-atlas {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin: 32px 0;
}
.beast-atlas h2 {
  grid-column: 1/-1;
  font-size: 17px;
  margin: 12px 0;
}
.beast-atlas-entry {
  min-width: 0;
  text-align: center;
  padding: 9px 3px;
  border-radius: 15px;
  background: var(--surface);
  border: 1px solid var(--line);
}
.beast-atlas-entry img {
  width: 100%;
  aspect-ratio: 1;
  height: auto;
  object-fit: contain;
}
.beast-atlas-entry.is-unowned img {
  filter: grayscale(1) brightness(0.65);
  opacity: 0.45;
}
.beast-atlas-entry.is-unowned strong {
  color: var(--muted);
}
.beast-atlas-entry strong,
.beast-atlas-entry small {
  display: block;
  font-size: 10px;
  overflow-wrap: anywhere;
}
.beast-atlas-entry small {
  color: var(--muted);
  font-size: 9px;
  margin: 5px 0;
}
.beast-wallet {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-size: 11px;
  flex-wrap: wrap;
  margin: 22px 0 15px;
  color: var(--muted);
}
.beast-wallet strong {
  color: var(--text);
}
.beast-wallet button {
  font-size: 11px;
}
.beast-summon-banner {
  position: relative;
  min-height: 425px;
  overflow: hidden;
  isolation: isolate;
  border-radius: 26px;
  background:
    radial-gradient(ellipse at 55% 63%, #8a80c54d, transparent 65%),
    linear-gradient(135deg, #242236, #352c4c);
  color: #fff;
  padding: 27px 25px;
}
.beast-summon-banner .beast-eyebrow {
  color: #c1b2ee;
}
.beast-summon-banner h2 {
  position: relative;
  z-index: 2;
  white-space: pre-line;
  font-size: 31px;
  line-height: 1.25;
  letter-spacing: -1px;
  max-width: 260px;
  margin: 13px 0;
}
.beast-summon-banner img {
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  width: 310px;
  height: 310px;
  object-fit: contain;
  filter: drop-shadow(0 12px 24px #18102c70);
  z-index: 1;
}
.beast-banner-label,
.beast-banner-note {
  position: absolute;
  z-index: 2;
  left: 25px;
  right: 20px;
  bottom: 42px;
  color: #ece5ff;
  font-size: 11px;
}
.beast-banner-note {
  bottom: 17px;
  font-size: 9px;
  color: #c9beda;
}
.beast-banner-label {
  margin: 0;
  text-shadow: 0 2px 8px #20152f;
}
.beast-summon-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 18px 0;
}
.beast-summon-actions button {
  min-height: 52px;
  font-size: 12px;
  padding: 12px 8px;
  border-radius: 15px;
}
.beast-pity {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 18px;
  justify-content: space-between;
  align-items: center;
  padding: 16px 0;
  color: var(--muted);
  font-size: 11px;
}
.beast-pity button {
  font-size: 11px;
}
.beast-picker {
  display: grid;
  gap: 9px;
  margin: 20px 0;
}
.beast-picker-item {
  display: flex;
  align-items: center;
  gap: 14px;
  text-align: left;
  padding: 6px 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 15px;
  color: var(--text);
  font-size: 13px;
  min-height: 76px;
}
.beast-picker-item img {
  width: 66px;
  height: 66px;
  flex-shrink: 0;
  object-fit: contain;
}
.beast-picker-copy {
  display: grid;
  gap: 4px;
  min-width: 0;
  padding: 8px 0;
  overflow-wrap: anywhere;
}
.beast-picker-copy small {
  font-size: 11px;
  line-height: 1.5;
  color: var(--muted);
}
.beast-picker-copy .beast-picker-role {
  color: var(--accent);
}
.beast-detail-image {
  display: block;
  margin: 4px auto;
  width: min(100%, 290px);
  height: auto;
  aspect-ratio: 1;
  object-fit: contain;
}
.beast-evolutions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 15px 0;
}
.beast-evolutions button {
  font-size: 10px;
  padding: 10px 5px;
}
.beast-cost {
  font-size: 18px;
  font-weight: 700;
  margin: 24px 0;
}
.beast-furnace {
  text-align: center;
  margin: 18px auto;
  font-size: 95px;
  line-height: 1.4;
  color: var(--accent);
  filter: drop-shadow(0 6px 20px #8f7bd14a);
}
.beast-alchemy-count {
  font-size: 17px;
  font-weight: 700;
  text-align: center;
}
.beast-sheet-open #sheet-content > .hint {
  margin: 12px 0;
}
.beast-alchemy-overview {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 8px 0 16px;
}
.beast-alchemy-overview > div:last-child {
  min-width: 0;
}
.beast-alchemy-overview h3 {
  font-size: 18px;
  margin: 6px 0;
}
.beast-alchemy-overview .beast-furnace {
  width: 100px;
  flex: 0 0 100px;
  margin: 0;
}
.beast-alchemy-overview .beast-alchemy-count {
  text-align: left;
  font-size: 14px;
  color: var(--muted);
}
.beast-alchemy-progress {
  display: block;
  width: 100%;
  height: 8px;
  accent-color: var(--accent);
  border: 0;
  border-radius: 8px;
  overflow: hidden;
  background: var(--line);
}
.beast-alchemy-progress::-webkit-progress-bar {
  background: var(--line);
}
.beast-alchemy-progress::-webkit-progress-value {
  background: var(--accent);
  border-radius: 8px;
}
.beast-alchemy-progress::-moz-progress-bar {
  background: var(--accent);
}
.beast-alchemy-chance {
  font-size: 12px;
  color: var(--muted);
  margin: 12px 0 16px;
}
.beast-alchemy-chance.is-guaranteed {
  color: var(--accent);
  font-weight: 650;
}
.beast-alchemy-craft,
.beast-alchemy-stock > button,
.beast-tower-claim,
.beast-tower-continue {
  width: 100%;
}
.beast-alchemy-stock {
  display: grid;
  gap: 10px;
  padding: 20px 0;
  margin-top: 20px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.beast-alchemy-stock h3 {
  font-size: 15px;
}
.beast-alchemy-rules {
  margin-top: 12px;
}
.beast-alchemy-rules summary {
  display: list-item;
  cursor: pointer;
  color: var(--muted);
  padding: 12px 0;
  min-height: 44px;
  font-size: 12px;
}
.beast-alchemy-rules .hint {
  margin: 0 0 12px;
  line-height: 1.7;
}
.beast-elixir-picker {
  display: grid;
  gap: 8px;
  margin: 16px 0;
}
.beast-empty-note {
  padding: 20px 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
}
.beast-alchemy-result {
  display: grid;
  gap: 16px;
  text-align: center;
}
.beast-alchemy-result .beast-furnace {
  width: 150px;
  margin: 0 auto;
}
.beast-alchemy-result .hint {
  line-height: 1.6;
}
.beast-tower-requirements {
  list-style: none;
  padding: 0;
  margin: 16px 0;
  display: grid;
  gap: 12px;
  font-size: 13px;
  color: var(--muted);
}
.beast-tower-requirements [data-met='true'] {
  color: var(--accent);
}
.beast-tower-step.is-current {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}
.beast-tower-claim,
.beast-tower-continue {
  margin-top: 12px;
}
.beast-furnace {
  width: 230px;
  max-width: 80%;
  font-size: initial;
}
.beast-furnace svg {
  width: 100%;
  display: block;
}
.beast-furnace-core {
  animation: beast-core-pulse 3s ease-in-out infinite;
}
.beast-furnace-vapor {
  animation: beast-vapor 4s ease-in-out infinite;
}
.beast-furnace[data-mode='failed'] .beast-furnace-vapor {
  opacity: 0.18;
  animation: none;
}
.beast-elixir-pearl {
  filter: drop-shadow(0 0 12px #e6c48d);
  animation: beast-reveal-in 0.7s both;
}
.beast-target-picker {
  display: grid;
  gap: 8px;
  margin: 18px 0;
}
.beast-target-option {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 48px;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  font-size: 13px;
}
.beast-target-option input {
  accent-color: var(--accent);
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}
.beast-reward-choice {
  padding: 20px;
  margin: 16px 0;
}
.beast-reward-choice h2 {
  font-size: 16px;
}
.beast-reward-choice button {
  margin: 8px 8px 0 0;
  min-height: 44px;
}
@keyframes beast-vapor {
  0%,
  100% {
    opacity: 0.35;
    transform: translateY(3px);
  }
  50% {
    opacity: 0.85;
    transform: translateY(-4px);
  }
}
@keyframes beast-core-pulse {
  50% {
    opacity: 0.5;
  }
}
.beast-tower-entry {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 19px;
  margin: 20px 0;
  border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--line));
  background: linear-gradient(
    125deg,
    color-mix(in srgb, var(--accent) 6%, var(--surface)),
    var(--surface)
  );
}
.beast-tower-entry h3 {
  font-size: 16px;
  margin: 8px 0;
}
.beast-tower-entry .beast-eyebrow {
  margin: 0;
}
.beast-tower-entry .hint {
  font-size: 11px;
  margin: 0;
  line-height: 1.7;
}
.beast-tower-entry button {
  font-size: 11px;
  white-space: nowrap;
  padding: 12px;
  flex-shrink: 0;
}
.beast-tower-track {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 5px;
  margin: 23px 0;
}
.beast-tower-step {
  text-align: center;
  padding: 12px 3px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
}
.beast-tower-step strong,
.beast-tower-step small {
  display: block;
  font-size: 10px;
}
.beast-tower-step small {
  font-size: 9px;
  color: var(--muted);
  margin-top: 7px;
  line-height: 1.6;
}
.beast-tower-step.is-cleared {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 7%, var(--surface));
}
.beast-tower-risk {
  font-size: 14px;
  font-weight: 650;
  color: var(--accent);
  margin: 18px 0;
}
.beast-tower-cards {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 9px;
  margin: 25px 0;
}
.beast-tower-card {
  height: 125px;
  min-width: 0;
  border: 1px solid #c1b3ee85;
  border-radius: 14px;
  background:
    radial-gradient(ellipse, #b3a3e22b, transparent 65%), linear-gradient(155deg, #44385f, #252136);
  color: #d8c5ff;
  font-size: 27px;
  box-shadow:
    inset 0 0 0 5px #ffffff08,
    0 6px 15px #211c3914;
  transition: transform 0.2s;
}
.beast-tower-card:hover {
  transform: translateY(-4px);
}
dialog.beast-reveal {
  position: fixed;
  inset: 0;
  width: 100vw;
  max-width: none;
  height: 100dvh;
  max-height: none;
  margin: 0;
  padding: 24px 20px 40px;
  border: 0;
  border-radius: 0;
  background: radial-gradient(
    ellipse at 50% 40%,
    color-mix(in srgb, var(--rank-color) 20%, #171322),
    #14111d 70%
  );
  color: #fff;
  overflow: auto;
  z-index: 20;
}
.beast-reveal::backdrop {
  background: #14111d;
}
.beast-reveal-stage {
  min-height: calc(100dvh - 64px);
  max-width: 780px;
  margin: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.beast-reveal-skip {
  position: fixed;
  top: 25px;
  right: 24px;
  z-index: 3;
  background: #ffffff0d;
  border: 1px solid #ffffff26;
  border-radius: 25px;
  padding: 12px 17px;
  color: #e2daef;
  font-size: 12px;
}
.beast-reveal-caption {
  letter-spacing: 2.5px;
  font-size: 10px;
  color: var(--rank-color);
  line-height: 2;
}
.beast-reveal-stage > img {
  width: min(360px, 85vw);
  height: auto;
  aspect-ratio: 1;
  object-fit: contain;
  filter: drop-shadow(0 12px 35px color-mix(in srgb, var(--rank-color) 24%, transparent));
  animation: beast-reveal-in 0.65s both;
}
.beast-reveal-stage h2 {
  font-size: 40px;
  letter-spacing: -1px;
  margin: 0;
}
.beast-reveal-subtitle {
  font-size: 13px;
  color: #bfb2d2;
  margin: 12px 0 28px;
}
.beast-reveal-stage > .primary {
  min-width: 200px;
  margin-top: 24px;
}
.beast-summon-sigil {
  width: 220px;
  height: 220px;
  border: 1px solid var(--rank-color);
  transform: rotate(45deg);
  box-shadow:
    0 0 60px color-mix(in srgb, var(--rank-color) 20%, transparent),
    inset 0 0 50px color-mix(in srgb, var(--rank-color) 15%, transparent);
  position: relative;
  animation: beast-converge 1.8s ease-in both;
  margin: 90px 0;
}
.beast-summon-sigil::before,
.beast-summon-sigil::after {
  content: '';
  position: absolute;
  inset: 30px;
  border: 1px solid var(--rank-color);
  border-radius: 50%;
}
.beast-summon-sigil::after {
  inset: 85px;
  border: 0;
  background: var(--rank-color);
  box-shadow: 0 0 80px 10px var(--rank-color);
}
.beast-result-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px;
  width: 100%;
  margin: 15px 0;
}
.beast-result-card {
  border: 1px solid color-mix(in srgb, var(--rank-color) 65%, #ffffff12);
  border-radius: 13px;
  padding: 8px 3px;
  background: #ffffff06;
  min-width: 0;
}
.beast-result-card img {
  width: 100%;
  height: auto;
  aspect-ratio: 1;
  object-fit: contain;
}
.beast-result-card strong,
.beast-result-card small {
  display: block;
  font-size: 10px;
  overflow-wrap: anywhere;
}
.beast-result-card small {
  color: var(--rank-color);
  font-size: 9px;
  margin: 5px 0;
}
@keyframes beast-converge {
  0% {
    transform: rotate(0) scale(0.7);
    opacity: 0;
  }
  45% {
    opacity: 1;
  }
  100% {
    transform: rotate(135deg) scale(1.1);
    opacity: 1;
  }
}
@keyframes beast-reveal-in {
  from {
    opacity: 0;
    transform: translateY(20px) scale(0.96);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}
@media (min-width: 768px) {
  .beast-hero {
    min-height: 430px;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    align-items: center;
  }
  .beast-hero > img {
    width: min(100%, 340px);
    grid-column: 2;
    grid-row: 1;
  }
  .beast-hero-copy {
    padding: 28px 30px;
    align-self: start;
  }
  .beast-hero-view {
    grid-column: 2;
  }
  .beast-hero-copy h2 {
    font-size: 35px;
  }
}
@media (max-width: 380px) {
  .beast-tabs {
    gap: 2px;
    padding: 4px;
  }
  .beast-tab {
    font-size: 10px;
  }
  .beast-alchemy-entry {
    font-size: 10px;
    padding: 10px;
  }
  .beast-hero {
    min-height: 370px;
  }
  .beast-hero > img {
    width: min(100%, 240px);
  }
  .beast-hero-copy h2 {
    font-size: 27px;
  }
  .beast-tower-entry {
    padding: 16px;
  }
  .beast-tower-entry h3 {
    font-size: 14px;
  }
  .beast-summon-actions button {
    font-size: 11px;
  }
  .beast-result-grid {
    gap: 5px;
  }
  .beast-result-card strong {
    font-size: 8px;
  }
}
@media (prefers-reduced-motion: reduce) {
  .beast-page *,
  .beast-reveal *,
  .beast-tower-card {
    animation: none !important;
    transition: none !important;
  }
}

          sheetContent2.append(el("p", "\u0110\xE3 c\xF3 b\u1EA3o h\u1ED9: c\u1EE9u 1 b\u1EABy \u1EDF t\u1EA7ng 1\u20133.", "beast-tower-risk"));
        const start = button(
          "B\u1EAFt \u0111\u1EA7u leo th\xE1p",
          async () => {
            const result = await mutateBeast({ operation: "tower_start" });
            if (result && isCurrent()) openBeastTower();
          },
          "primary"
        );
        start.disabled = !data.eligibility.eligible || state2.beastBusy || !!runtime2.pendingBeast;
        sheetContent2.append(start);
        return;
      }
      if (["claimed", "expired", "failed"].includes(run.status)) {
        sheetContent2.append(
          el(
            "h3",
            run.status === "failed" ? "Giao \u01B0\u1EDBc ch\u01B0a th\xE0nh" : run.cleared ? "Qu\xE0 \u0111\xE3 v\xE0o v\xED" : "L\u01B0\u1EE3t th\xE1p \u0111\xE3 k\u1EBFt th\xFAc"
          ),
          el(
            "p",
            run.status === "failed" ? "C\u1EADu g\u1EB7p b\u1EABy. Ch\u1EC9 qu\xE0 c\u1EE7a l\u01B0\u1EE3t n\xE0y m\u1EA5t \u0111i; v\xE9 trong v\xED \u0111\u01B0\u1EE3c gi\u1EEF nguy\xEAn." : beastRewardLabel(run.atRisk),
            "hint"
          ),
          el("p", "H\u1EB9n c\u1EADu l\u01B0\u1EE3t m\u1EDBi v\xE0o ng\xE0y sinh ho\u1EA1t k\u1EBF ti\u1EBFp.", "hint")
        );
        return;
      }
      sheetContent2.append(
        el("h3", "T\u1EA7ng " + run.floor),
        el(
          "p",
          (run.cleared ? "Qu\xE0 ch\u01B0a nh\u1EADn: " : "") + beastRewardLabel(run.atRisk),
          "beast-tower-risk"
        )
      );
      if (run.rescueAvailable)
        sheetContent2.append(el("p", "B\u1EA3o h\u1ED9 s\u1EB5n s\xE0ng \xB7 C\u1EE9u 1 b\u1EABy \u1EDF t\u1EA7ng 1\u20133.", "hint"));
      if (run.lastResult === "rescued")
        sheetContent2.append(
          el("p", "Ph\xE2n th\xE2n \u0111\xE3 c\u1EE9u m\u1ED9t l\u1EA7n. C\xE1c l\xE1 \u0111\xE3 x\xE1o l\u1EA1i; v\u1EABn c\xF2n m\u1ED9t b\u1EABy.", "hint")
        );
      if (run.status === "choosing") {
        sheetContent2.append(el("p", `Ch\u1ECDn m\u1ED9t trong ${run.cards} l\xE1. C\xF3 \u0111\xFAng m\u1ED9t l\xE1 b\u1EABy.`, "hint"));
        const cards = el("div", void 0, "beast-tower-cards");
        for (let card2 = 0; card2 < run.cards; card2++) {
          const control = button(
            "\u2726",
            async () => {
              const result = await mutateBeast({
                operation: "tower_pick",
                runVersion: run.version,
                card: card2
              });
              if (result && isCurrent()) openBeastTower();
            },
            "beast-tower-card"
          );
          control.setAttribute("aria-label", "L\u1EADt l\xE1 " + (card2 + 1));
          control.disabled = state2.beastBusy || !!runtime2.pendingBeast;
          cards.append(control);
        }
        sheetContent2.append(cards);
      } else {
        sheetContent2.append(
          button(
            "D\u1EEBng \xB7 Nh\u1EADn " + beastRewardLabel(run.atRisk),
            async () => {
              const result = await mutateBeast({ operation: "tower_claim", runVersion: run.version });
              if (result && isCurrent()) openBeastTower();
            },
            "primary beast-tower-claim"
          )
        );
        if (run.floor < 4)
          sheetContent2.append(
            button(
              "\u0110i ti\u1EBFp \xB7 " + beastRewardLabel(run.nextReward),
              () => confirm(
                "\u0110\xE1nh c\u01B0\u1EE3c \u0111i ti\u1EBFp?",
                `N\u1EBFu g\u1EB7p b\u1EABy, c\u1EADu m\u1EA5t ${beastRewardLabel(run.atRisk)} ch\u01B0a nh\u1EADn c\u1EE7a l\u01B0\u1EE3t n\xE0y. Qu\xE0 t\u1EA7ng sau thay th\u1EBF qu\xE0 hi\u1EC7n t\u1EA1i.`,
                async () => {
                  const title = sheetContent2.firstElementChild;
                  const result = await mutateBeast({
                    operation: "tower_continue",
                    runVersion: run.version
                  });
                  if (result && state2.loaded && state2.live && sheetContent2.firstElementChild === title)
                    openBeastTower();
                }
              ),
              "secondary beast-tower-continue"
            )
          );
      }
      for (const control of sheetContent2.querySelectorAll(
        ".beast-tower-claim, .beast-tower-continue"
      ))
        control.disabled = state2.beastBusy || !!runtime2.pendingBeast;
    }
    return {
      loadBeasts,
      loadTower,
      setBeastPanel,
      openBeastPicker,
      showBeast,
      openBeastExchange,
      openBeastRates,
      summonBeast,
      showBeastReveal,
      openBeastAlchemy,
      openBeastTower,
      recoverBeast,
      openBeastUltimate,
      chooseBeastReward,
      openBeastSummonChoice,
      openBeastDrawChoices,
      beastPending: () => !!runtime2.pendingBeast,
      cancelBeastRole: async (role) => {
        const result = await mutateBeast({ operation: "cancel", role });
        if (result) toast("\u0110\xE3 h\u1EE7y l\u1EF1a ch\u1ECDn \u0111ang ch\u1EDD.");
      }
    };
  }

  // web/ui/feedback.js
  function createFeedback({ sheet: sheet2 }) {
    let toastTimer;
    function toast(message, action) {
      const inline = (
        /** @type {HTMLElement|null} */
        document.querySelector("#sheet-feedback")
      );
      if (sheet2.open && inline) {
        inline.textContent = message;
        inline.hidden = false;
      }
      const node = document.querySelector("#toast");
      clearTimeout(toastTimer);
      node.textContent = message;
      if (action) {
        const control = document.createElement("button");
        control.type = "button";
        control.textContent = action.label;
        control.addEventListener(
          "click",
          () => {
            clearTimeout(toastTimer);
            node.classList.remove("visible");
            node.replaceChildren();
            action.run();
          },
          { once: true }
        );
        node.append(control);
      }
      node.classList.add("visible");
      toastTimer = setTimeout(
        () => {
          node.classList.remove("visible");
          node.replaceChildren();
        },
        action ? 6e3 : 3500
      );
    }
    return { toast };
  }

  // web/ui/sheets.js
  function createSheets({ sheet: sheet2, sheetContent: sheetContent2, render }) {
    function lockPageScroll() {
      document.documentElement.classList.add("sheet-open");
      document.body.classList.add("sheet-open");
    }
    function unlockPageScroll() {
      document.documentElement.classList.remove("sheet-open");
      document.body.classList.remove("sheet-open");
    }
    function resetSheetLayout() {
      sheet2.classList.remove("task-sheet-open", "schedule-sheet-open", "reward-sheet-open");
      sheet2.classList.remove("settings-sheet-open", "draw-sheet-open");
      sheet2.classList.remove("beast-sheet-open");
      sheet2.scrollTop = 0;
    }
    function closeSheet() {
      resetSheetLayout();
      if (sheet2.open) sheet2.close();
      else {
        unlockPageScroll();
        render();
      }
    }
    function openSheet(title) {
      resetSheetLayout();
      sheetContent2.replaceChildren();
      const row = el("div", void 0, "sheet-title-row"), h = el("h2", title);
      h.id = "sheet-title";
      h.tabIndex = -1;
      const close = button("", closeSheet, "icon-button");
      close.setAttribute("aria-label", "\u0110\xF3ng");
      close.setAttribute("data-sheet-close", "true");
      close.append(icon("close"));
      row.append(h, close);
      sheetContent2.append(row);
      const feedback = el("p", "", "form-feedback");
      feedback.id = "sheet-feedback";
      feedback.hidden = true;
      feedback.setAttribute("role", "status");
      sheetContent2.append(feedback);
      if (!sheet2.open) {
        lockPageScroll();
        sheet2.showModal();
      }
      h.focus({ preventScroll: true });
    }
    function confirm(title, description, action) {
      openSheet(title);
      sheetContent2.append(el("p", description, "hint"));
      const actions2 = el("div", void 0, "actions");
      actions2.append(
        button(
          "X\xE1c nh\u1EADn",
          () => {
            sheet2.close();
            action();
          },
          "primary"
        ),
        button("Quay l\u1EA1i", () => sheet2.close(), "secondary")
      );
      sheetContent2.append(actions2);
    }
    function installSheetEvents() {
      sheet2.addEventListener("click", (event) => {
        const target = event.target?.closest?.("[data-sheet-close]");
        if (target) {
          event.preventDefault();
          closeSheet();
          return;
        }
        if (event.target === sheet2) {
          const r = sheet2.getBoundingClientRect();
          if (event.clientY < r.top) closeSheet();
        }
      });
      sheet2.addEventListener("cancel", (event) => {
        event.preventDefault();
        closeSheet();
      });
      sheet2.addEventListener("close", () => {
        if (sheet2.open) return;
        resetSheetLayout();
        unlockPageScroll();
        render();
      });
      const rewardHintCleaner = new MutationObserver(() => {
        for (const node of sheetContent2.querySelectorAll(".hint")) {
          if (node.textContent?.includes("/ngu kh\xF4ng kh\xF3a quay th\u01B0\u1EDFng"))
            node.textContent = node.textContent.replace(/\s*\/ngu không khóa quay thưởng\.?/, "");
        }
      });
      rewardHintCleaner.observe(sheetContent2, { childList: true, subtree: true });
    }
    return { openSheet, closeSheet, confirm, installSheetEvents };
  }

  // web/app.js
  var state = createAppState(true);
  var runtime = createRuntimeState();
  var content = document.querySelector("#content");
  var sheet = document.querySelector("#sheet");
  var sheetContent = document.querySelector("#sheet-content");
  var actions = {};
  var forward = {
    render: (...args) => actions.render(...args),
    toast: (...args) => actions.toast(...args),
    showBrowserLogin: (...args) => actions.showBrowserLogin(...args),
    refreshOnReturn: (...args) => actions.refreshOnReturn(...args),
    renderBrowserLogin: (...args) => actions.renderBrowserLogin(...args),
    connected: (...args) => actions.connected(...args)
  };
  for (const name of [
    "loadHabits",
    "loadMoreHabits",
    "loadMoreReminders",
    "openHabit",
    "openHabitDetails",
    "openHabitLog",
    "openHabitSlot",
    "showHabitInList",
    "toggleHabit",
    "setHabitFilter",
    "showHabitPanel",
    "loadHabitHistory",
    "setHabitReportSpan",
    "setHabitHistoryStatus",
    "exportHabits",
    "openHabitExport",
    "loadBeasts",
    "loadTower",
    "setBeastPanel",
    "openBeastPicker",
    "showBeast",
    "openBeastExchange",
    "openBeastRates",
    "summonBeast",
    "showBeastReveal",
    "openBeastAlchemy",
    "openBeastTower",
    "recoverBeast",
    "cancelBeastRole",
    "beastPending",
    "openBeastUltimate",
    "chooseBeastReward",
    "openBeastSummonChoice",
    "openBeastDrawChoices"
  ])
    forward[name] = (...args) => actions[name](...args);
  forward.loadActiveTasks = (...args) => actions.loadActiveTasks(...args);
  forward.renderSleepControls = (...args) => actions.renderSleepControls(...args);
  for (const name of [
    "render",
    "toast",
    "openSheet",
    "closeSheet",
    "confirm",
    "performLive",
    "toggleTask",
    "openTask",
    "confirmDelete",
    "loadHistory",
    "toggleTaskFocus",
    "openTodayPlan",
    "openReminder",
    "openSettings",
    "openAvailability",
    "openShare",
    "demoDay",
    "claimCheckin",
    "openRewardCalendar",
    "openDailyReward",
    "openDraw",
    "openInventory",
    "openBreakthrough",
    "showBrowserLogin",
    "connected",
    "renderBrowserLogin",
    "refreshOnReturn",
    "startConnection"
  ])
    forward[name] = (...args) => actions[name](...args);
  var ui = {
    ...dom_exports,
    ...forward,
    state: () => state,
    cultivation: () => state.cultivation,
    keepViewAnchor(node, top) {
      if (Number.isFinite(top))
        window.scrollBy({ top: node.getBoundingClientRect().top - top, behavior: "instant" });
    }
  };
  var context = { state, runtime, ui, content, sheet, sheetContent, ...forward };
  Object.assign(actions, createFeedback(context));
  Object.assign(actions, createSheets(context));
  Object.assign(actions, createMutations(context));
  Object.assign(actions, createTaskActions(context));
  Object.assign(actions, createTodayPlanActions(context));
  Object.assign(actions, createReminderActions(context));
  Object.assign(actions, createScheduleActions(context));
  Object.assign(actions, createSleepActions(context));
  Object.assign(actions, createCultivationActions(context));
  Object.assign(actions, createHabitActions(context));
  Object.assign(actions, createBeastActions(context));
  Object.assign(actions, createBrowserLoginActions(context));
  Object.assign(actions, createLifecycle(context));
  applyTheme();
  applyExperiencePreferences();
  window.addEventListener("storage", (event) => {
    if (event.key === storageKey || event.key === null) {
      reloadExperiencePreferences();
      actions.render();
    }
  });
  actions.installSheetEvents();
  actions.installLifecycleEvents();
  document.querySelector("#settings").replaceChildren(icon("settings"));
  document.querySelector("#settings").addEventListener("click", actions.openSettings);
  document.querySelector("#logout").addEventListener("click", async () => {
    const control = (
      /** @type {HTMLButtonElement} */
      document.querySelector("#logout")
    );
    control.disabled = true;
    try {
      await browserAuthRequest("logout");
      actions.showBrowserLogin();
    } catch (error) {
      actions.toast(error.message);
    } finally {
      control.disabled = false;
    }
  });
  for (
    const b of
    /** @type {NodeListOf<HTMLButtonElement>} */
    document.querySelectorAll("[data-tab]")
  )
    b.addEventListener("click", () => {
      if (state.live && !state.loaded) {
        actions.toast("M\u1EDF l\u1EA1i t\u1EEB Telegram \u0111\u1EC3 t\u1EA3i d\u1EEF li\u1EC7u th\u1EADt.");
        return;
      }
      state.tab = b.dataset.tab;
      state.screenState = "ready";
      actions.render();
      actions.refreshOnReturn();
      if (state.tab !== "habits") window.scrollTo(0, 0);
    });
  if (state.live) actions.startConnection();
  else actions.render();
})();
</script>
